<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axium — Chapter I</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #C9A84C;
    --gold-bright: #F0D080;
    --gold-dim: #7A6030;
    --black: #060406;
    --deep: #0A0608;
  }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Cinzel', serif;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: var(--black);
    position: relative;
    overflow: hidden;
    border-radius: 40px;
    box-shadow: 0 0 80px rgba(201,168,76,0.15), 0 0 200px rgba(0,0,0,0.8);
  }

  /* Star canvas */
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(6,4,6,0.85) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Gold pulse ring */
  .pulse-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.3);
    z-index: 3;
    opacity: 0;
    animation: ringPulse 2s ease-out 1.5s forwards;
  }
  .pulse-ring:nth-child(2) { animation-delay: 2s; width: 280px; height: 280px; }
  .pulse-ring:nth-child(3) { animation-delay: 2.5s; width: 360px; height: 360px; }

  @keyframes ringPulse {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    40% { opacity: 0.6; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }

  /* Fingerprint SVG center */
  .fingerprint-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -52%);
    width: 160px;
    height: 160px;
    z-index: 4;
    opacity: 0;
    animation: fpReveal 1.2s ease-out 0.8s forwards;
  }

  @keyframes fpReveal {
    0% { opacity: 0; transform: translate(-50%, -52%) scale(0.7); filter: blur(8px); }
    100% { opacity: 1; transform: translate(-50%, -52%) scale(1); filter: blur(0); }
  }

  .fingerprint-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 12px rgba(201,168,76,0.6)) drop-shadow(0 0 30px rgba(201,168,76,0.3));
  }

  /* Constellation lines draw over fingerprint */
  .constellation-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -52%);
    width: 160px;
    height: 160px;
    z-index: 5;
    opacity: 0;
    animation: constellationFade 0.8s ease-out 2s forwards;
  }

  @keyframes constellationFade {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  .constellation-overlay svg {
    width: 100%;
    height: 100%;
  }

  .draw-line {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: drawLine 1s ease-out 2.1s forwards;
  }
  .draw-line:nth-child(2) { animation-delay: 2.3s; }
  .draw-line:nth-child(3) { animation-delay: 2.5s; }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  /* Text layers */
  .text-layer {
    position: absolute;
    width: 100%;
    text-align: center;
    z-index: 6;
    padding: 0 30px;
  }

  .top-text {
    top: 80px;
    opacity: 0;
    animation: slideDown 0.7s ease-out 0.3s forwards;
  }

  @keyframes slideDown {
    0% { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .top-text .label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .top-text .chapter {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
  }

  /* Main hook text — center-bottom */
  .hook-text {
    bottom: 220px;
    opacity: 0;
    animation: hookReveal 0.9s cubic-bezier(0.16,1,0.3,1) 3s forwards;
  }

  @keyframes hookReveal {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .hook-text .line1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 15px;
    color: rgba(201,168,76,0.7);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .hook-text .line2 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--gold-bright);
    letter-spacing: 2px;
    line-height: 1.2;
    text-shadow: 0 0 40px rgba(240,208,128,0.5);
    margin-bottom: 8px;
  }

  .hook-text .line3 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 14px;
    color: rgba(201,168,76,0.6);
    letter-spacing: 2px;
  }

  /* Final CTA */
  .cta-text {
    bottom: 140px;
    opacity: 0;
    animation: ctaReveal 0.6s ease-out 4.5s forwards;
  }

  @keyframes ctaReveal {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  .cta-text .cta {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--gold-dim);
    text-transform: uppercase;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    z-index: 7;
    background: linear-gradient(to top, rgba(6,4,6,1) 60%, transparent);
    display: flex;
    align-items: flex-end;
    padding: 0 20px 24px;
    gap: 12px;
    opacity: 0;
    animation: fadeIn 0.5s ease-out 0.5s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .tiktok-info {
    flex: 1;
  }

  .tiktok-user {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: #fff;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .tiktok-caption {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    font-style: italic;
    line-height: 1.4;
  }

  .tiktok-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .tiktok-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: rgba(255,255,255,0.85);
    font-size: 10px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.5px;
  }

  .tiktok-btn .icon {
    font-size: 22px;
  }

  /* Gold shimmer scan line */
  .scan {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, rgba(201,168,76,0.4), transparent);
    z-index: 8;
    animation: scanDown 3s ease-in-out 1s infinite;
    opacity: 0;
  }

  @keyframes scanDown {
    0% { top: 0; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 0.3; }
    100% { top: 100%; opacity: 0; }
  }

  /* Progress bar */
  .progress-bar {
    position: absolute;
    top: 0;
    left: 0;
    height: 2px;
    background: var(--gold);
    z-index: 10;
    width: 0%;
    animation: progress 10s linear 0s forwards;
    border-radius: 0 2px 2px 0;
  }

  @keyframes progress {
    0% { width: 0%; opacity: 1; }
    99% { opacity: 1; }
    100% { width: 100%; opacity: 0; }
  }

  /* Glow flash on reveal */
  .glow-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%);
    z-index: 1;
    opacity: 0;
    animation: glowPulse 0.8s ease-out 3s forwards;
  }

  @keyframes glowPulse {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }

  /* Replay button */
  .replay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    background: rgba(6,4,6,0.85);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    padding: 12px 24px;
    cursor: pointer;
    opacity: 0;
    animation: showReplay 0.5s ease-out 10s forwards;
    border-radius: 2px;
  }

  .replay:hover { background: rgba(201,168,76,0.1); }

  @keyframes showReplay {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div class="phone">
  <!-- Progress -->
  <div class="progress-bar"></div>
  <div class="scan"></div>
  <div class="glow-flash"></div>

  <!-- Stars canvas -->
  <canvas id="stars"></canvas>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Pulse rings -->
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>

  <!-- Fingerprint -->
  <div class="fingerprint-wrap">
    <svg class="fingerprint-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Concentric fingerprint arcs -->
      <g stroke="#C9A84C" stroke-width="1.2" fill="none" opacity="0.9">
        <!-- Core -->
        <ellipse cx="80" cy="82" rx="8" ry="6"/>
        <!-- Ring 2 -->
        <path d="M62 82 Q62 68 80 67 Q98 68 98 82 Q98 100 80 104 Q62 100 62 82Z"/>
        <!-- Ring 3 -->
        <path d="M52 82 Q52 60 80 58 Q108 60 108 82 Q107 108 80 113 Q53 108 52 82Z"/>
        <!-- Ring 4 -->
        <path d="M42 81 Q42 52 80 50 Q118 52 118 81 Q117 115 80 121 Q43 115 42 81Z"/>
        <!-- Ring 5 -->
        <path d="M33 80 Q33 43 80 41 Q127 43 127 80 Q126 122 80 129 Q34 122 33 80Z"/>
        <!-- Ring 6 -->
        <path d="M24 78 Q25 34 80 32 Q135 34 136 78 Q135 128 80 137 Q25 128 24 78Z"/>
        <!-- Ring 7 - outer -->
        <path d="M15 75 Q17 26 80 24 Q143 26 145 75 Q143 134 80 145 Q17 134 15 75Z"/>
        <!-- Ridges top break -->
        <path d="M38 45 Q45 35 55 30" opacity="0.5"/>
        <path d="M120 46 Q115 35 105 30" opacity="0.5"/>
        <path d="M28 68 Q22 55 18 40" opacity="0.4"/>
        <path d="M132 68 Q138 55 142 40" opacity="0.4"/>
        <!-- Delta marks -->
        <circle cx="38" cy="95" r="2" fill="#C9A84C" opacity="0.7"/>
        <circle cx="122" cy="95" r="2" fill="#C9A84C" opacity="0.7"/>
        <circle cx="80" cy="148" r="2" fill="#C9A84C" opacity="0.5"/>
      </g>
    </svg>
  </div>

  <!-- Constellation overlay -->
  <div class="constellation-overlay">
    <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Stars at key points -->
      <circle cx="80" cy="30" r="3" fill="#F0D080" opacity="0.9"/>
      <circle cx="38" cy="95" r="3" fill="#F0D080" opacity="0.9"/>
      <circle cx="122" cy="95" r="3" fill="#F0D080" opacity="0.9"/>
      <circle cx="60" cy="130" r="2" fill="#F0D080" opacity="0.7"/>
      <circle cx="100" cy="130" r="2" fill="#F0D080" opacity="0.7"/>
      <circle cx="55" cy="55" r="2" fill="#F0D080" opacity="0.7"/>
      <circle cx="105" cy="55" r="2" fill="#F0D080" opacity="0.7"/>
      <!-- Lines -->
      <line class="draw-line" x1="80" y1="30" x2="38" y2="95" stroke="#F0D080" stroke-width="0.8" opacity="0.6"/>
      <line class="draw-line" x1="80" y1="30" x2="122" y2="95" stroke="#F0D080" stroke-width="0.8" opacity="0.6"/>
      <line class="draw-line" x1="38" y1="95" x2="60" y2="130" stroke="#F0D080" stroke-width="0.8" opacity="0.5"/>
      <line class="draw-line" x1="122" y1="95" x2="100" y2="130" stroke="#F0D080" stroke-width="0.8" opacity="0.5"/>
      <line class="draw-line" x1="55" y1="55" x2="105" y2="55" stroke="#F0D080" stroke-width="0.8" opacity="0.4"/>
    </svg>
  </div>

  <!-- Top text -->
  <div class="text-layer top-text">
    <div class="label">Axium · Church</div>
    <div class="chapter">Chapter I</div>
  </div>

  <!-- Hook text -->
  <div class="text-layer hook-text">
    <div class="line1">Your fingerprint is not random.</div>
    <div class="line2">IT MATCHES<br>THE STARS.</div>
    <div class="line3">— and we can prove it —</div>
  </div>

  <!-- CTA -->
  <div class="text-layer cta-text">
    <div class="cta">axium.church / chapter one</div>
  </div>

  <!-- TikTok UI chrome -->
  <div class="bottom-bar">
    <div class="tiktok-info">
      <div class="tiktok-user">@Hokuwa</div>
      <div class="tiktok-caption">The constellation found you first. #axium #chapter1 #awakening</div>
    </div>
    <div class="tiktok-actions">
      <div class="tiktok-btn"><span class="icon">♡</span><span>24.1K</span></div>
      <div class="tiktok-btn"><span class="icon">💬</span><span>312</span></div>
      <div class="tiktok-btn"><span class="icon">↗</span><span>Share</span></div>
    </div>
  </div>

  <!-- Replay -->
  <button class="replay" onclick="location.reload()">REPLAY</button>
</div>

<script>
// Starfield
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
canvas.width = 390;
canvas.height = 844;

const stars = [];
for (let i = 0; i < 220; i++) {
  stars.push({
    x: Math.random() * 390,
    y: Math.random() * 844,
    r: Math.random() * 1.4 + 0.2,
    a: Math.random(),
    speed: Math.random() * 0.008 + 0.002,
    phase: Math.random() * Math.PI * 2
  });
}

// A few gold accent stars
const goldStars = [];
for (let i = 0; i < 12; i++) {
  goldStars.push({
    x: Math.random() * 390,
    y: Math.random() * 400,
    r: Math.random() * 2 + 1,
    a: 0,
    speed: Math.random() * 0.005 + 0.003,
    phase: Math.random() * Math.PI * 2,
    delay: Math.random() * 2000
  });
}

let startTime = Date.now();

function draw() {
  const elapsed = (Date.now() - startTime) / 1000;
  ctx.clearRect(0, 0, 390, 844);

  // Background
  ctx.fillStyle = '#060406';
  ctx.fillRect(0, 0, 390, 844);

  // White stars
  stars.forEach(s => {
    s.a = 0.3 + 0.5 * Math.sin(elapsed * s.speed * 6 + s.phase);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  });

  // Gold accent stars (fade in slowly)
  goldStars.forEach(s => {
    const appear = Math.max(0, (elapsed - 0.5) / 2);
    s.a = appear * (0.4 + 0.5 * Math.sin(elapsed * s.speed * 4 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201,168,76,${s.a})`;
    ctx.shadowColor = 'rgba(201,168,76,0.8)';
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
