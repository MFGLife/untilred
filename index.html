<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Movie Maker</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: black;
    touch-action: none;
  }
  .controls {
    display: flex;
    gap: 8px;
    padding: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
</style>
</head>
<body>

<canvas id="canvas" width="1280" height="720"></canvas>

<div class="controls">
  <input type="file" id="bg" accept="image/png">
  <input type="file" id="obj" accept="image/png">
  <button id="record">● Record</button>
  <button id="export">⬇ MP4</button>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let bgImage = null;
let objImage = null;

let state = {
  x: 640,
  y: 360,
  scale: 1,
  rotation: 0
};

let keyframes = [];
let recording = false;
let startTime = 0;

/* ---------- Load Images ---------- */
function loadImage(file, cb) {
  const img = new Image();
  img.onload = () => cb(img);
  img.src = URL.createObjectURL(file);
}

bg.onchange = e => loadImage(e.target.files[0], img => bgImage = img);
obj.onchange = e => loadImage(e.target.files[0], img => objImage = img);

/* ---------- Pointer / Touch ---------- */
let pointers = new Map();

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);
});

canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);

  if (pointers.size === 1) {
    state.x += e.movementX;
    state.y += e.movementY;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dx = b.clientX - a.clientX;
    const dy = b.clientY - a.clientY;
    const dist = Math.hypot(dx, dy);
    state.scale = Math.max(0.2, dist / 200);
    state.rotation = Math.atan2(dy, dx);
  }
});

canvas.addEventListener("pointerup", e => {
  pointers.delete(e.pointerId);
});

/* ---------- Render ---------- */
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if (bgImage)
    ctx.drawImage(bgImage,0,0,canvas.width,canvas.height);

  if (objImage) {
    ctx.save();
    ctx.translate(state.x, state.y);
    ctx.rotate(state.rotation);
    ctx.scale(state.scale, state.scale);
    ctx.drawImage(objImage, -objImage.width/2, -objImage.height/2);
    ctx.restore();
  }

  if (recording) {
    keyframes.push({
      time: (performance.now() - startTime) / 1000,
      ...state
    });
  }

  requestAnimationFrame(draw);
}
draw();

/* ---------- Recording ---------- */
let recorder, chunks = [];

record.onclick = () => {
  if (!recording) {
    const stream = canvas.captureStream(60);
    recorder = new MediaRecorder(stream);
    chunks = [];
    keyframes = [];
    startTime = performance.now();

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.start();
    recording = true;
    record.textContent = "■ Stop";

    setTimeout(stopRecording, 20000);
  } else {
    stopRecording();
  }
};

function stopRecording() {
  if (!recording) return;
  recording = false;
  recorder.stop();
  record.textContent = "● Record";
}

/* ---------- MP4 Export ---------- */
const { FFmpeg } = FFmpegWASM;
const ffmpeg = new FFmpeg();

export.onclick = async () => {
  if (!chunks.length) return alert("Record first");

  const webmBlob = new Blob(chunks, { type: "video/webm" });
  const data = new Uint8Array(await webmBlob.arrayBuffer());

  if (!ffmpeg.loaded) await ffmpeg.load();

  await ffmpeg.writeFile("input.webm", data);
  await ffmpeg.exec([
    "-i", "input.webm",
    "-movflags", "faststart",
    "-pix_fmt", "yuv420p",
    "out.mp4"
  ]);

  const mp4 = await ffmpeg.readFile("out.mp4");
  const url = URL.createObjectURL(new Blob([mp4.buffer], { type: "video/mp4" }));

  const a = document.createElement("a");
  a.href = url;
  a.download = "movie.mp4";
  a.click();
};
</script>
</body>
</html>
