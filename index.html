<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salmon - Dense Bioluminescent Field</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.sizes = { width: window.innerWidth, height: window.innerHeight };
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0a0a1a);
    this.scene.fog = new THREE.FogExp2(0x0a0a1a, 0.12);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.sizes.width, this.sizes.height);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(75, this.sizes.width / this.sizes.height, 0.1, 500);
    this.camera.position.set(0, 2, 4);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.clock = new THREE.Clock();
    this.tasks = [];
    
    this.init();
    this.animate();
  }

  init() {
    // Enhanced Lighting
    this.scene.add(new THREE.AmbientLight(0x4040ff, 0.6));
    const pLight = new THREE.PointLight(0x00ffff, 15, 30);
    pLight.position.set(0, 1, 0);
    this.scene.add(pLight);

    this.createReflectiveGround();
    this.createOrganicStrands();
    this.loadFish();
  }

  createReflectiveGround() {
    const loader = new THREE.TextureLoader();
    
    // Load a pebble texture (using a placeholder URL here)
    const pebbleTexture = loader.load('https://www.transparenttextures.com/patterns/pebbly-embers.png');
    pebbleTexture.wrapS = THREE.RepeatWrapping;
    pebbleTexture.wrapT = THREE.RepeatWrapping;
    pebbleTexture.repeat.set(10, 10); // Repeat the pattern across the floor

    // CHANGE: Use CircleGeometry and make it smaller
    // Original radius was around 50, so one-third is ~16.7
    const floorGeo = new THREE.CircleGeometry(16.7, 64); 
    
    const floorMat = new THREE.MeshPhysicalMaterial({ 
        map: pebbleTexture,
        color: 0x555566, // Lighter base color to avoid "pitch black"
        metalness: 0.4,
        roughness: 0.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        reflectivity: 1.0
    });

    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.0; 
    this.scene.add(floor);
}


  createOrganicStrands() {
    const strandCount = 20000; 
    const particlesPerStrand = 60; // Increased for better density
    const totalParticles = strandCount * particlesPerStrand;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(totalParticles * 3);
    const randoms = new Float32Array(totalParticles * 4); // [xDir, zDir, speed, lengthMult]

    for (let i = 0; i < strandCount; i++) {
      const rootX = (Math.random() - 0.5) * 50;
      const rootZ = (Math.random() - 0.5) * 50;
      
      // Randomize direction and speed for this specific strand
      const xDir = (Math.random() - 0.5) * 2.0;
      const zDir = (Math.random() - 0.5) * 2.0;
      const speed = 0.5 + Math.random() * 2.0;
      const lengthMult = 0.5 + Math.random() * 1.5;

      for (let j = 0; j < particlesPerStrand; j++) {
        const idx = (i * particlesPerStrand + j);
        
        positions[idx * 3] = rootX;
        // Negative spacing (extremely tight overlap)
        positions[idx * 3 + 1] = j * 0.01; 
        positions[idx * 3 + 2] = rootZ;

        randoms[idx * 4] = xDir;
        randoms[idx * 4 + 1] = zDir;
        randoms[idx * 4 + 2] = speed;
        randoms[idx * 4 + 3] = lengthMult;
      }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 4));

    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x00ffcc) }
      },
      vertexShader: `
        uniform float uTime;
        attribute vec4 aRandom;
        varying float vHeight;

        void main() {
          vec3 pos = position;
          float h = pos.y; // Height from ground
          vHeight = h;

          // Scale length based on randomized attribute
          pos.y *= aRandom.w;

          // Unique sway using the strand's randomized speed and direction
          float time = uTime * aRandom.z;
          float wave = sin(time - (pos.y * 5.0)) * (pos.y * 0.2);
          
          pos.x += wave * aRandom.x;
          pos.z += wave * aRandom.y;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          
          // Size randomization: base size + variation based on strand
          gl_PointSize = (30.0 + aRandom.w * 18.0) * (1.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vHeight;
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if(d > 0.5) discard;
          
          // Color gets brighter at the tips
          vec3 finalColor = uColor + (vHeight * 0.3);
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      transparent: true,
      depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    points.position.y = -1.0; 
    this.scene.add(points);

    this.tasks.push(() => {
      material.uniforms.uTime.value = this.clock.getElapsedTime();
    });
  }

  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", (gltf) => {
      const fish = gltf.scene.children[0];
      fish.traverse(c => { if(c.isMesh) c.material = new THREE.MeshStandardMaterial({color: 0x000000, roughness: 0}); });
      
      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);
      fish.position.set(0,0,0);
      fish.rotation.set(0,0,0);
      fish.scale.set(1,1,1);

      const initialPoints = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 100) {
        const dist = 1 + Math.sin(i * 10) / 30;
        initialPoints.push(new THREE.Vector3(Math.sin(i) * dist, -0.2, Math.cos(i) * dist));
      }

      const curve = new THREE.CatmullRomCurve3(initialPoints);
      const flow = new Flow(fish);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);
      this.tasks.push(() => flow.moveAlongCurve(0.001));
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.tasks.forEach(t => t());
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
