<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Face Tracking</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* Hide the raw video feed, we only want the particles */
        #input_video { display: none; }
        /* Canvas covers the screen */
        #output_canvas { display: block; width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            color: white; font-family: monospace; font-size: 24px;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="loading">Initialize Camera...</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

<script>
    
    // --- CONFIG ---
    const LANDMARKS = 468;
    const PARTICLE_MULTIPLIER = 4; // 4x particles
    const TOTAL_PARTICLES = LANDMARKS * PARTICLE_MULTIPLIER;

    // --- THREE.JS SETUP ---
    const canvas = document.getElementById('output_canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.z = 2.2;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // --- PARTICLES ---
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(TOTAL_PARTICLES * 3);
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.018,
        sizeAttenuation: true
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // --- MEDIAPIPE ---
    const videoElement = document.getElementById('input_video');
    const loadingMsg = document.getElementById('loading');

    function onResults(results) {
        loadingMsg.style.display = 'none';

        if (!results.multiFaceLandmarks?.length) return;

        const landmarks = results.multiFaceLandmarks[0];
        const pos = particles.geometry.attributes.position.array;

        let p = 0;

        for (let i = 0; i < landmarks.length; i++) {
            const lm = landmarks[i];

            // Base face point
            const baseX = (0.5 - lm.x) * 3.0;
            const baseY = (0.5 - lm.y) * 3.2; // FIX vertical squash
            const baseZ = -lm.z * 1.8;

            // Head expansion factor
            const radial = Math.sqrt(baseX * baseX + baseY * baseY);
            const headExpand = 1 + radial * 0.15;

            for (let j = 0; j < PARTICLE_MULTIPLIER; j++) {
                // Soft volumetric jitter
                const jitter = 0.03;

                pos[p++] = baseX * headExpand + (Math.random() - 0.5) * jitter;
                pos[p++] = baseY * headExpand + (Math.random() - 0.5) * jitter;
                pos[p++] = baseZ - radial * 0.25 + (Math.random() - 0.5) * jitter;
            }
        }

        particles.geometry.attributes.position.needsUpdate = true;
    }

    const faceMesh = new FaceMesh({
        locateFile: file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // --- CAMERA FEED ---
    const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
            await faceMesh.send({ image: videoElement });
        },
        width: 1280,
        height: 720
    });

    cameraFeed.start();

    // --- RENDER LOOP ---
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // --- RESIZE ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
