<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime GLB Face Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        #input_video { display: none; }
        #output_canvas { display: block; width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-family: 'Courier New', monospace; font-size: 22px;
            pointer-events: none; letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 100, 200, 0.8);
            z-index: 100;
        }
        #controls {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px;
            z-index: 10;
        }
        button {
            background: rgba(255, 100, 200, 0.2);
            border: 1px solid rgba(255, 100, 200, 0.5);
            color: #fff;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(255, 100, 200, 0.4);
            box-shadow: 0 0 15px rgba(255, 100, 200, 0.5);
        }
    </style>
    <!-- Three.js and GLTF Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

<div id="loading">Loading Anime Avatar...</div>
<video id="input_video" playsinline></video>
<canvas id="output_canvas"></canvas>
<div id="controls">
    <button onclick="toggleWireframe()">Wireframe</button>
    <button onclick="resetCamera()">Reset View</button>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const CONFIG = {
    modelUrl: 'https://models.readyplayer.me/6398a5d2b4f5f6c0d8c9e7f3.glb',
    
    scale: 1.5,
    smoothing: 0.3, // 0-1, higher = smoother but more latency
    
    // Landmark to bone/blendshape mapping weights
    influenceStrength: {
        brow: 1.0,
        eye: 1.2,
        mouth: 1.0,
        jaw: 0.8,
        headRotation: 1.0
    }
};

// ============================================================
// THREE.JS SETUP
// ============================================================
const canvas = document.getElementById('output_canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 5, 20);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3.5);

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lighting setup for anime style
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffd1dc, 1.2);
mainLight.position.set(2, 3, 2);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
scene.add(mainLight);

const rimLight = new THREE.SpotLight(0x00ffff, 0.8);
rimLight.position.set(-3, 2, -2);
rimLight.lookAt(0, 0, 0);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xff69b4, 0.5);
fillLight.position.set(0, -1, 2);
scene.add(fillLight);

// ============================================================
// GLB MODEL LOADING
// ============================================================
let avatar = null;
let morphTargets = {};
let bones = {};
let mixer = null;
let targetRotations = { x: 0, y: 0, z: 0 };
let currentRotations = { x: 0, y: 0, z: 0 };

// Create a default anime-style head geometry if no GLB loads
function createDefaultAnimeHead() {
    const group = new THREE.Group();
    
    // Head sphere (stylized)
    const headGeo = new THREE.SphereGeometry(0.6, 32, 32);
    // Flatten slightly for anime look
    headGeo.scale(0.85, 1, 0.9);
    const headMat = new THREE.MeshToonMaterial({ 
        color: 0xffe0bd,
        gradientMap: null
    });
    const head = new THREE.Mesh(headGeo, headMat);
    head.castShadow = true;
    head.receiveShadow = true;
    group.add(head);
    
    // Eyes (large anime style)
    const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
    eyeGeo.scale(1, 1.3, 0.5);
    const eyeMat = new THREE.MeshToonMaterial({ color: 0x3366cc, emissive: 0x112244 });
    
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.18, 0.05, 0.45);
    group.add(leftEye);
    
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.18, 0.05, 0.45);
    group.add(rightEye);
    
    // Eye highlights
    const highlightGeo = new THREE.SphereGeometry(0.04, 8, 8);
    const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    
    const leftHighlight = new THREE.Mesh(highlightGeo, highlightMat);
    leftHighlight.position.set(-0.15, 0.1, 0.52);
    group.add(leftHighlight);
    
    const rightHighlight = new THREE.Mesh(highlightGeo, highlightMat);
    rightHighlight.position.set(0.21, 0.1, 0.52);
    group.add(rightHighlight);
    
    // Hair (simplified anime style)
    const hairGeo = new THREE.SphereGeometry(0.65, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.45);
    const hairMat = new THREE.MeshToonMaterial({ color: 0x2a2a4a });
    const hair = new THREE.Mesh(hairGeo, hairMat);
    hair.position.y = 0.05;
    hair.rotation.x = Math.PI;
    hair.castShadow = true;
    group.add(hair);
    
    // Bangs
    for (let i = 0; i < 5; i++) {
        const bangGeo = new THREE.ConeGeometry(0.08, 0.4, 4);
        const bang = new THREE.Mesh(bangGeo, hairMat);
        bang.position.set((i - 2) * 0.15, 0.5, 0.45);
        bang.rotation.x = -0.3;
        bang.rotation.z = (i - 2) * 0.1;
        group.add(bang);
    }
    
    return group;
}

function loadModel() {
    const loader = new THREE.GLTFLoader();
    
    loader.load(CONFIG.modelUrl, 
        (gltf) => {
            avatar = gltf.scene;
            
            // Center and scale
            const box = new THREE.Box3().setFromObject(avatar);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = CONFIG.scale / maxDim;
            
            avatar.scale.setScalar(scale);
            avatar.position.sub(center.multiplyScalar(scale));
            
            // Setup morph targets and bones
            avatar.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    
                    // Store morph targets if they exist
                    if (child.morphTargetDictionary) {
                        Object.keys(child.morphTargetDictionary).forEach(key => {
                            morphTargets[key] = {
                                mesh: child,
                                index: child.morphTargetDictionary[key]
                            };
                        });
                    }
                }
                
                if (child.isBone) {
                    bones[child.name] = child;
                }
            });
            
            scene.add(avatar);
            document.getElementById('loading').style.display = 'none';
            
            // Setup animation mixer if animations exist
            if (gltf.animations && gltf.animations.length) {
                mixer = new THREE.AnimationMixer(avatar);
            }
        },
        (progress) => {
            console.log('Loading:', (progress.loaded / progress.total * 100) + '%');
        },
        (error) => {
            console.warn('GLB load failed, using default anime head:', error);
            avatar = createDefaultAnimeHead();
            scene.add(avatar);
            document.getElementById('loading').style.display = 'none';
        }
    );
}

loadModel();

// ============================================================
// MEDIAPIPE FACE TRACKING
// ============================================================
const videoElement = document.getElementById('input_video');

// Key landmark indices for facial features
const LANDMARKS = {
    // Face bounds for head rotation calculation
    leftEye: [33, 133, 157, 158, 159, 160, 161, 173, 246],
    rightEye: [362, 263, 384, 385, 386, 387, 388, 398, 466],
    leftEyebrow: [70, 63, 105, 66, 107, 55, 65, 52, 53, 46],
    rightEyebrow: [336, 296, 334, 293, 300, 285, 295, 282, 283, 276],
    nose: [1, 2, 3, 4, 5, 6, 168, 197, 195, 5, 4],
    upperLip: [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291],
    lowerLip: [146, 91, 181, 84, 17, 314, 405, 321, 375, 291],
    jaw: [10, 152, 234, 454, 323, 93, 132, 361, 172, 136, 150, 149, 176, 148, 152],
    faceOval: [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109]
};

function getLandmarkCenter(landmarks, indices) {
    let x = 0, y = 0, z = 0;
    indices.forEach(idx => {
        x += landmarks[idx].x;
        y += landmarks[idx].y;
        z += landmarks[idx].z;
    });
    return {
        x: x / indices.length,
        y: y / indices.length,
        z: z / indices.length
    };
}

function getEyeOpenness(landmarks, eyeIndices) {
    // Calculate eye height vs width ratio
    const top = landmarks[eyeIndices[2]]; // upper eyelid
    const bottom = landmarks[eyeIndices[4]]; // lower eyelid
    const left = landmarks[eyeIndices[0]];
    const right = landmarks[eyeIndices[1]];
    
    const height = Math.sqrt(
        Math.pow(top.x - bottom.x, 2) + 
        Math.pow(top.y - bottom.y, 2)
    );
    const width = Math.sqrt(
        Math.pow(left.x - right.x, 2) + 
        Math.pow(left.y - right.y, 2)
    );
    
    return Math.min(height / width * 3, 1); // Normalize
}

function getMouthOpenness(landmarks) {
    const upperLip = getLandmarkCenter(landmarks, LANDMARKS.upperLip);
    const lowerLip = getLandmarkCenter(landmarks, LANDMARKS.lowerLip);
    
    const mouthHeight = Math.sqrt(
        Math.pow(upperLip.x - lowerLip.x, 2) +
        Math.pow(upperLip.y - lowerLip.y, 2)
    );
    
    // Normalize based on face size
    const faceWidth = Math.sqrt(
        Math.pow(landmarks[234].x - landmarks[454].x, 2) +
        Math.pow(landmarks[234].y - landmarks[454].y, 2)
    );
    
    return Math.min(mouthHeight / faceWidth * 4, 1.2);
}

function getEyebrowRaise(landmarks, isLeft) {
    const browIndices = isLeft ? LANDMARKS.leftEyebrow : LANDMARKS.rightEyebrow;
    const brow = getLandmarkCenter(landmarks, browIndices);
    const eye = getLandmarkCenter(landmarks, isLeft ? LANDMARKS.leftEye : LANDMARKS.rightEye);
    
    // Distance between eyebrow and eye
    return (brow.y - eye.y) * 10; // Scale factor
}

function onResults(results) {
    if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0 || !avatar) return;
    
    const lm = results.multiFaceLandmarks[0];
    
    // Calculate head rotation from face orientation
    const nose = getLandmarkCenter(lm, LANDMARKS.nose);
    const leftEye = getLandmarkCenter(lm, LANDMARKS.leftEye);
    const rightEye = getLandmarkCenter(lm, LANDMARKS.rightEye);
    const chin = lm[152];
    const forehead = lm[10];
    
    // Calculate rotation angles
    const eyeLine = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
    const headTilt = -eyeLine; // Roll
    
    const faceDepth = Math.atan2(nose.z - (leftEye.z + rightEye.z) / 2, 
                                Math.abs(rightEye.x - leftEye.x));
    const headYaw = (nose.x - 0.5) * 2; // Left/right turn
    const headPitch = (nose.y - 0.5) * 2; // Up/down
    
    // Apply smoothing
    targetRotations = {
        x: headPitch * CONFIG.influenceStrength.headRotation,
        y: headYaw * CONFIG.influenceStrength.headRotation,
        z: headTilt * CONFIG.influenceStrength.headRotation
    };
    
    // Apply facial expressions
    const leftEyeOpen = getEyeOpenness(lm, [33, 133, 157, 158, 159, 160, 161]);
    const rightEyeOpen = getEyeOpenness(lm, [362, 263, 384, 385, 386, 387, 388]);
    const mouthOpen = getMouthOpenness(lm);
    const leftBrowRaise = getEyebrowRaise(lm, true);
    const rightBrowRaise = getEyebrowRaise(lm, false);
    
    // Apply to morph targets if they exist
    Object.keys(morphTargets).forEach(key => {
        const target = morphTargets[key];
        const name = key.toLowerCase();
        
        let value = 0;
        
        // Map morph targets to expressions
        if (name.includes('eye') && name.includes('blink')) {
            value = 1 - ((leftEyeOpen + rightEyeOpen) / 2);
        } else if (name.includes('eye') && name.includes('wide')) {
            value = Math.max(leftBrowRaise, rightBrowRaise) * 0.5;
        } else if (name.includes('mouth') && name.includes('open')) {
            value = mouthOpen;
        } else if (name.includes('brow') && name.includes('up')) {
            value = (leftBrowRaise + rightBrowRaise) / 2;
        } else if (name.includes('jaw') && name.includes('open')) {
            value = mouthOpen * 0.7;
        }
        
        target.mesh.morphTargetInfluences[target.index] = THREE.MathUtils.lerp(
            target.mesh.morphTargetInfluences[target.index] || 0,
            value,
            CONFIG.smoothing
        );
    });
    
    // Animate default head parts if no morph targets
    if (Object.keys(morphTargets).length === 0) {
        animateDefaultHead(leftEyeOpen, rightEyeOpen, mouthOpen, leftBrowRaise, rightBrowRaise);
    }
}

function animateDefaultHead(leftEye, rightEye, mouth, leftBrow, rightBrow) {
    // Find and animate eye meshes
    avatar.children.forEach(child => {
        if (child.geometry && child.geometry.type === 'SphereGeometry') {
            // Scale eyes based on openness
            if (child.position.x < 0) { // Left eye
                child.scale.y = 1.3 * leftEye;
            } else if (child.position.x > 0) { // Right eye
                child.scale.y = 1.3 * rightEye;
            }
        }
    });
    
    // Mouth animation (if we had a mouth mesh)
    // For now, head rotation is the main animation
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    
    // Smooth rotation interpolation
    currentRotations.x = THREE.MathUtils.lerp(currentRotations.x, targetRotations.x, CONFIG.smoothing);
    currentRotations.y = THREE.MathUtils.lerp(currentRotations.y, targetRotations.y, CONFIG.smoothing);
    currentRotations.z = THREE.MathUtils.lerp(currentRotations.z, targetRotations.z, CONFIG.smoothing);
    
    if (avatar) {
        avatar.rotation.x = currentRotations.x;
        avatar.rotation.y = currentRotations.y;
        avatar.rotation.z = currentRotations.z;
        
        // Add subtle idle animation
        const time = Date.now() * 0.001;
        avatar.position.y = Math.sin(time) * 0.02;
    }
    
    if (mixer) mixer.update(0.016);
    
    renderer.render(scene, camera);
}
animate();

// ============================================================
// MEDIAPIPE SETUP
// ============================================================
const faceMesh = new FaceMesh({ 
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults(onResults);

const cameraFeed = new Camera(videoElement, {
    onFrame: async () => { await faceMesh.send({ image: videoElement }); },
    width: 1280,
    height: 720
});
cameraFeed.start();

// ============================================================
// CONTROLS
// ============================================================
let wireframe = false;
function toggleWireframe() {
    wireframe = !wireframe;
    if (avatar) {
        avatar.traverse((child) => {
            if (child.isMesh && child.material) {
                child.material.wireframe = wireframe;
            }
        });
    }
}

function resetCamera() {
    camera.position.set(0, 0, 3.5);
    camera.lookAt(0, 0, 0);
}

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
