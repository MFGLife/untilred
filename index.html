<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Texting Music Video</title>
<style>
  body {
    margin: 0;
    font-family: 'Helvetica', sans-serif;
    background: #111;
    color: #fff;
  }
  .chat-container {
    height: 80vh;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    background: #222;
  }
  .bubble {
    max-width: 80%;
    margin: 5px 0;
    padding: 10px 15px;
    border-radius: 20px;
    word-wrap: break-word;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
  }
  .human { background: #ff4d6d; align-self: flex-end; }
  .ai { background: #4d9eff; align-self: flex-start; }
  .input-area {
    padding: 10px;
    background: #111;
    display: flex;
  }
  .input-area textarea {
    flex: 1;
    resize: none;
    padding: 8px;
    border-radius: 10px;
    border: none;
    font-family: monospace;
    font-size: 14px;
  }
  .input-area button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="chat-container" id="chat">
  <div class="bubble ai" style="opacity:1; transform: translateY(0)">Welcome! Paste your lyrics below and hit Play.</div>
</div>

<div class="input-area">
  <textarea id="lyricsInput" rows="4" placeholder="Paste lyrics here..."></textarea>
  <button onclick="startChat()">Play</button>
</div>

<script>
function startChat() {
  const chatContainer = document.getElementById('chat');
  const inputArea = document.getElementById('lyricsInput');

  // Clear existing messages except welcome
  chatContainer.innerHTML = '';

  const lines = inputArea.value.split('\n').filter(l => l.trim() !== '');
  if(lines.length === 0) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ai';
    bubble.style.opacity = 1;
    bubble.style.transform = 'translateY(0)';
    bubble.textContent = 'No lyrics detected! Paste something and try again.';
    chatContainer.appendChild(bubble);
    return;
  }

  let delay = 0;
  lines.forEach((line, index) => {
    let sender = index % 2 === 0 ? 'human' : 'ai';
    const content = line.trim();

    setTimeout(() => {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble', sender);
      bubble.textContent = content;
      chatContainer.appendChild(bubble);

      requestAnimationFrame(() => {
        bubble.style.opacity = 1;
        bubble.style.transform = 'translateY(0)';
        chatContainer.scrollTop = chatContainer.scrollHeight;
      });
    }, delay);

    delay += 800 + Math.random() * 400;
  });
}
</script>

</body>
</html>
