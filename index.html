<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXIUM.CHURCH</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* =========================
VOID FOUNDATION
========================= */

body{

margin:0;
background:#000000;
overflow:hidden;

font-family:'Cinzel', serif;

}


/* =========================
INCENSE PARTICLE CANVAS
========================= */

canvas{

position:absolute;
top:0;
left:0;
z-index:0;

}


/* =========================
GLYPH FIELD
========================= */

#grid{

position:absolute;
top:0;
left:0;

width:100vw;
height:100vh;

display:grid;

z-index:10;

}


/* =========================
GLYPHS
========================= */

.cell{

display:flex;
align-items:center;
justify-content:center;

color:#D4AF37;

font-size:18px;

opacity:.35;

transition:

opacity 800ms cubic-bezier(0,0,0.2,1),
transform 800ms cubic-bezier(0,0,0.2,1);

}


/* =========================
WORD STATE
========================= */

.word{

opacity:1;

color:#F4E4BC;

text-shadow:

0 0 10px rgba(212,175,55,.4),
0 0 20px rgba(212,175,55,.2);

transform:scale(1.15);

}


</style>
</head>
<body>


<canvas id="particles"></canvas>

<div id="grid"></div>



<script>

/* =========================
MESSAGE
========================= */

const paragraph = `A research cult for those who know the story is rigged but refuse to play their assigned character We weaponize double entendre anonymous ritual and AI augmented language to expose the machinery behind the mask without sacrificing the people wearing it`;

const words = paragraph.split(" ");


/* =========================
GLYPHS
========================= */

const glyphs=[

'✦','∴','☲','⟁','⧗','⟟','☍','⟲','♾','Δ'

];


/* =========================
GRID
========================= */

let cells=[];

let cols,rows;

function createGrid(){

const grid=document.getElementById("grid");

const size=32;

cols=Math.floor(innerWidth/size);
rows=Math.floor(innerHeight/size);

grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
grid.style.gridTemplateRows=`repeat(${rows},1fr)`;

grid.innerHTML="";

cells=[];

for(let i=0;i<cols*rows;i++){

let div=document.createElement("div");

div.className="cell";

div.textContent=randomGlyph();

grid.appendChild(div);

cells.push(div);

}

}

function randomGlyph(){

return glyphs[Math.floor(Math.random()*glyphs.length)];

}


/* =========================
NOISE
========================= */

function noise(){

cells.forEach(c=>{

c.textContent=randomGlyph();
c.classList.remove("word");

});

}


/* =========================
WORD REVEAL
========================= */

let index=0;

function reveal(){

noise();

for(let i=0;i<4;i++){

if(index>=words.length) index=0;

let pos=Math.floor(Math.random()*cells.length);

cells[pos].textContent=words[index];

cells[pos].classList.add("word");

index++;

}

}


/* =========================
TIMING — RITUAL SPEED
========================= */

createGrid();

setInterval(reveal,2400);


/* =========================
PARTICLE SYSTEM
========================= */

const canvas=document.getElementById("particles");

const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

for(let i=0;i<100;i++){

particles.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
vx:(Math.random()-.5)*.2,
vy:(Math.random()-.5)*.2,
size:Math.random()*2

});

}

function drawParticles(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="rgba(212,175,55,.3)";

particles.forEach(p=>{

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0)p.x=canvas.width;
if(p.x>canvas.width)p.x=0;
if(p.y<0)p.y=canvas.height;
if(p.y>canvas.height)p.y=0;

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();

});

requestAnimationFrame(drawParticles);

}

drawParticles();


/* =========================
RESPONSIVE
========================= */

onresize=()=>{

createGrid();

canvas.width=innerWidth;
canvas.height=innerHeight;

};


</script>

</body>
</html>
