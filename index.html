<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Scholar</title>
    <style>
        :root {
            --bg-color: #000000; /* True Black for OLED Battery Saving */
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --error-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* The Interface */
        .container { text-align: center; width: 90%; max-width: 400px; }
        
        h1 { font-weight: 200; letter-spacing: 2px; margin-bottom: 40px; opacity: 0.8; font-size: 1rem; text-transform: uppercase; }

        /* The Button */
        #playBtn {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto;
            box-shadow: 0 0 0px rgba(56, 189, 248, 0); /* Glow effect start */
        }

        #playBtn:active { transform: scale(0.95); }
        
        .playing #playBtn {
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            background: rgba(56, 189, 248, 0.1);
        }

        /* Metadata Text */
        #trackInfo { margin-top: 40px; min-height: 80px; }
        #title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
        #source { font-size: 0.9rem; color: #94a3b8; font-style: italic; }
        
        /* Category Selector */
        .toggles { margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
        .chip {
            padding: 8px 16px; border: 1px solid #334155; border-radius: 20px;
            font-size: 0.8rem; color: #94a3b8; cursor: pointer; background: transparent;
        }
        .chip.active { border-color: var(--accent-color); color: var(--accent-color); }

        /* Loading Animation */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent-color); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="container">
        <h1 id="header">Random Learning</h1>
        
        <button id="playBtn" aria-label="Play Random Lesson">
            <span id="icon">▶</span>
            <div id="loader" class="loader"></div>
        </button>

        <div id="trackInfo">
            <div id="title">Tap to start</div>
            <div id="source">Science & Legal Archives</div>
        </div>

        <div class="toggles">
            <button class="chip active" onclick="setCategory('mix')">Mix</button>
            <button class="chip" onclick="setCategory('science')">Science</button>
            <button class="chip" onclick="setCategory('legal')">Legal</button>
        </div>
    </div>

    <audio id="audioPlayer" preload="none" crossorigin="anonymous"></audio>

    <script>
        // --- 1. The Content Sources (Ad-Free, Direct MP3) ---
        const feeds = {
            science: [
                "https://www.nasa.gov/rss/dyn/Houston-We-Have-a-Podcast.rss", // NASA
                "https://librivox.org/rss/10328", // Short Nonfiction Collection (Science)
                "https://librivox.org/rss/2589"   // The Chemical History of a Candle
            ],
            legal: [
                "https://librivox.org/rss/14545", // The US Constitution
                "https://librivox.org/rss/8254",  // The Federalist Papers
                "https://librivox.org/rss/14023"  // Great American Documents
            ]
        };

        let currentCategory = 'mix';
        let isPlaying = false;
        const player = document.getElementById('audioPlayer');
        const btn = document.getElementById('playBtn');
        const icon = document.getElementById('icon');
        const titleEl = document.getElementById('title');
        const sourceEl = document.getElementById('source');
        const loader = document.getElementById('loader');

        // --- 2. Core Logic ---
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function fetchRandomEpisode() {
            // 1. Pick a Feed
            let pool = [];
            if (currentCategory === 'mix') pool = [...feeds.science, ...feeds.legal];
            else pool = feeds[currentCategory];
            
            const randomFeedUrl = pool[Math.floor(Math.random() * pool.length)];

            // 2. Fetch via Proxy (Bypasses CORS restrictions)
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(randomFeedUrl)}`;
            
            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // 3. Parse XML
                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");
                const items = xml.querySelectorAll("item");
                
                // 4. Pick Random Item
                if (items.length === 0) throw new Error("No episodes found");
                const item = items[Math.floor(Math.random() * items.length)];
                
                return {
                    title: item.querySelector("title").textContent,
                    // Clean up title (remove file extensions etc if needed)
                    url: item.querySelector("enclosure").getAttribute("url"),
                    feedTitle: xml.querySelector("channel > title").textContent
                };
            } catch (e) {
                console.error("Fetch failed", e);
                return null; // Will trigger retry
            }
        }

        // --- 3. Playback Controller ---
        btn.addEventListener('click', async () => {
            if (isPlaying) {
                player.pause();
                isPlaying = false;
                icon.innerText = "▶";
                icon.style.display = "block";
                document.body.classList.remove('playing');
            } else {
                // If we have a source, just resume. If not, fetch new.
                if (player.src && player.currentTime > 0 && !player.ended) {
                    player.play();
                    isPlaying = true;
                    icon.innerText = "⏸";
                    document.body.classList.add('playing');
                } else {
                    await loadNewTrack();
                }
            }
        });

        async function loadNewTrack() {
            icon.style.display = "none";
            loader.style.display = "block";
            titleEl.innerText = "Connecting to archives...";
            sourceEl.innerText = "Searching...";

            let track = null;
            let attempts = 0;
            
            // Retry logic in case a feed is down
            while (!track && attempts < 3) {
                track = await fetchRandomEpisode();
                attempts++;
            }

            if (track) {
                player.src = track.url;
                titleEl.innerText = track.title;
                sourceEl.innerText = track.feedTitle;
                
                player.play().then(() => {
                    isPlaying = true;
                    icon.innerText = "⏸";
                    icon.style.display = "block";
                    loader.style.display = "none";
                    document.body.classList.add('playing');
                    
                    // Lock Screen Controls (Mobile)
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: track.title,
                            artist: track.feedTitle,
                            artwork: [{ src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/100px-Wikipedia-logo-v2.svg.png' }]
                        });
                        navigator.mediaSession.setActionHandler('play', () => player.play());
                        navigator.mediaSession.setActionHandler('pause', () => player.pause());
                        navigator.mediaSession.setActionHandler('nexttrack', loadNewTrack);
                    }
                }).catch(e => {
                    titleEl.innerText = "Playback Error";
                    loader.style.display = "none";
                    icon.style.display = "block";
                });
            } else {
                titleEl.innerText = "Connection failed.";
                loader.style.display = "none";
                icon.innerText = "↻";
                icon.style.display = "block";
            }
        }
        
        // Auto-play next track when finished
        player.onended = () => loadNewTrack();

    </script>
</body>
</html>
