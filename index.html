<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salmon — True Audio Flash</title>

<style>
body { margin: 0; overflow: hidden; background: #000; }
canvas { display: block; }
#audioPanel {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10;
  background: rgba(0,0,0,0.7);
  padding: 12px;
  border-radius: 8px;
  color: white;
}
#audioPanel button {
  background: #00ffd0;
  border: none;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  color: #000;
}
#audioPanel input { display: none; }
</style>
</head>

<body>

<div id="audioPanel">
  <button id="toggleAudio">Upload Song</button>
  <input type="file" id="audioFile" accept="audio/*">
</div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x050505);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
    this.camera.position.set(0, 1.5, 3);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;

    this.tasks = [];

    this.audioCtx = null;
    this.analyser = null;
    this.freqData = null;

    this.initLights();
    this.initAudio();
    this.loadFish();
    this.resize();
    this.animate();
  }

  initLights() {
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const d = new THREE.DirectionalLight(0xffffff, 1);
    d.position.set(-3, 5, 2);
    this.scene.add(d);
  }

  initAudio() {
    const btn = document.getElementById("toggleAudio");
    const input = document.getElementById("audioFile");

    btn.onclick = () => input.click();

    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;

      if (!this.audioCtx)
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (this.audioCtx.state === "suspended")
        await this.audioCtx.resume();

      this.analyser = this.audioCtx.createAnalyser();
      this.analyser.fftSize = 512;
      this.analyser.smoothingTimeConstant = 0.7;
      this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
      this.analyser.connect(this.audioCtx.destination);

      const audio = new Audio(URL.createObjectURL(file));
      const src = this.audioCtx.createMediaElementSource(audio);
      src.connect(this.analyser);
      audio.loop = true;
      audio.play();

      btn.textContent = "Playing…";
    };
  }

  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", gltf => {

      const root = gltf.scene;
      const masks = [];

      root.traverse(m => {
        if (!m.isMesh) return;

        m.material = m.material.clone();

        const maskMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0,
          depthWrite: false
        });

        const maskMesh = new THREE.Mesh(m.geometry, maskMat);
        maskMesh.renderOrder = 10;
        m.add(maskMesh);

        masks.push(maskMat);
      });

      root.scale.setScalar(0.01);
      root.rotation.x = Math.PI / 2;

      const points = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 120) {
        const d = 1.2 + Math.sin(i * 8) * 0.05;
        points.push(new THREE.Vector3(Math.sin(i) * d, 0, Math.cos(i) * d));
      }

      const curve = new THREE.CatmullRomCurve3(points, true);
      const flow = new Flow(root);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);

      const avg = (a, x, y) => {
        let s = 0;
        for (let i = x; i < y; i++) s += a[i];
        return (s / (y - x)) / 255;
      };

      this.tasks.push(() => {
        flow.moveAlongCurve(0.0015);
        if (!this.analyser) return;

        this.analyser.getByteFrequencyData(this.freqData);
        const mid = avg(this.freqData, 20, 90);

        masks.forEach(m => {
          if (mid > 0.12) {
            m.color.setHSL(Math.random(), 1, 0.6);
            m.opacity = THREE.MathUtils.clamp(mid * 2.5, 0.25, 1);
          } else {
            m.opacity *= 0.6;
          }
        });
      });
    });
  }

  resize() {
    addEventListener("resize", () => {
      this.camera.aspect = innerWidth / innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.tasks.forEach(t => t());
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
