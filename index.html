<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --coilSize: 14px;
  --delayCount: 40ms;
  --fishColor: black;
  --outlineColor: white;
}

body, html {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background-color: #add8e6;
  overflow: hidden;
  touch-action: none; /* Prevents scrolling while interacting */
  font-family: sans-serif;
}

/* UI Panel */
#ui-root {
  position: absolute;
  bottom: 20px; left: 20px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.8);
  padding: 15px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* The Fish */
.fish {
  position: absolute;
  width: 100%; height: 100%;
  pointer-events: none;
}

.koiCoil {
  position: absolute;
  width: var(--coilSize); height: var(--coilSize);
  background-color: var(--fishColor);
  border-radius: 50%;
  top: 50%; left: 50%;
  margin: calc(var(--coilSize) / -2);
  box-shadow: 0 0 0 1.5px var(--outlineColor) inset;
  offset-path: path("M11.7,229.5 C14.5,200 7.5,171.8 -42.8,170.6 C-105.8,169 -131.2,76.6 -101.6,51.5");
  animation: fishAnim 20s linear infinite;
  animation-play-state: running;
}

/* Tail and Fins */
.koiCoil:nth-child(1)::before {
  content: ""; position: absolute; width: 100%; height: 50%; left: -100%; top: 25%;
  background: var(--fishColor); border: 1px solid var(--outlineColor);
  animation: backFlip 200ms ease-in-out alternate infinite;
}

/* Uploaded Images */
.dropped-image {
  position: absolute;
  cursor: move;
  user-select: none;
  border: 2px dashed transparent;
}
.dropped-image:active { border-color: white; }

@keyframes fishAnim { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
@keyframes backFlip { 0% { transform: rotate(45deg); } 100% { transform: rotate(-45deg); } }

/* Scale variables for body segments */
.koiCoil:nth-child(15) { transform: scale(1); animation-delay: 0ms; }
.koiCoil:nth-child(1) { animation-delay: calc(var(--delayCount) * 14); }
/* ... (Keep your nth-child scale logic from previous code here) ... */
</style>
</head>
<body>

<div id="ui-root">
  <input type="file" id="imageUpload" accept="image/*">
  <label>Scale: <input type="range" id="scaleSlider" min="50" max="300" value="150"></label>
  <small>Tap: Pause | Double Tap: Randomize</small>
</div>

<div class="fish" id="fishContainer">
  <div class="koiCoil"></div><div class="koiCoil"></div><div class="koiCoil"></div>
  <div class="koiCoil"></div><div class="koiCoil"></div><div class="koiCoil"></div>
  <div class="koiCoil"></div><div class="koiCoil"></div><div class="koiCoil"></div>
  <div class="koiCoil"></div><div class="koiCoil"></div><div class="koiCoil"></div>
  <div class="koiCoil"></div><div class="koiCoil"></div><div class="koiCoil"></div>
</div>

<script>
const coils = document.querySelectorAll('.koiCoil');
const upload = document.getElementById('imageUpload');
const scaleSlider = document.getElementById('scaleSlider');
let isPaused = false;

// 1. TOUCH REACTIVE: PAUSE & RANDOMIZE
let lastTap = 0;
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#ui-root')) return;

  const now = Date.now();
  if (now - lastTap < 300) {
    // DOUBLE TAP -> RANDOMIZE
    randomizePath();
  } else {
    // SINGLE TAP -> PAUSE/PLAY
    togglePause();
  }
  lastTap = now;
});

function togglePause() {
  isPaused = !isPaused;
  coils.forEach(c => c.style.animationPlayState = isPaused ? 'paused' : 'running');
}

function randomizePath() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  // Create a random Bezier path
  const newPath = `M${Math.random()*w},${Math.random()*h} C${Math.random()*w},${Math.random()*h} ${Math.random()*w},${Math.random()*h} ${Math.random()*w},${Math.random()*h} S${Math.random()*w},${Math.random()*h} ${Math.random()*w},${Math.random()*h}`;
  coils.forEach(c => c.style.offsetPath = `path("${newPath}")`);
}

// 2. IMAGE UPLOAD & DROP
upload.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    const img = document.createElement('img');
    img.src = event.target.result;
    img.className = 'dropped-image';
    img.style.width = scaleSlider.value + 'px';
    img.style.left = '50%';
    img.style.top = '50%';
    
    makeDraggable(img);
    document.body.appendChild(img);
  };
  reader.readAsDataURL(file);
});

// 3. DRAG & DROP LOGIC
function makeDraggable(el) {
  let x = 0, y = 0;
  el.onpointerdown = (e) => {
    e.preventDefault();
    x = e.clientX - el.offsetLeft;
    y = e.clientY - el.offsetTop;
    document.onpointermove = (e) => {
      el.style.left = (e.clientX - x) + 'px';
      el.style.top = (e.clientY - y) + 'px';
    };
    document.onpointerup = () => {
      document.onpointermove = null;
      document.onpointerup = null;
    };
  };
}
</script>
</body>
</html>
