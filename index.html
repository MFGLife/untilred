<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Journal & Calendar Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="email"],
        textarea {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--surface-light);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            line-height: 1.6;
        }

        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px -5px rgba(99, 102, 241, 0.6);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button.listening {
            background: linear-gradient(135deg, var(--error) 0%, var(--secondary) 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        }

        .mic-status {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .mic-status.recording {
            color: var(--error);
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2rem;
        }

        button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .events-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none;
        }

        .events-section.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .events-count {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .event-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease-out;
        }

        .event-item:hover {
            background: rgba(15, 23, 42, 0.8);
            transform: translateX(5px);
            border-color: var(--primary);
        }

        .event-info h4 {
            color: var(--text);
            margin-bottom: 0.25rem;
            font-size: 1rem;
        }

        .event-info p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }

        .event-date {
            background: var(--surface-light);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--primary);
            font-weight: 600;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            color: var(--text);
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--error);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .privacy-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        .privacy-note strong {
            color: var(--primary);
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .card {
                padding: 1.5rem;
            }
            
            .controls {
                flex-direction: column;
                width: 100%;
            }
            
            button {
                width: 100%;
                justify-content: center;
            }
        }

        /* Audio visualizer bars */
        .visualizer {
            display: flex;
            gap: 4px;
            height: 30px;
            align-items: flex-end;
            justify-content: center;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visualizer.active {
            opacity: 1;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, var(--primary), var(--secondary));
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .bar:nth-child(1) { animation-delay: 0s; height: 20%; }
        .bar:nth-child(2) { animation-delay: 0.1s; height: 40%; }
        .bar:nth-child(3) { animation-delay: 0.2s; height: 60%; }
        .bar:nth-child(4) { animation-delay: 0.3s; height: 40%; }
        .bar:nth-child(5) { animation-delay: 0.4s; height: 20%; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="container">
        <header>
            <h1>Voice Journal</h1>
            <p class="subtitle">Talk about your day, extract events, and sync to your calendar automatically</p>
        </header>

        <div class="card">
            <div class="input-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="mic-container">
                <button class="mic-button" id="micBtn" aria-label="Start voice recording">
                    🎤
                </button>
                <div class="visualizer" id="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <span class="mic-status" id="micStatus">Tap microphone to start recording</span>
            </div>

            <div class="input-group">
                <label for="journal">Your Journal Entry</label>
                <textarea id="journal" placeholder="Start speaking or type your day here... Example: 'I have a meeting with Sarah tomorrow at 3pm and dinner with mom on Friday at 7pm'"></textarea>
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="clearAll()">
                    <span>🗑️</span> Clear
                </button>
                <button class="btn-primary" onclick="analyzeText()">
                    <span>🔍</span> Extract Events
                </button>
                <button class="btn-success" onclick="sendEmail()" id="sendBtn">
                    <span>📧</span> Send to Email
                </button>
            </div>

            <div class="events-section" id="eventsSection">
                <div class="events-header">
                    <label>Detected Events</label>
                    <span class="events-count" id="eventsCount">0 found</span>
                </div>
                <div id="eventsList"></div>
                <div style="margin-top: 1rem; text-align: right;">
                    <button class="btn-secondary" onclick="downloadICS()" style="font-size: 0.875rem;">
                        <span>📅</span> Download Calendar File (.ics)
                    </button>
                </div>
            </div>
        </div>

        <div class="privacy-note">
            <strong>🔒 Privacy First:</strong> All processing happens in your browser. 
            No data is sent to any server except your own email client when you choose to send.
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon">✓</span>
        <span id="toastMessage">Message</span>
    </div>

    <script>
        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRecording = false;
        let extractedEvents = [];

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                updateMicUI(true);
                showToast('Recording started... Speak now', 'success');
            };

            recognition.onend = () => {
                isRecording = false;
                updateMicUI(false);
            };

            recognition.onresult = (event) => {
                const textarea = document.getElementById('journal');
                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (finalTranscript) {
                    textarea.value += finalTranscript;
                    analyzeText();
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                showToast('Error: ' + event.error, 'error');
                isRecording = false;
                updateMicUI(false);
            };
        }

        // UI Functions
        function updateMicUI(recording) {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('micStatus');
            const visualizer = document.getElementById('visualizer');
            
            if (recording) {
                btn.classList.add('listening');
                status.textContent = 'Recording... Click to stop';
                status.classList.add('recording');
                visualizer.classList.add('active');
            } else {
                btn.classList.remove('listening');
                status.textContent = 'Tap microphone to start recording';
                status.classList.remove('recording');
                visualizer.classList.remove('active');
            }
        }

        document.getElementById('micBtn').addEventListener('click', () => {
            if (!SpeechRecognition) {
                showToast('Speech recognition not supported in this browser', 'error');
                return;
            }
            
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // Smart Date Parsing
        function parseDateFromText(text) {
            const events = [];
            const today = new Date();
            
            // Common patterns
            const patterns = [
                // "tomorrow at 3pm" or "tomorrow at 3:30 pm"
                {
                    regex: /(tomorrow|today|next\s+(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\s+(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/gi,
                    handler: (match, day, hour, minute, meridian) => {
                        const date = new Date(today);
                        const dayLower = day.toLowerCase();
                        
                        if (dayLower === 'tomorrow') {
                            date.setDate(date.getDate() + 1);
                        } else if (dayLower === 'today') {
                            // keep today
                        } else if (dayLower.includes('next')) {
                            const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
                            const targetDay = days.indexOf(dayLower.replace('next ', ''));
                            const currentDay = date.getDay();
                            const daysUntil = (targetDay + 7 - currentDay) % 7 || 7;
                            date.setDate(date.getDate() + daysUntil);
                        }
                        
                        let h = parseInt(hour);
                        const m = minute ? parseInt(minute) : 0;
                        
                        if (meridian) {
                            if (meridian.toLowerCase() === 'pm' && h !== 12) h += 12;
                            if (meridian.toLowerCase() === 'am' && h === 12) h = 0;
                        } else if (h < 8) {
                            h += 12; // Assume afternoon for times < 8 if no am/pm
                        }
                        
                        date.setHours(h, m, 0, 0);
                        return date;
                    }
                },
                // "on Friday at 7pm"
                {
                    regex: /on\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\s+(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/gi,
                    handler: (match, dayName, hour, minute, meridian) => {
                        const date = new Date(today);
                        const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
                        const targetDay = days.indexOf(dayName.toLowerCase());
                        const currentDay = date.getDay();
                        let daysUntil = targetDay - currentDay;
                        if (daysUntil <= 0) daysUntil += 7;
                        date.setDate(date.getDate() + daysUntil);
                        
                        let h = parseInt(hour);
                        const m = minute ? parseInt(minute) : 0;
                        
                        if (meridian) {
                            if (meridian.toLowerCase() === 'pm' && h !== 12) h += 12;
                            if (meridian.toLowerCase() === 'am' && h === 12) h = 0;
                        }
                        
                        date.setHours(h, m, 0, 0);
                        return date;
                    }
                },
                // "next week" or "in 2 days"
                {
                    regex: /(in\s+(\d+)\s+days?|next\s+week)/gi,
                    handler: (match, full, days) => {
                        const date = new Date(today);
                        if (days) {
                            date.setDate(date.getDate() + parseInt(days));
                        } else {
                            date.setDate(date.getDate() + 7);
                        }
                        date.setHours(9, 0, 0, 0); // Default to 9am
                        return date;
                    }
                }
            ];

            // Look for event indicators
            const eventIndicators = [
                'meeting', 'call', 'appointment', 'lunch', 'dinner', 'breakfast',
                'interview', 'deadline', 'due', 'party', 'event', 'conference',
                'doctor', 'dentist', 'flight', 'trip', 'visit', 'session'
            ];

            // Split by common separators
            const sentences = text.split(/[.!?]+|and then|also|, but|,/);
            
            sentences.forEach(sentence => {
                const lowerSentence = sentence.toLowerCase();
                
                // Check if sentence contains event keywords
                const hasEvent = eventIndicators.some(indicator => 
                    lowerSentence.includes(indicator)
                );
                
                if (hasEvent) {
                    // Try to extract event title
                    let title = sentence.trim();
                    // Clean up the title
                    title = title.replace(/^(I have|There's|I need to|Don't forget|Remember to)/i, '').trim();
                    title = title.charAt(0).toUpperCase() + title.slice(1);
                    
                    // Try to find date/time
                    let eventDate = null;
                    
                    for (const pattern of patterns) {
                        pattern.regex.lastIndex = 0; // Reset regex
                        const match = pattern.regex.exec(sentence);
                        if (match) {
                            eventDate = pattern.handler(match, match[1], match[2], match[3], match[4]);
                            break;
                        }
                    }
                    
                    // If no specific time found but has "tomorrow" or day name
                    if (!eventDate) {
                        const tomorrowMatch = sentence.match(/tomorrow/i);
                        const dayMatch = sentence.match(/on\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i);
                        
                        if (tomorrowMatch) {
                            eventDate = new Date(today);
                            eventDate.setDate(eventDate.getDate() + 1);
                            eventDate.setHours(9, 0, 0, 0);
                        } else if (dayMatch) {
                            const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
                            const targetDay = days.indexOf(dayMatch[1].toLowerCase());
                            const currentDay = today.getDay();
                            let daysUntil = targetDay - currentDay;
                            if (daysUntil <= 0) daysUntil += 7;
                            eventDate = new Date(today);
                            eventDate.setDate(eventDate.getDate() + daysUntil);
                            eventDate.setHours(9, 0, 0, 0);
                        }
                    }
                    
                    if (eventDate) {
                        events.push({
                            title: title.length > 50 ? title.substring(0, 50) + '...' : title,
                            date: eventDate,
                            originalText: sentence.trim()
                        });
                    }
                }
            });
            
            return events;
        }

        function analyzeText() {
            const text = document.getElementById('journal').value;
            if (!text.trim()) {
                document.getElementById('eventsSection').classList.remove('active');
                return;
            }
            
            extractedEvents = parseDateFromText(text);
            displayEvents();
        }

        function displayEvents() {
            const section = document.getElementById('eventsSection');
            const list = document.getElementById('eventsList');
            const count = document.getElementById('eventsCount');
            
            if (extractedEvents.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No events detected yet. Try mentioning specific times like "meeting tomorrow at 3pm"</p>
                    </div>
                `;
                section.classList.add('active');
                count.textContent = '0 found';
                return;
            }
            
            count.textContent = `${extractedEvents.length} found`;
            list.innerHTML = extractedEvents.map((event, index) => `
                <div class="event-item">
                    <div class="event-info">
                        <h4>${escapeHtml(event.title)}</h4>
                        <p>${formatDate(event.date)}</p>
                    </div>
                    <div class="event-date">
                        ${event.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
                        <br>
                        <small>${event.date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</small>
                    </div>
                </div>
            `).join('');
            
            section.classList.add('active');
        }

        function formatDate(date) {
            const options = { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' };
            return date.toLocaleDateString('en-US', options);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generateICS() {
            if (extractedEvents.length === 0) return null;
            
            const now = new Date();
            const timestamp = now.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            
            let icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Voice Journal//EN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
            ];
            
            extractedEvents.forEach((event, index) => {
                const start = event.date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const end = new Date(event.date.getTime() + 60 * 60 * 1000); // 1 hour duration
                const endStr = end.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const uid = `event-${index}-${Date.now()}@voicejournal`;
                
                icsContent = icsContent.concat([
                    'BEGIN:VEVENT',
                    `UID:${uid}`,
                    `DTSTAMP:${timestamp}`,
                    `DTSTART:${start}`,
                    `DTEND:${endStr}`,
                    `SUMMARY:${event.title}`,
                    `DESCRIPTION:Extracted from Voice Journal\\n\\nOriginal text: ${event.originalText}`,
                    'STATUS:CONFIRMED',
                    'BEGIN:VALARM',
                    'ACTION:DISPLAY',
                    'DESCRIPTION:Reminder',
                    'TRIGGER:-PT15M',
                    'END:VALARM',
                    'END:VEVENT'
                ]);
            });
            
            icsContent.push('END:VCALENDAR');
            return icsContent.join('\r\n');
        }

        function downloadICS() {
            const ics = generateICS();
            if (!ics) {
                showToast('No events to download', 'error');
                return;
            }
            
            const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `voice-journal-events-${new Date().toISOString().split('T')[0]}.ics`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            
            showToast('Calendar file downloaded!', 'success');
        }

        function sendEmail() {
            const email = document.getElementById('email').value;
            const journal = document.getElementById('journal').value;
            
            if (!email) {
                showToast('Please enter your email address', 'error');
                document.getElementById('email').focus();
                return;
            }
            
            if (!journal.trim()) {
                showToast('Please enter some text first', 'error');
                return;
            }
            
            // Generate email content
            let body = 'Voice Journal Entry\n\n';
            body += journal + '\n\n';
            
            if (extractedEvents.length > 0) {
                body += '--- EXTRACTED EVENTS ---\n\n';
                extractedEvents.forEach(event => {
                    body += `📅 ${event.title}\n`;
                    body += `   When: ${formatDate(event.date)}\n\n`;
                });
                body += '\nICS calendar file attached (if supported by your email client).\n';
            }
            
            body += '\n---\nSent via Voice Journal';
            
            // Create mailto link
            const subject = `Voice Journal - ${new Date().toLocaleDateString()}`;
            const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            
            // Also download ICS file automatically so they can attach it
            if (extractedEvents.length > 0) {
                downloadICS();
                setTimeout(() => {
                    window.location.href = mailtoLink;
                }, 500);
            } else {
                window.location.href = mailtoLink;
            }
            
            showToast('Opening your email client...', 'success');
        }

        function clearAll() {
            if (confirm('Clear all text and events?')) {
                document.getElementById('journal').value = '';
                document.getElementById('email').value = '';
                extractedEvents = [];
                document.getElementById('eventsSection').classList.remove('active');
                showToast('Cleared!', 'success');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            msg.textContent = message;
            icon.textContent = type === 'success' ? '✓' : '⚠';
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Auto-analyze as user types (debounced)
        let debounceTimer;
        document.getElementById('journal').addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(analyzeText, 1000);
        });

        // Check for speech API support on load
        window.addEventListener('load', () => {
            if (!SpeechRecognition) {
                document.getElementById('micStatus').textContent = 'Voice input not supported in this browser. Please type or use Chrome/Safari.';
                document.getElementById('micBtn').style.opacity = '0.5';
                document.getElementById('micBtn').style.cursor = 'not-allowed';
            }
        });
    </script>
</body>
</html>
