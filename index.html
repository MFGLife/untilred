<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authoring Yard - Object Centric</title>
    <style>
        :root { --accent: #00f2ff; --bg: #0b0b0b; --panel: #1a1a1a; --track-h: 34px; }
        body { margin: 0; background: var(--bg); color: #eee; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
        
        /* Layout */
        #app { display: flex; flex-direction: column; height: 100vh; }
        #viewport { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { background: #000; box-shadow: 0 0 50px rgba(0,0,0,0.5); max-width: 100%; max-height: 100%; }

        /* Toolbar */
        #toolbar { background: var(--panel); padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #333; }
        button { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:active { background: #444; }
        button.rec { color: #ff4444; }
        button.rec.active { background: #ff4444; color: white; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Timeline Authority */
        #timeline-container { height: 250px; background: var(--panel); border-top: 2px solid #333; position: relative; overflow-y: auto; }
        #time-ruler { height: 20px; border-bottom: 1px solid #444; position: sticky; top: 0; background: var(--panel); z-index: 5; }
        #tracks-area { position: relative; padding: 10px 0; min-height: 100px; }
        
        .track-row { height: var(--track-h); border-bottom: 1px solid #222; position: relative; width: 100%; display: flex; align-items: center; }
        .track-label { width: 80px; font-size: 10px; color: #888; padding-left: 10px; flex-shrink: 0; pointer-events: none; }
        
        .clip {
            position: absolute; height: 24px; border-radius: 4px;
            background: #444; border: 1px solid #666; cursor: pointer;
            display: flex; align-items: center; padding: 0 5px; font-size: 11px;
            user-select: none; white-space: nowrap; overflow: hidden;
        }
        .clip.selected { border: 2px solid var(--accent); box-shadow: 0 0 10px rgba(0,242,255,0.3); }
        .clip.fish { background: #264653; }
        .clip.bg { background: #2a9d8f; }
        .clip.prop { background: #e9c46a; color: #000; }

        #playhead {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background: var(--accent); z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="toolbar">
        <button onclick="addAsset('bg')">+ Background</button>
        <button onclick="addAsset('prop')">+ Prop (PNG)</button>
        <button onclick="spawnFish()">+ Spawn Fish</button>
        <div style="flex:1"></div>
        <button id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button id="recBtn" class="rec" onclick="toggleRecord()">● Record Fish</button>
    </div>

    <div id="viewport">
        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <div id="timeline-container" id="timelineScroll">
        <div id="time-ruler"></div>
        <div id="tracks-area" id="tracksArea">
            <div id="playhead"></div>
            </div>
    </div>
</div>

<input type="file" id="fileInput" hidden accept="image/png">

<script>
/** * APP STATE 
 */
const state = {
    duration: 22, // Fixed 22 seconds
    currentTime: 0,
    isPlaying: false,
    isRecording: false,
    selectedId: null,
    objects: []
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');

/**
 * OBJECT CLASSES
 */
class SceneObject {
    constructor(type, asset = null) {
        this.id = crypto.randomUUID();
        this.type = type;
        this.asset = asset;
        this.start = state.currentTime;
        this.end = Math.min(state.currentTime + 10, state.duration);
        this.x = 640; this.y = 360; this.scale = 0.5; this.rotation = 0;
        this.keyframes = []; // Only used by fish
    }
}

/**
 * ASSET HANDLING
 */
function addAsset(type) {
    fileInput.onchange = e => {
        const file = e.target.files[0];
        const img = new Image();
        img.onload = () => {
            const obj = new SceneObject(type, img);
            if(type === 'bg') { obj.scale = 1; obj.x = 640; obj.y = 360; }
            state.objects.push(obj);
            state.selectedId = obj.id;
            renderTimeline();
        };
        img.src = URL.createObjectURL(file);
    };
    fileInput.click();
}

function spawnFish() {
    const fish = new SceneObject('fish');
    state.objects.push(fish);
    state.selectedId = fish.id;
    renderTimeline();
}

/**
 * TIMELINE UI
 */
function renderTimeline() {
    const area = document.getElementById('tracks-area');
    // Clear existing except playhead
    const clips = area.querySelectorAll('.clip, .track-row');
    clips.forEach(c => c.remove());

    state.objects.forEach((obj, index) => {
        const row = document.createElement('div');
        row.className = 'track-row';
        
        const clip = document.createElement('div');
        clip.className = `clip ${obj.type} ${state.selectedId === obj.id ? 'selected' : ''}`;
        clip.innerText = `${obj.type.toUpperCase()}`;
        
        // Positioning
        const startPct = (obj.start / state.duration) * 100;
        const widthPct = ((obj.end - obj.start) / state.duration) * 100;
        clip.style.left = `${startPct}%`;
        clip.style.width = `${widthPct}%`;

        clip.onclick = (e) => {
            e.stopPropagation();
            state.selectedId = obj.id;
            renderTimeline();
        };

        // Simple drag to move start time
        clip.onpointerdown = (e) => {
            state.selectedId = obj.id;
            const startX = e.clientX;
            const originalStart = obj.start;
            const originalEnd = obj.end;
            const rect = area.getBoundingClientRect();

            document.onpointermove = (em) => {
                const deltaT = ((em.clientX - startX) / rect.width) * state.duration;
                const dur = originalEnd - originalStart;
                obj.start = Math.max(0, Math.min(state.duration - dur, originalStart + deltaT));
                obj.end = obj.start + dur;
                renderTimeline();
            };
            document.onpointerup = () => document.onpointermove = null;
        };

        row.appendChild(clip);
        area.appendChild(row);
    });
}

/**
 * RENDER LOOP
 */
function update(now) {
    if (state.isPlaying) {
        state.currentTime += 0.016; // Approx 60fps
        if (state.currentTime >= state.duration) {
            state.currentTime = 0;
            state.isPlaying = false;
        }
    }

    // Update playhead
    const ph = document.getElementById('playhead');
    ph.style.left = `${(state.currentTime / state.duration) * 100}%`;

    // Draw Canvas
    ctx.fillStyle = "black";
    ctx.fillRect(0,0, canvas.width, canvas.height);

    state.objects.forEach(obj => {
        if (state.currentTime >= obj.start && state.currentTime <= obj.end) {
            ctx.save();
            
            // Apply Recording/Keyframes for Fish
            if (obj.type === 'fish' && obj.keyframes.length > 0) {
                const kf = obj.keyframes.findLast(k => k.t <= state.currentTime) || obj.keyframes[0];
                ctx.translate(kf.x, kf.y);
            } else {
                ctx.translate(obj.x, obj.y);
            }
            
            ctx.scale(obj.scale, obj.scale);
            ctx.rotate(obj.rotation);

            if (obj.asset) {
                ctx.drawImage(obj.asset, -obj.asset.width/2, -obj.asset.height/2);
            } else if (obj.type === 'fish') {
                // Placeholder fish
                ctx.fillStyle = "cyan";
                ctx.beginPath(); ctx.ellipse(0,0, 50, 30, 0, 0, Math.PI*2); ctx.fill();
            }
            
            // Selection Highlight on Canvas
            if (state.selectedId === obj.id) {
                ctx.strokeStyle = "cyan";
                ctx.lineWidth = 5;
                ctx.strokeRect(-60, -40, 120, 80);
            }
            
            ctx.restore();
        }
    });

    requestAnimationFrame(update);
}

/**
 * CONTROLS
 */
function togglePlay() { 
    state.isPlaying = !state.isPlaying; 
    document.getElementById('playBtn').innerText = state.isPlaying ? "⏸ Pause" : "▶ Play";
}

function toggleRecord() {
    const activeObj = state.objects.find(o => o.id === state.selectedId);
    if (!activeObj || activeObj.type !== 'fish') return alert("Select a Fish on the timeline first!");
    
    state.isRecording = !state.isRecording;
    document.getElementById('recBtn').classList.toggle('active');
    if (state.isRecording) {
        state.isPlaying = true;
        activeObj.keyframes = []; // Clear old recording
    }
}

// Canvas Interaction (Transform Selected Object)
canvas.onpointermove = (e) => {
    if (!state.selectedId) return;
    const obj = state.objects.find(o => o.id === state.selectedId);
    
    // If recording, save mouse pos to keyframes
    if (state.isRecording && obj.type === 'fish') {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        obj.keyframes.push({ t: state.currentTime, x, y });
    }
};

// Global scrub on timeline background
document.getElementById('timeline-container').onpointerdown = (e) => {
    if (e.target.className.includes('clip')) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const scrub = (ev) => {
        const x = ev.clientX - rect.left;
        state.currentTime = Math.max(0, Math.min(state.duration, (x / rect.width) * state.duration));
    };
    scrub(e);
    document.onpointermove = scrub;
    document.onpointerup = () => document.onpointermove = null;
};

requestAnimationFrame(update);
renderTimeline();
</script>
</body>
</html>
