<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>until.red</title>

<meta name="description" content="You were never supposed to find this.">
<meta property="og:title" content="until.red">
<meta property="og:description" content="You were never supposed to find this.">
<meta property="og:image" content="logo.png">

<link rel="icon" href="logo.png">

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:Courier New,monospace;
}

#grid{

display:grid;
width:100vw;
height:100vh;

}

.cell{

display:flex;
align-items:center;
justify-content:center;

color:#86b62f;

font-size:18px;

}

.reveal{

color:white;
font-weight:bold;
animation:pulse 2s infinite alternate;

}

@keyframes pulse{

from{opacity:.3;}
to{opacity:1;}

}

</style>
</head>

<body>

<div id="grid"></div>

<script>



/* ===========================
MESSAGE TO HIDE
=========================== */

const paragraph = `A research cult for those who know the story is rigged but refuse to play their assigned character. We weaponize double-entendre, anonymous ritual and AI-augmented language to expose the machinery behind the mask without sacrificing the people wearing it.`;


/* ===========================
GLYPH SET
=========================== */

const glyphs = [

'∴','⟟','↺','⧗','Δ','☍','⟁','✦','☲','☷',
'⧖','⧘','⧙','⟲','⫽','🝮','♾','🜁','🜃','̸'

];


/* ===========================
GRID STATE
=========================== */

let cols=0;
let rows=0;

let cells=[];

let words = paragraph.split(" ");

let wordIndex=0;
let letterIndex=0;

let revealMap=[];


/* ===========================
CREATE GRID
=========================== */

function createGrid(){

const grid=document.getElementById("grid");

const size=22;

cols=Math.floor(window.innerWidth/size);
rows=Math.floor(window.innerHeight/size);

grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
grid.style.gridTemplateRows=`repeat(${rows},1fr)`;

grid.innerHTML="";

cells=[];

for(let i=0;i<cols*rows;i++){

let span=document.createElement("div");

span.className="cell";

span.textContent=randomGlyph();

grid.appendChild(span);

cells.push(span);

}

}


/* ===========================
GLYPH RANDOM
=========================== */

function randomGlyph(){

return glyphs[Math.floor(Math.random()*glyphs.length)];

}


/* ===========================
FILL RANDOM
=========================== */

function fillNoise(){

for(let i=0;i<cells.length;i++){

if(!revealMap.includes(i)){

cells[i].textContent=randomGlyph();
cells[i].classList.remove("reveal");

}

}

}


/* ===========================
PLACE NEXT LETTER
=========================== */

function revealNextLetter(){

if(wordIndex>=words.length)return;

const word=words[wordIndex];

if(letterIndex>=word.length){

letterIndex=0;
wordIndex++;

return;

}

let randomIndex;

do{

randomIndex=Math.floor(Math.random()*cells.length);

}while(revealMap.includes(randomIndex));

cells[randomIndex].textContent=word[letterIndex];

cells[randomIndex].classList.add("reveal");

revealMap.push(randomIndex);

letterIndex++;

}


/* ===========================
ANIMATE LOOP
=========================== */

function animate(){

fillNoise();

revealNextLetter();

}


/* ===========================
INIT
=========================== */

createGrid();

setInterval(animate,80);


/* ===========================
RESPONSIVE
=========================== */

window.addEventListener("resize",()=>{

createGrid();

revealMap=[];

wordIndex=0;
letterIndex=0;

});



</script>

</body>
</html>
