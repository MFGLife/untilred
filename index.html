<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salmon - Continuous Strands</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.sizes = { width: window.innerWidth, height: window.innerHeight };
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x101535); // Slightly lighter blue
    this.scene.fog = new THREE.FogExp2(0x101535, 0.1);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.sizes.width, this.sizes.height);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    // Enable better lighting calculations
    this.renderer.physicallyCorrectLights = true;
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(75, this.sizes.width / this.sizes.height, 0.1, 500);
    this.camera.position.set(0, 2, 4);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.clock = new THREE.Clock();
    this.tasks = [];
    
    this.init();
    this.animate();
  }

  init() {
    this.addLights();
    this.createReflectiveGround();
    this.createContinuousStrands();
    this.loadFish();
  }

  addLights() {
    // Ambient light for general visibility
    this.scene.add(new THREE.AmbientLight(0x4040ff, 0.5));
    
    // Directional light from top
    const topLight = new THREE.DirectionalLight(0xffffff, 2);
    topLight.position.set(0, 10, 0);
    this.scene.add(topLight);

    // Floor glow light - This prevents the bottom from being pitch black
    const floorLight = new THREE.PointLight(0x00ffff, 10, 20);
    floorLight.position.set(0, -0.5, 0);
    this.scene.add(floorLight);
  }

  createReflectiveGround() {
    // Using Physical Material for reflections and "wet" look
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshPhysicalMaterial({ 
        color: 0x1a1a2e,
        metalness: 0.6,
        roughness: 0.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        reflectivity: 1.0
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.0; 
    this.scene.add(floor);
  }

  createContinuousStrands() {
    const strandCount = 1200; 
    const particlesPerStrand = 30; 
    const totalParticles = strandCount * particlesPerStrand;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(totalParticles * 3);
    const delays = new Float32Array(totalParticles);

    for (let i = 0; i < strandCount; i++) {
      const rootX = (Math.random() - 0.5) * 45;
      const rootZ = (Math.random() - 0.5) * 45;

      for (let j = 0; j < particlesPerStrand; j++) {
        const idx = (i * particlesPerStrand + j);
        
        positions[idx * 3] = rootX;
        // TIGHTER SPACING: j * 0.04 instead of 0.1 makes them touch
        positions[idx * 3 + 1] = j * 0.04; 
        positions[idx * 3 + 2] = rootZ;

        delays[idx] = j * 0.15; 
      }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aDelay', new THREE.BufferAttribute(delays, 1));

    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x44ffaa) }
      },
      vertexShader: `
        uniform float uTime;
        attribute float aDelay;
        void main() {
          vec3 pos = position;
          // Sway logic
          float wave = sin(uTime * 1.5 - (pos.y * 4.0)) * (aDelay * 0.08);
          pos.x += wave;
          pos.z += wave;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          // SIZE INCREASED to 12.0 so particles overlap into a strand
          gl_PointSize = 12.0 * (1.0 / -mvPosition.z); 
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if(d > 0.5) discard;
          // Softer edges for a continuous organic look
          gl_FragColor = vec4(uColor, 0.8);
        }
      `,
      transparent: true,
      depthWrite: false // Helps avoid black boxes when particles overlap
    });

    const points = new THREE.Points(geometry, material);
    points.position.y = -1.0; 
    this.scene.add(points);

    this.tasks.push(() => {
      material.uniforms.uTime.value = this.clock.getElapsedTime();
    });
  }

  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", (gltf) => {
      const fish = gltf.scene.children[0];
      fish.traverse(c => { if(c.isMesh) c.material = new THREE.MeshStandardMaterial({color: 0x000000, roughness: 0.1}); });
      
      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);
      fish.position.set(0,0,0);
      fish.rotation.set(0,0,0);
      fish.scale.set(1,1,1);

      const initialPoints = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 100) {
        const dist = 1 + Math.sin(i * 10) / 30;
        initialPoints.push(new THREE.Vector3(Math.sin(i) * dist, -0.2, Math.cos(i) * dist));
      }

      const curve = new THREE.CatmullRomCurve3(initialPoints);
      const flow = new Flow(fish);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);

      this.tasks.push(() => { flow.moveAlongCurve(0.001); });
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.tasks.forEach(t => t());
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
