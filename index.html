<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Texting Music Video</title>
<style>
  body {
    margin: 0;
    font-family: 'Helvetica', sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .chat-container {
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: linear-gradient(#111, #222);
  }
  .bubble {
    max-width: 80%;
    margin: 5px 0;
    padding: 10px 15px;
    border-radius: 20px;
    word-wrap: break-word;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
  }
  .human {
    background: #ff4d6d;
    align-self: flex-end;
  }
  .ai {
    background: #4d9eff;
    align-self: flex-start;
  }
  .typing {
    font-style: italic;
    opacity: 0.6;
  }
  .input-area {
    padding: 10px;
    background: #111;
    display: flex;
  }
  .input-area textarea {
    flex: 1;
    resize: none;
    padding: 8px;
    border-radius: 10px;
    border: none;
    font-family: monospace;
    font-size: 14px;
  }
  .input-area button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="chat-container" id="chat"></div>

<div class="input-area">
  <textarea id="lyricsInput" rows="4" placeholder="Paste your lyrics here with H: or AI: prefixes..."></textarea>
  <button onclick="startChat()">Play</button>
</div>

<script>
const chatContainer = document.getElementById('chat');
const inputArea = document.getElementById('lyricsInput');

function startChat() {
  chatContainer.innerHTML = '';
  const lines = inputArea.value.split('\n').filter(l => l.trim() !== '');
  let delay = 0;

  lines.forEach((line, index) => {
    let sender = 'human';
    let content = line;

    if (line.startsWith('AI:')) {
      sender = 'ai';
      content = line.slice(3).trim();
    } else if (line.startsWith('H:')) {
      sender = 'human';
      content = line.slice(2).trim();
    }

    setTimeout(() => {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble', sender);
      bubble.textContent = content;
      chatContainer.appendChild(bubble);

      // Animate in
      requestAnimationFrame(() => {
        bubble.style.opacity = 1;
        bubble.style.transform = 'translateY(0)';
        chatContainer.scrollTop = chatContainer.scrollHeight;
      });
    }, delay);

    // Increase delay per line (adjust for speed)
    delay += 800 + Math.random() * 400; // random variance for realism
  });
}
</script>

</body>
</html>
