<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salmon</title>
    <style>
        :root {
            --ui-bg: rgba(0, 0, 0, 0.8);
            --accent: #ffffff;
        }

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* UI Styling */
        #menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: var(--ui-bg);
            color: white;
            border: 1px solid var(--accent);
            cursor: pointer;
            border-radius: 4px;
        }

        #side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 250px;
            height: 100%;
            background: var(--ui-bg);
            color: white;
            transition: 0.3s;
            padding: 80px 20px;
            z-index: 90;
            border-right: 1px solid #333;
        }

        #side-menu.open { left: 0; }

        #foreground-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .active-img {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            touch-action: none;
            outline: 2px dashed white;
        }

        #ui-controls {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 110;
        }

        .btn-save {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<button id="menu-btn">Salmon Menu</button>

<div id="side-menu">
    <h2>Salmon</h2>
    <hr>
    <p>Add Foreground Image:</p>
    <input type="file" id="img-upload" accept="image/*">
    <p><small>Scroll to resize, drag to move. Double-click fish in 3D to flip.</small></p>
</div>

<div id="ui-controls">
    <button class="btn-save" id="save-btn">Accept & Set in Foreground</button>
</div>

<div id="foreground-layer"></div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

// --- UI Logic ---
const menuBtn = document.getElementById('menu-btn');
const sideMenu = document.getElementById('side-menu');
const imgUpload = document.getElementById('img-upload');
const saveBtn = document.getElementById('save-btn');
const uiControls = document.getElementById('ui-controls');
const fgLayer = document.getElementById('foreground-layer');

let activeEl = null;
let transform = { x: window.innerWidth/2, y: window.innerHeight/2, s: 1 };

menuBtn.onclick = () => sideMenu.classList.toggle('open');

imgUpload.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    
    if(activeEl) activeEl.remove();
    activeEl = document.createElement('img');
    activeEl.src = url;
    activeEl.className = 'active-img';
    activeEl.style.width = "200px";
    document.body.appendChild(activeEl);
    
    transform = { x: window.innerWidth/2, y: window.innerHeight/2, s: 1 };
    updateImgStyle();
    uiControls.style.display = 'block';
    sideMenu.classList.remove('open');
    setupDrag();
};

function setupDrag() {
    let dragging = false;
    activeEl.onpointerdown = (e) => { dragging = true; activeEl.setPointerCapture(e.pointerId); };
    window.onpointermove = (e) => {
        if(!dragging) return;
        transform.x = e.clientX;
        transform.y = e.clientY;
        updateImgStyle();
    };
    window.onpointerup = () => dragging = false;
    window.onwheel = (e) => {
        if(!activeEl) return;
        transform.s += e.deltaY * -0.001;
        transform.s = Math.max(0.1, transform.s);
        updateImgStyle();
    };
}

function updateImgStyle() {
    if(!activeEl) return;
    activeEl.style.transform = `translate(calc(${transform.x}px - 50%), calc(${transform.y}px - 50%)) scale(${transform.s})`;
}

saveBtn.onclick = () => {
    const saved = activeEl.cloneNode();
    saved.classList.remove('active-img');
    saved.style.outline = "none";
    fgLayer.appendChild(saved);
    activeEl.remove();
    activeEl = null;
    uiControls.style.display = 'none';
};

// --- Three.js Logic ---
class SalmonApp {
    constructor() {
        this.sizes = { width: window.innerWidth, height: window.innerHeight };
        this.canvas = document.createElement('canvas');
        document.body.appendChild(this.canvas);

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x002C9B);
        this.scene.fog = new THREE.FogExp2(0x002C9B, 0.15);

        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
        this.renderer.setSize(this.sizes.width, this.sizes.height);
        this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));

        this.camera = new THREE.PerspectiveCamera(75, this.sizes.width/this.sizes.height, 0.1, 1000);
        this.camera.position.set(0, 2, 5);
        
        this.controls = new OrbitControls(this.camera, this.canvas);
        this.clock = new THREE.Clock();
        this.flow = null;
        this.flipRotation = 0;

        this.init();
    }

    init() {
        this.addLights();
        this.loadModels();
        this.addEvents();
        this.animate();
    }

    addLights() {
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dir = new THREE.DirectionalLight(0xffffff, 1);
        dir.position.set(5, 5, 5);
        this.scene.add(dir);
    }

    loadModels() {
        const loader = new GLTFLoader();
        
        // Load Fish
        loader.load("https://assets.codepen.io/5946/fish.glb", (gltf) => {
            const fish = gltf.scene.children[0];
            
            // Texture modification: Solid Black with White Glow (Outline)
            gltf.scene.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshBasicMaterial({ 
                        color: 0x000000,
                    });
                    // Adding wireframe overlay for visibility "outline" effect
                    const wire = new THREE.Mesh(child.geometry, new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.2
                    }));
                    child.add(wire);
                }
            });

            fish.scale.set(0.01, 0.01, 0.01);
            fish.rotation.x = Math.PI * 0.5;
            fish.updateMatrix();
            fish.geometry.applyMatrix4(fish.matrix);

            // Create Path
            const points = [];
            for (let i = 0; i < Math.PI * 2; i += 0.1) {
                points.push(new THREE.Vector3(Math.sin(i) * 3, 0, Math.cos(i) * 3));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            
            this.flow = new Flow(fish);
            this.flow.updateCurve(0, curve);
            this.scene.add(this.flow.object3D);
        });

        // Load Landscape
        loader.load("https://assets.codepen.io/5946/landscape.glb", (gltf) => {
            const landscape = gltf.scene;
            landscape.scale.set(10, 10, 10);
            landscape.position.y = -2;
            this.scene.add(landscape);
        });
    }

    addEvents() {
        window.addEventListener('resize', () => {
            this.sizes.width = window.innerWidth;
            this.sizes.height = window.innerHeight;
            this.camera.aspect = this.sizes.width / this.sizes.height;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(this.sizes.width, this.sizes.height);
        });

        // Double Click to Flip
        window.addEventListener('dblclick', () => {
            if(this.flow) {
                this.flipRotation = this.flipRotation === 0 ? Math.PI : 0;
                this.flow.object3D.rotation.y = this.flipRotation;
            }
        });
    }

    animate() {
        requestAnimationFrame(this.animate.bind(this));
        if (this.flow) this.flow.moveAlongCurve(0.002);
        this.renderer.render(this.scene, this.camera);
    }
}

new SalmonApp();
</script>
</body>
</html>
