<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPM Face Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); }
        #input_video { display: none; }
        #output_canvas { display: block; width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-family: 'Inter', sans-serif; font-size: 18px;
            pointer-events: none; letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            z-index: 100;
        }
        #ui {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 12px 24px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        #debug {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255,255,255,0.6);
            font-family: monospace;
            font-size: 12px;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

<div id="loading">Loading Avatar...</div>
<video id="input_video" playsinline></video>
<canvas id="output_canvas"></canvas>
<div id="debug">Tracking: Active</div>
<div id="ui">
    <button onclick="toggleExpressionDebug()">Debug Vis</button>
    <button onclick="calibrate()">Calibrate</button>
    <button onclick="resetView()">Reset</button>
</div>

<script>
// ============================================================
// READYPLAYERME OPTIMIZED CONFIG
// ============================================================
const CONFIG = {
    modelUrl: 'https://models.readyplayer.me/65a1acf7c941dcc8caf44e6c.glb?morphTargets=ARKit&textureAtlas=1024',
    
    // RPM uses ARKit blendshapes - these are the standard names
    blendShapes: {
        // Eyes
        eyeBlinkLeft: 'eyeBlinkLeft',
        eyeBlinkRight: 'eyeBlinkRight',
        eyeWideLeft: 'eyeWideLeft',
        eyeWideRight: 'eyeWideRight',
        eyeSquintLeft: 'eyeSquintLeft',
        eyeSquintRight: 'eyeSquintRight',
        
        // Brows
        browInnerUp: 'browInnerUp',
        browOuterUpLeft: 'browOuterUpLeft',
        browOuterUpRight: 'browOuterUpRight',
        browDownLeft: 'browDownLeft',
        browDownRight: 'browDownRight',
        
        // Nose
        noseSneerLeft: 'noseSneerLeft',
        noseSneerRight: 'noseSneerRight',
        
        // Mouth
        mouthOpen: 'jawOpen', // RPM uses jawOpen for mouth
        mouthSmileLeft: 'mouthSmileLeft',
        mouthSmileRight: 'mouthSmileRight',
        mouthFrownLeft: 'mouthFrownLeft',
        mouthFrownRight: 'mouthFrownRight',
        mouthShrugUpper: 'mouthShrugUpper',
        mouthShrugLower: 'mouthShrugLower',
        mouthRollUpper: 'mouthRollUpper',
        mouthRollLower: 'mouthRollLower',
        mouthPucker: 'mouthPucker',
        mouthFunnel: 'mouthFunnel',
        
        // Jaw
        jawOpen: 'jawOpen',
        jawLeft: 'jawLeft',
        jawRight: 'jawRight',
        jawForward: 'jawForward',
        
        // Cheeks
        cheekPuff: 'cheekPuff',
        cheekSquintLeft: 'cheekSquintLeft',
        cheekSquintRight: 'cheekSquintRight'
    },
    
    smoothing: 0.15,
    headScale: 2.2,
    positionSmoothing: 0.1
};

// ============================================================
// THREE.JS SETUP
// ============================================================
const canvas = document.getElementById('output_canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0c29);
scene.fog = new THREE.FogExp2(0x0f0c29, 0.02);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.1, 2.8);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// Anime-style lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xfff0dd, 1.0);
keyLight.position.set(2, 3, 2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0001;
scene.add(keyLight);

const rimLight = new THREE.SpotLight(0x00ffff, 2.0);
rimLight.position.set(-3, 2, -3);
rimLight.lookAt(0, 0, 0);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xff69b4, 0.4);
fillLight.position.set(2, -1, 2);
scene.add(fillLight);

// ============================================================
// RPM AVATAR SYSTEM
// ============================================================
let avatar = null;
let morphMeshes = [];
let bones = {};
let targetHeadRot = new THREE.Euler(0, 0, 0);
let currentHeadRot = new THREE.Euler(0, 0, 0);
let targetHeadPos = new THREE.Vector3(0, 0, 0);
let currentHeadPos = new THREE.Vector3(0, 0, 0);

// Expression calibration baseline
let calibration = {
    eyeOpenness: 1,
    mouthNeutral: 0,
    browNeutral: 0
};

function loadAvatar() {
    const loader = new THREE.GLTFLoader();
    
    loader.load(CONFIG.modelUrl, (gltf) => {
        avatar = gltf.scene;
        
        // RPM optimization: Center and scale properly
        const box = new THREE.Box3().setFromObject(avatar);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        // RPM avatars are typically ~1.8m tall, scale to fit view
        const scale = CONFIG.headScale / size.y;
        avatar.scale.setScalar(scale);
        avatar.position.sub(center.multiplyScalar(scale));
        avatar.position.y += 0.1; // Slight offset for framing
        
        // Collect all morph target meshes
        avatar.traverse((node) => {
            if (node.isMesh && node.morphTargetDictionary) {
                morphMeshes.push({
                    mesh: node,
                    dictionary: node.morphTargetDictionary,
                    influences: node.morphTargetInfluences
                });
                
                // Optimize materials for anime look
                if (node.material) {
                    node.material.roughness = 0.4;
                    node.material.metalness = 0.1;
                    if (node.material.map) {
                        node.material.map.encoding = THREE.sRGBEncoding;
                    }
                }
            }
            
            // Store bones by name for animation
            if (node.isBone) {
                bones[node.name] = node;
            }
        });
        
        scene.add(avatar);
        document.getElementById('loading').style.display = 'none';
        
        console.log('Available morphs:', morphMeshes[0]?.dictionary);
        console.log('Available bones:', Object.keys(bones));
        
    }, undefined, (error) => {
        console.error('Failed to load RPM avatar:', error);
        document.getElementById('loading').textContent = 'Error Loading Avatar';
    });
}

loadAvatar();

// ============================================================
// BLENDSHAPE CONTROL
// ============================================================
function setBlendShape(name, value) {
    // Clamp value 0-1
    value = Math.max(0, Math.min(1, value));
    
    morphMeshes.forEach(({ mesh, dictionary, influences }) => {
        const index = dictionary[name];
        if (index !== undefined) {
            // Smooth interpolation
            influences[index] = THREE.MathUtils.lerp(influences[index] || 0, value, CONFIG.smoothing);
        }
    });
}

function resetBlendShapes() {
    morphMeshes.forEach(({ influences }) => {
        for (let i = 0; i < influences.length; i++) {
            influences[i] = THREE.MathUtils.lerp(influences[i], 0, 0.1);
        }
    });
}

// ============================================================
// MEDIAPIPE LANDMARK MAPPING
// ============================================================
const FACE = {
    // Key points
    noseTip: 1,
    noseBridge: 6,
    forehead: 10,
    chin: 152,
    leftEyeOuter: 33,
    leftEyeInner: 133,
    leftEyeTop: 159,
    leftEyeBottom: 145,
    rightEyeOuter: 362,
    rightEyeInner: 263,
    rightEyeTop: 386,
    rightEyeBottom: 374,
    leftBrowInner: 105,
    leftBrowOuter: 52,
    rightBrowInner: 334,
    rightBrowOuter: 282,
    mouthLeft: 61,
    mouthRight: 291,
    mouthTop: 0,
    mouthBottom: 17,
    upperLipTop: 13,
    lowerLipBottom: 14,
    jawLeft: 234,
    jawRight: 454
};

function getDistance(a, b) {
    return Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2));
}

function getEyeOpenness(landmarks, side) {
    const top = landmarks[side === 'left' ? FACE.leftEyeTop : FACE.rightEyeTop];
    const bottom = landmarks[side === 'left' ? FACE.leftEyeBottom : FACE.rightEyeBottom];
    const outer = landmarks[side === 'left' ? FACE.leftEyeOuter : FACE.rightEyeOuter];
    const inner = landmarks[side === 'left' ? FACE.leftEyeInner : FACE.rightEyeInner];
    
    const eyeHeight = getDistance(top, bottom);
    const eyeWidth = getDistance(outer, inner);
    
    // Normalize: open eye is roughly 0.3-0.4 of width
    const ratio = eyeHeight / eyeWidth;
    const openness = (ratio - 0.1) / 0.3; // Normalize to 0-1
    
    return Math.max(0, Math.min(1, openness));
}

function getBrowRaise(landmarks, side) {
    const brow = landmarks[side === 'left' ? FACE.leftBrowInner : FACE.rightBrowInner];
    const eye = landmarks[side === 'left' ? FACE.leftEyeTop : FACE.rightEyeTop];
    
    // Vertical distance (Y increases downward in screen space)
    const distance = eye.y - brow.y;
    
    // Calibrated neutral position
    const neutral = side === 'left' ? calibration.browNeutral : calibration.browNeutral;
    
    return (distance - neutral) * 8; // Scale factor
}

function getMouthMetrics(landmarks) {
    const top = landmarks[FACE.mouthTop];
    const bottom = landmarks[FACE.mouthBottom];
    const left = landmarks[FACE.mouthLeft];
    const right = landmarks[FACE.mouthRight];
    
    const height = getDistance(top, bottom);
    const width = getDistance(left, right);
    
    // Mouth open amount
    const openRatio = height / width;
    const openness = (openRatio - 0.1) / 0.4;
    
    // Smile/frown detection using lip corners vs center
    const centerY = (top.y + bottom.y) / 2;
    const cornerY = (left.y + right.y) / 2;
    const smileFactor = (centerY - cornerY) * 10; // Positive = smile
    
    return {
        open: Math.max(0, Math.min(1, openness)),
        smile: Math.max(-1, Math.min(1, smileFactor))
    };
}

function getHeadRotation(landmarks) {
    const nose = landmarks[FACE.noseTip];
    const leftEye = landmarks[FACE.leftEyeOuter];
    const rightEye = landmarks[FACE.rightEyeOuter];
    const chin = landmarks[FACE.chin];
    const forehead = landmarks[FACE.forehead];
    
    // Calculate rotation from face geometry
    const eyeLine = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
    const roll = -eyeLine;
    
    // Yaw from nose position relative to face center
    const faceCenterX = (leftEye.x + rightEye.x) / 2;
    const yaw = (nose.x - faceCenterX) * 2.5;
    
    // Pitch from nose Z depth (landmarks have Z in camera space)
    // Also use chin-forehead relationship
    const faceHeight = getDistance(forehead, chin);
    const noseHeightRatio = (nose.y - forehead.y) / faceHeight;
    const pitch = (noseHeightRatio - 0.5) * 1.5 - nose.z * 2;
    
    return { x: pitch, y: yaw, z: roll };
}

function getJawMovement(landmarks) {
    const jawLeft = landmarks[FACE.jawLeft];
    const jawRight = landmarks[FACE.jawRight];
    const chin = landmarks[FACE.chin];
    
    // Jaw shift left/right
    const jawCenterX = (jawLeft.x + jawRight.x) / 2;
    const chinOffsetX = chin.x - jawCenterX;
    
    // Jaw forward/back (using Z if available, else proxy from width)
    const jawWidth = getDistance(jawLeft, jawRight);
    
    return {
        leftRight: chinOffsetX * 4,
        forward: 0 // Would need depth estimation
    };
}

// ============================================================
// MAIN TRACKING LOOP
// ============================================================
function onResults(results) {
    if (!results.multiFaceLandmarks || !results.multiFaceLandmarks.length || !avatar) return;
    
    const lm = results.multiFaceLandmarks[0];
    
    // Reset all first (decay)
    resetBlendShapes();
    
    // Eye tracking
    const leftEyeOpen = getEyeOpenness(lm, 'left');
    const rightEyeOpen = getEyeOpenness(lm, 'right');
    
    // Blink detection with symmetry
    const avgEyeOpen = (leftEyeOpen + rightEyeOpen) / 2;
    const isBlinking = avgEyeOpen < 0.2;
    
    if (isBlinking) {
        setBlendShape(CONFIG.blendShapes.eyeBlinkLeft, 1 - avgEyeOpen);
        setBlendShape(CONFIG.blendShapes.eyeBlinkRight, 1 - avgEyeOpen);
    } else {
        // Individual eye control
        if (leftEyeOpen < 0.3) setBlendShape(CONFIG.blendShapes.eyeBlinkLeft, 1 - leftEyeOpen * 3);
        if (rightEyeOpen < 0.3) setBlendShape(CONFIG.blendShapes.eyeBlinkRight, 1 - rightEyeOpen * 3);
        
        // Wide eyes
        if (leftEyeOpen > 0.8) setBlendShape(CONFIG.blendShapes.eyeWideLeft, (leftEyeOpen - 0.8) * 2);
        if (rightEyeOpen > 0.8) setBlendShape(CONFIG.blendShapes.eyeWideRight, (rightEyeOpen - 0.8) * 2);
    }
    
    // Eyebrow tracking
    const leftBrow = getBrowRaise(lm, 'left');
    const rightBrow = getBrowRaise(lm, 'right');
    
    if (leftBrow > 0.1) setBlendShape(CONFIG.blendShapes.browOuterUpLeft, Math.min(leftBrow, 1));
    if (rightBrow > 0.1) setBlendShape(CONFIG.blendShapes.browOuterUpRight, Math.min(rightBrow, 1));
    
    // Inner brow raise (surprise/worry)
    const innerBrowRaise = Math.min(leftBrow, rightBrow);
    if (innerBrowRaise > 0.2) {
        setBlendShape(CONFIG.blendShapes.browInnerUp, Math.min(innerBrowRaise, 1));
    }
    
    // Mouth tracking
    const mouth = getMouthMetrics(lm);
    
    // Jaw open for mouth opening
    setBlendShape(CONFIG.blendShapes.jawOpen, mouth.open);
    setBlendShape(CONFIG.blendShapes.mouthOpen, mouth.open);
    
    // Smile / Frown
    if (mouth.smile > 0.2) {
        setBlendShape(CONFIG.blendShapes.mouthSmileLeft, Math.min(mouth.smile, 1));
        setBlendShape(CONFIG.blendShapes.mouthSmileRight, Math.min(mouth.smile, 1));
    } else if (mouth.smile < -0.2) {
        setBlendShape(CONFIG.blendShapes.mouthFrownLeft, Math.min(-mouth.smile, 1));
        setBlendShape(CONFIG.blendShapes.mouthFrownRight, Math.min(-mouth.smile, 1));
    }
    
    // Head rotation
    const rot = getHeadRotation(lm);
    targetHeadRot.set(rot.x, rot.y, rot.z);
    
    // Jaw movement
    const jaw = getJawMovement(lm);
    if (Math.abs(jaw.leftRight) > 0.1) {
        if (jaw.leftRight > 0) {
            setBlendShape(CONFIG.blendShapes.jawRight, Math.min(jaw.leftRight, 1));
        } else {
            setBlendShape(CONFIG.blendShapes.jawLeft, Math.min(-jaw.leftRight, 1));
        }
    }
    
    // Update debug
    updateDebug({
        leftEye: leftEyeOpen.toFixed(2),
        rightEye: rightEyeOpen.toFixed(2),
        mouth: mouth.open.toFixed(2),
        smile: mouth.smile.toFixed(2),
        head: `${rot.x.toFixed(2)}, ${rot.y.toFixed(2)}`
    });
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    
    if (avatar) {
        // Smooth head rotation
        currentHeadRot.x = THREE.MathUtils.lerp(currentHeadRot.x, targetHeadRot.x, CONFIG.smoothing);
        currentHeadRot.y = THREE.MathUtils.lerp(currentHeadRot.y, targetHeadRot.y, CONFIG.smoothing);
        currentHeadRot.z = THREE.MathUtils.lerp(currentHeadRot.z, targetHeadRot.z, CONFIG.smoothing);
        
        // Apply to head bone if exists, else whole avatar
        if (bones.Head) {
            bones.Head.rotation.x = currentHeadRot.x;
            bones.Head.rotation.y = currentHeadRot.y;
            bones.Head.rotation.z = currentHeadRot.z;
        } else if (bones.head) {
            bones.head.rotation.x = currentHeadRot.x;
            bones.head.rotation.y = currentHeadRot.y;
            bones.head.rotation.z = currentHeadRot.z;
        } else {
            avatar.rotation.x = currentHeadRot.x * 0.5;
            avatar.rotation.y = currentHeadRot.y * 0.5;
        }
        
        // Subtle idle breathing
        const time = Date.now() * 0.001;
        if (bones.Spine) {
            bones.Spine.rotation.x = Math.sin(time * 0.5) * 0.02;
        }
        if (bones.Chest) {
            bones.Chest.rotation.x = Math.sin(time * 0.5 + 0.5) * 0.03;
        }
    }
    
    renderer.render(scene, camera);
}
animate();

// ============================================================
// MEDIAPIPE SETUP
// ============================================================
const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults(onResults);

const cameraFeed = new Camera(document.getElementById('input_video'), {
    onFrame: async () => { await faceMesh.send({ image: document.getElementById('input_video') }); },
    width: 1280,
    height: 720
});
cameraFeed.start();

// ============================================================
// UI CONTROLS
// ============================================================
let debugMode = false;
function toggleExpressionDebug() {
    debugMode = !debugMode;
    if (debugMode) {
        // Visualize blendshape weights
        morphMeshes.forEach(({ mesh }) => {
            mesh.material.wireframe = true;
        });
    } else {
        morphMeshes.forEach(({ mesh }) => {
            mesh.material.wireframe = false;
        });
    }
}

function calibrate() {
    // Set current expression as neutral
    alert('Look neutral and click OK to calibrate');
    // In real implementation, capture current landmark state as baseline
}

function resetView() {
    camera.position.set(0, 0.1, 2.8);
    targetHeadRot.set(0, 0, 0);
}

function updateDebug(data) {
    if (!debugMode) return;
    document.getElementById('debug').innerHTML = Object.entries(data)
        .map(([k, v]) => `${k}: ${v}`).join('<br>');
}

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
