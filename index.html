<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyric Video Animator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }

        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        #btn-record { background-color: #e74c3c; color: white; }
        #btn-record:hover { background-color: #c0392b; }
        #btn-record:disabled { background-color: #555; cursor: not-allowed; }

        #btn-stop { background-color: #555; color: white; }
        #btn-stop.active { background-color: #f39c12; color: black; }

        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        /* The Canvas acts as our "Screen" */
        canvas {
            background-color: #000;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Lyric Video Generator</h1>

    <div class="controls">
        <label>1. Enter your lyrics:</label>
        <textarea id="lyricInput" placeholder="Type your sentence here...">This is a test sentence for the animation</textarea>
        
        <div class="btn-group">
            <button id="btn-record">2. Start Recording</button>
            <button id="btn-stop" disabled>3. Stop & Download</button>
        </div>
        
        <div class="status" id="statusText">Ready. Click 'Start Recording', then tap SPACEBAR to advance words.</div>
    </div>

    <canvas id="videoCanvas" width="1280" height="720"></canvas>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const lyricInput = document.getElementById('lyricInput');
        const btnRecord = document.getElementById('btn-record');
        const btnStop = document.getElementById('btn-stop');
        const statusText = document.getElementById('statusText');

        let words = [];
        let currentWordIndex = -1; // -1 means nothing highlighted yet
        let animationId;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // Visual Settings
        const fontSize = 60;
        const lineHeight = 80;
        const fontFace = "Arial, sans-serif";
        const normalColor = "#555555"; // Dimmed text
        const activeColor = "#ffffff"; // Highlighted text
        const glowColor = "#00e5ff";   // Cyan glow for active word

        // -- 1. Drawing Logic --
        function draw() {
            // Clear background
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `bold ${fontSize}px ${fontFace}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Word Wrapping Logic
            const maxWidth = canvas.width - 100; // Padding
            let lines = [];
            let currentLine = [];
            let currentLineWidth = 0;

            // Map words to objects containing text and highlighting status
            const mappedWords = words.map((word, index) => ({
                text: word,
                isActive: index === currentWordIndex,
                isPast: index < currentWordIndex
            }));

            // Build lines
            mappedWords.forEach(wordObj => {
                const wordWidth = ctx.measureText(wordObj.text + " ").width;
                if (currentLineWidth + wordWidth < maxWidth) {
                    currentLine.push(wordObj);
                    currentLineWidth += wordWidth;
                } else {
                    lines.push(currentLine);
                    currentLine = [wordObj];
                    currentLineWidth = wordWidth;
                }
            });
            lines.push(currentLine);

            // Calculate vertical centering
            const totalHeight = lines.length * lineHeight;
            let startY = (canvas.height - totalHeight) / 2 + (lineHeight / 2);

            // Render text
            lines.forEach((line) => {
                let lineWidth = line.reduce((acc, w) => acc + ctx.measureText(w.text + " ").width, 0);
                let startX = (canvas.width - lineWidth) / 2;

                line.forEach((w) => {
                    const wWidth = ctx.measureText(w.text + " ").width;
                    
                    // Styling
                    ctx.shadowBlur = 0;
                    if (w.isActive) {
                        ctx.fillStyle = activeColor;
                        ctx.shadowColor = glowColor;
                        ctx.shadowBlur = 20;
                    } else if (w.isPast) {
                        ctx.fillStyle = activeColor; // Keep past words lit? Or dim them? Let's keep them lit.
                    } else {
                        ctx.fillStyle = normalColor;
                    }

                    ctx.fillText(w.text, startX + (wWidth/2), startY);
                    startX += wWidth; // Move X cursor
                });
                startY += lineHeight; // Move Y cursor
            });

            if(isRecording) {
                requestAnimationFrame(draw);
            }
        }

        // -- 2. Recording Logic --
        function startRecording() {
            // Prep data
            const text = lyricInput.value.trim();
            if(!text) return alert("Please enter some text!");
            words = text.split(/\s+/);
            currentWordIndex = -1;
            
            // UI Updates
            isRecording = true;
            btnRecord.disabled = true;
            btnStop.disabled = false;
            btnStop.classList.add('active');
            statusText.innerText = "🔴 RECORDING! Tap SPACEBAR to highlight words in rhythm.";
            lyricInput.disabled = true;

            // Start Canvas Stream
            const stream = canvas.captureStream(30); // 30 FPS
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = exportVideo;
            mediaRecorder.start();

            // Start Loop
            draw();
        }

        function stopRecording() {
            isRecording = false;
            mediaRecorder.stop();
            
            // UI Reset
            btnRecord.disabled = false;
            btnStop.disabled = true;
            btnStop.classList.remove('active');
            lyricInput.disabled = false;
            statusText.innerText = "Processing download...";
        }

        // -- 3. Export Logic --
        function exportVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            // Note: Browsers save as .webm by default. 
            // Most video editors read this, but you can name it .mp4 to try to trick players 
            // (though proper conversion is better).
            a.download = 'lyric-video.webm'; 
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            statusText.innerText = "Download started! (Format: WebM - compatible with most editors)";
        }

        // -- 4. Event Listeners --
        btnRecord.addEventListener('click', startRecording);
        btnStop.addEventListener('click', stopRecording);

        // Spacebar Handler
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isRecording) {
                e.preventDefault(); // Stop page scroll
                currentWordIndex++;
                // Check if we reached the end
                if(currentWordIndex >= words.length) {
                   // Optional: Auto stop? Let's keep recording until user stops manually
                   // so they can leave a tail on the video.
                }
            }
        });

        // Initial Draw
        words = lyricInput.value.split(" ");
        draw(); // Draw static frame first
    </script>
</body>
</html>
