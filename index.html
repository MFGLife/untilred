<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Movie Maker</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    color: #eee;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  canvas {
    display: block;
    background: black;
    touch-action: none;
  }

  #aui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(20,20,20,0.95);
    padding: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  #toggleUI {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 10;
  }

  button {
    padding: 6px 10px;
    font-size: 13px;
  }

  .thumbs {
    display: flex;
    gap: 4px;
  }

  .thumbs img {
    width: 48px;
    height: 27px;
    object-fit: cover;
    border: 1px solid #444;
    cursor: pointer;
  }

  .thumbs img.active {
    border-color: cyan;
  }
</style>
</head>
<body>

<button id="toggleUI">☰ Tools</button>

<div id="aui">
  <button id="addBg">Add Background</button>
  <button id="addObj">Add Object</button>
  <button id="record">● Record</button>
  <button id="export">⬇ MP4</button>
  <div class="thumbs" id="bgList"></div>
</div>

<canvas id="canvas" width="1280" height="720"></canvas>

<input type="file" id="bgInput" accept="image/png" hidden multiple>
<input type="file" id="objInput" accept="image/png" hidden>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const aui = document.getElementById("aui");
toggleUI.onclick = () => {
  aui.style.display = aui.style.display === "none" ? "flex" : "none";
};

/* ---------- State ---------- */
let backgrounds = [];
let activeBg = 0;

let objImage = null;
let selected = false;

let state = {
  x: 640,
  y: 360,
  scale: 1,
  rotation: 0
};

let keyframes = [];
let recording = false;
let startTime;

/* ---------- Uploads ---------- */
addBg.onclick = () => bgInput.click();
addObj.onclick = () => objInput.click();

bgInput.onchange = e => {
  [...e.target.files].forEach(file => {
    const img = new Image();
    img.onload = () => {
      backgrounds.push(img);
      renderBgList();
    };
    img.src = URL.createObjectURL(file);
  });
};

objInput.onchange = e => {
  const img = new Image();
  img.onload = () => objImage = img;
  img.src = URL.createObjectURL(e.target.files[0]);
};

function renderBgList() {
  bgList.innerHTML = "";
  backgrounds.forEach((img, i) => {
    const t = document.createElement("img");
    t.src = img.src;
    if (i === activeBg) t.classList.add("active");
    t.onclick = () => activeBg = i;
    bgList.appendChild(t);
  });
}

/* ---------- Selection Logic ---------- */
canvas.addEventListener("pointerdown", e => {
  if (!objImage) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const dx = x - state.x;
  const dy = y - state.y;

  const hit =
    Math.abs(dx) < (objImage.width * state.scale) / 2 &&
    Math.abs(dy) < (objImage.height * state.scale) / 2;

  selected = hit;
});

/* ---------- Pointer Movement ---------- */
let pointers = new Map();

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);
});

canvas.addEventListener("pointermove", e => {
  if (!selected) return;
  pointers.set(e.pointerId, e);

  if (pointers.size === 1) {
    state.x += e.movementX;
    state.y += e.movementY;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dx = b.clientX - a.clientX;
    const dy = b.clientY - a.clientY;
    state.scale = Math.max(0.2, Math.hypot(dx, dy) / 200);
    state.rotation = Math.atan2(dy, dx);
  }
});

canvas.addEventListener("pointerup", e => {
  pointers.delete(e.pointerId);
});

/* ---------- Render ---------- */
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if (backgrounds[activeBg])
    ctx.drawImage(backgrounds[activeBg],0,0,canvas.width,canvas.height);

  if (objImage) {
    ctx.save();
    ctx.translate(state.x, state.y);
    ctx.rotate(state.rotation);
    ctx.scale(state.scale, state.scale);
    ctx.drawImage(objImage, -objImage.width/2, -objImage.height/2);

    if (selected) {
      ctx.strokeStyle = "rgba(0,255,255,0.8)";
      ctx.setLineDash([6,4]);
      ctx.strokeRect(
        -objImage.width/2,
        -objImage.height/2,
        objImage.width,
        objImage.height
      );
    }

    ctx.restore();
  }

  if (recording && selected) {
    keyframes.push({
      time: (performance.now() - startTime) / 1000,
      ...state
    });
  }

  requestAnimationFrame(draw);
}
draw();

/* ---------- Recording + Export (unchanged core) ---------- */
// (same MediaRecorder + ffmpeg logic as previous version)
</script>
</body>
</html>
