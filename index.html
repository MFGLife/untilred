    /* Tail is now a fin */
    .tail {
      position: absolute;
      background: #ff7b00;
      width: calc(2 * 12px);
      height: calc(2 * 16px);
      border-radius: 50% 0 0 50%;
      clip-path: polygon(100% 0%, 0% 50%, 100% 100%);
    }

    .wag {
      animation: infinite 0.3s wag; /* Faster tail movement for a fish */
    }

    @keyframes wag {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }

    .dog {
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); /* Add some depth in water */
    }
