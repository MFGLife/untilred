<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salmon - Expanded Landscape</title>
    <style>
        :root {
            --ui-bg: rgba(0, 0, 0, 0.8);
            --accent: #ffffff;
        }

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }

        #foreground-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .active-img {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            touch-action: none;
            outline: 2px dashed white;
        }
    </style>
</head>
<body>

<div id="foreground-layer"></div>

<script type="module">

import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Scene {
  constructor(sketch, settings) {
    this.sketch = sketch;
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x222299);
    this.scene.fog = new THREE.FogExp2(0x222277, 0.1); // Reduced fog density for larger landscape
    return this.scene;
  }
}

class Renderer {
  constructor(sketch, settings) {
    this.sketch = sketch;
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.sketch.sizes.width, this.sketch.sizes.height);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.physicallyCorrectLights = true;
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    this.renderer.toneMapping = THREE.ReinhardToneMapping;
    this.renderer.update = this.update.bind(this.sketch);
    return this.renderer;
  }
  update() {
    this.renderer.render(this.scene, this.camera);
  }
}

class Camera {
  constructor(sketch, settings) {
    this.sketch = sketch;
    this.camera = new THREE.PerspectiveCamera(75, this.sketch.sizes.width / this.sketch.sizes.height, 0.1, 1000);
    this.camera.position.set(0, 5, 10); // Moved camera back and up to see larger landscape
    this.sketch.scene.add(this.camera);
    return this.camera;
  }
}

class Animator {
  constructor(sketch) {
    this.sketch = sketch;
    this.tasks = [];
  }
  add(fn) { this.tasks.push(fn); }
  animate() {
    requestAnimationFrame(this.animate.bind(this));
    this.tasks.forEach((task) => task());
    this.sketch.renderer.update();
  }
}

class Controls {
  constructor(sketch) {
    this.controls = new OrbitControls(sketch.camera, sketch.renderer.domElement);
    return this.controls;
  }
}

class Events {
  constructor(sketch) {
    this.sketch = sketch;
    window.addEventListener("resize", () => {
        this.sketch.sizes = { width: window.innerWidth, height: window.innerHeight };
        this.sketch.camera.aspect = this.sketch.sizes.width / this.sketch.sizes.height;
        this.sketch.camera.updateProjectionMatrix();
        this.sketch.renderer.setSize(this.sketch.sizes.width, this.sketch.sizes.height);
    });
  }
}

class Lights {
  constructor(sketch) {
    this.sketch = sketch;
    let ambLight = new THREE.AmbientLight(0xffffff, 0.8);
    this.sketch.scene.add(ambLight);
    let dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(-10, 20, 10);
    this.sketch.scene.add(dirLight);
  }
}

let flow;
class Sketch {
  constructor() {
    this.sizes = { width: window.innerWidth, height: window.innerHeight };
    this.scene = new Scene(this);
    this.renderer = new Renderer(this);
    this.camera = new Camera(this);
    this.lights = new Lights(this);
    this.controls = new Controls(this);
    this.events = new Events(this);
    this.animator = new Animator(this);
  }

  init() {
    this.addObjects();
    document.body.appendChild(this.renderer.domElement);
    this.animator.animate();
  }

  addObjects() {
    const that = this;
    const loader = new GLTFLoader();

    // 1. LOAD FISH
    loader.load("https://assets.codepen.io/5946/fish.glb", (gltf) => {
      const fish = gltf.scene.children[0];
      fish.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.3, metalness: 0.2 });
        }
      });

      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);
      fish.position.set(0, 0, 0);
      fish.rotation.set(0, 0, 0);
      fish.scale.set(1, 1, 1);

      const initialPoints = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 100) {
        const dist = 3 + Math.sin(i * 10) / 10; // Slightly larger path for the fish
        initialPoints.push(new THREE.Vector3(Math.sin(i) * dist, 1, Math.cos(i) * dist));
      }

      const curve = new THREE.CatmullRomCurve3(initialPoints);
      flow = new Flow(fish);
      flow.updateCurve(0, curve);
      that.scene.add(flow.object3D);

      that.animator.add(() => { flow.moveAlongCurve(0.001); });
    });

    // 2. LOAD & MULTIPLY LANDSCAPE
    loader.load("https://assets.codepen.io/5946/landscape.glb", (gltf) => {
      const baseLandscape = gltf.scene;
      
      // We create a loop to add multiple patches of grass/flowers
      const amount = 12; 
      const spread = 40; // How far apart they are scattered

      for(let i = 0; i < amount; i++) {
        const clone = baseLandscape.clone();
        
        // 5x Bigger (Original was 10, so 10 * 5 = 50)
        clone.scale.set(50, 50, 50); 
        
        // Randomly scatter them around the center
        clone.position.x = (Math.random() - 0.5) * spread;
        clone.position.z = (Math.random() - 0.5) * spread;
        clone.position.y = -2; // Keep them on the floor level
        
        // Random rotation so they don't look like a grid
        clone.rotation.y = Math.random() * Math.PI * 2;
        
        that.scene.add(clone);
      }
    });
  }
}

let sketch = new Sketch();
sketch.init();

</script>
</body>
</html>
