<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salmon - Dense Bioluminescent Field</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* === AUDIO UI (ADDED) === */
        #audioPanel {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 10px 12px;
            border-radius: 8px;
            backdrop-filter: blur(6px);
            font-family: system-ui, sans-serif;
        }
        #audioPanel button {
            background: #00ffd0;
            border: none;
            color: #000;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        #audioPanel input {
            display: none;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<!-- === AUDIO UI (ADDED) === -->
<div id="audioPanel">
    <button id="toggleAudio">Upload Song</button>
    <input type="file" id="audioFile" accept="audio/*">
</div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.sizes = { width: window.innerWidth, height: window.innerHeight };
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0a0a1a);
    this.scene.fog = new THREE.FogExp2(0x0a0a1a, 0.12);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.sizes.width, this.sizes.height);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(75, this.sizes.width / this.sizes.height, 0.1, 500);
    this.camera.position.set(0, 2, 4);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.clock = new THREE.Clock();
    this.tasks = [];

    /* === AUDIO STATE (ADDED) === */
    this.audioCtx = null;
    this.analyser = null;
    this.audioData = null;
    this.audioEnergy = 0;

    this.init();
    this.initAudioUI();
    this.animate();
  }

  /* === AUDIO UI + ANALYZER (ADDED) === */
  initAudioUI() {
    const toggle = document.getElementById("toggleAudio");
    const input = document.getElementById("audioFile");

    toggle.onclick = () => {
      input.style.display = input.style.display === "block" ? "none" : "block";
    };

    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;

      if (!this.audioCtx) {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.analyser = this.audioCtx.createAnalyser();
        this.analyser.fftSize = 512;
        this.audioData = new Uint8Array(this.analyser.frequencyBinCount);
      }

      const audio = new Audio(URL.createObjectURL(file));
      audio.crossOrigin = "anonymous";
      audio.loop = true;
      audio.play();

      const src = this.audioCtx.createMediaElementSource(audio);
      src.connect(this.analyser);
      this.analyser.connect(this.audioCtx.destination);
    };
  }

  init() {
    this.scene.add(new THREE.AmbientLight(0x4040ff, 0.6));
    const pLight = new THREE.PointLight(0x00ffff, 15, 30);
    pLight.position.set(0, 1, 0);
    this.scene.add(pLight);

    this.createReflectiveGround();
    this.createOrganicStrands();
    this.loadFish();
  }

  createReflectiveGround() {
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshStandardMaterial({
        color: 0x111122,
        roughness: 0.1,
        metalness: 0.8
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.0;
    this.scene.add(floor);
  }

  createOrganicStrands() {
    const strandCount = 20000;
    const particlesPerStrand = 60;
    const totalParticles = strandCount * particlesPerStrand;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(totalParticles * 3);
    const randoms = new Float32Array(totalParticles * 4);

    for (let i = 0; i < strandCount; i++) {
      const rootX = (Math.random() - 0.5) * 50;
      const rootZ = (Math.random() - 0.5) * 50;
      const xDir = (Math.random() - 0.5) * 2.0;
      const zDir = (Math.random() - 0.5) * 2.0;
      const speed = 0.5 + Math.random() * 2.0;
      const lengthMult = 0.5 + Math.random() * 1.5;

      for (let j = 0; j < particlesPerStrand; j++) {
        const idx = (i * particlesPerStrand + j);
        positions[idx * 3] = rootX;
        positions[idx * 3 + 1] = j * 0.01;
        positions[idx * 3 + 2] = rootZ;
        randoms.set([xDir, zDir, speed, lengthMult], idx * 4);
      }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 4));

    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x00ffcc) },
        uAudio: { value: 0 }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uAudio;
        attribute vec4 aRandom;
        varying float vHeight;

        void main() {
          vec3 pos = position;
          pos.y *= aRandom.w * (1.0 + uAudio * 2.5);
          vHeight = pos.y;

          float time = uTime * aRandom.z;
          float wave = sin(time - (pos.y * 5.0)) * (pos.y * 0.2 + uAudio);
          pos.x += wave * aRandom.x;
          pos.z += wave * aRandom.y;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = (30.0 + aRandom.w * 18.0 + uAudio * 40.0) * (1.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uAudio;
        varying float vHeight;

        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if(d > 0.5) discard;

          vec3 audioColor = vec3(
            0.2 + uAudio * 1.2,
            0.6 + vHeight * 0.4,
            1.0 - uAudio * 0.5
          );

          gl_FragColor = vec4(uColor * audioColor, 1.0);
        }
      `,
      transparent: true,
      depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    points.position.y = -1.0;
    this.scene.add(points);

    this.tasks.push(() => {
      material.uniforms.uTime.value = this.clock.getElapsedTime();

      if (this.analyser) {
        this.analyser.getByteFrequencyData(this.audioData);
        let sum = 0;
        for (let i = 0; i < this.audioData.length; i++) sum += this.audioData[i];
        this.audioEnergy = (sum / this.audioData.length) / 255;
        material.uniforms.uAudio.value = this.audioEnergy;
      }
    });
  }

  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", (gltf) => {
      const fish = gltf.scene.children[0];
      fish.traverse(c => {
        if(c.isMesh) c.material = new THREE.MeshStandardMaterial({color: 0x000000, roughness: 0});
      });

      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);

      const pts = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 100) {
        const d = 1 + Math.sin(i * 10) / 30;
        pts.push(new THREE.Vector3(Math.sin(i) * d, -0.2, Math.cos(i) * d));
      }

      const curve = new THREE.CatmullRomCurve3(pts);
      const flow = new Flow(fish);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);
      this.tasks.push(() => flow.moveAlongCurve(0.001));
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.tasks.forEach(t => t());
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
