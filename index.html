<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Authoring Yard — Timeline First</title>

<style>
html,body{
  margin:0;
  background:#0b0b0b;
  color:#eee;
  font-family:system-ui,sans-serif;
  overflow:hidden;
}
canvas{display:block;background:black;touch-action:none}

/* UI */
#aui{
  position:fixed;top:0;left:0;right:0;
  background:rgba(20,20,20,.95);
  padding:8px;display:flex;gap:8px;z-index:10
}
button{font-size:13px;padding:6px 10px}

/* Timeline */
#timeline{
  position:fixed;bottom:0;left:0;right:0;
  height:80px;background:#141414;border-top:1px solid #333
}
#tracks{position:absolute;top:20px;left:0;right:0;height:40px}
.clip{
  position:absolute;height:18px;
  background:#2a2a2a;border:1px solid #555;
  cursor:grab
}
.clip.character{background:#264653}
.clip.active{outline:2px solid cyan}

#playhead{
  position:absolute;top:0;bottom:0;width:2px;
  background:cyan
}
</style>
</head>

<body>

<div id="aui">
  <button id="addBg">Add Background</button>
  <button id="addFish">Add Fish</button>
  <button id="playBtn">▶ Play</button>
</div>

<div id="timeline">
  <div id="tracks"></div>
  <div id="playhead"></div>
</div>

<canvas id="canvas" width="1280" height="720"></canvas>

<input type="file" id="bgInput" accept="image/png" hidden>

<script>
/* ======================================================
   Core Timeline State
====================================================== */
const timeline={
  duration:20,
  currentTime:0,
  playing:false
}

const assets={ backgrounds:[] }
const clips=[]

/* ======================================================
   Fish SVG Object
====================================================== */
class Fish{
  constructor(){
    this.x=640;this.y=360;this.scale=1;this.rotation=0
    this.dir=0;this.phase=0
    this.svgs=this.makeSVGs()
  }
  makeSVGs(){
    return Array.from({length:8},(_,i)=>`
    <svg xmlns="http://www.w3.org/2000/svg" width="120" height="80">
      <g transform="rotate(${i*45} 60 40)">
        <polygon points="15,40 0,25 0,55" fill="#38bdf8"/>
        <ellipse cx="60" cy="40" rx="40" ry="22"
          fill="#7dd3fc" stroke="#0ea5e9" stroke-width="3"/>
        <circle cx="75" cy="34" r="4"/>
      </g>
    </svg>`)
  }
  draw(ctx){
    this.phase+=0.1
    const img=new Image()
    img.src="data:image/svg+xml;utf8,"+
      encodeURIComponent(this.svgs[this.dir])
    ctx.save()
    ctx.translate(this.x,this.y)
    ctx.scale(this.scale,this.scale)
    ctx.drawImage(img,-60,-40)
    ctx.restore()
  }
}
const fish=new Fish()

/* ======================================================
   Timeline Helpers
====================================================== */
function timeToX(t){
  return (t/timeline.duration)*timelineEl.clientWidth
}
function xToTime(x){
  return (x/timelineEl.clientWidth)*timeline.duration
}

/* ======================================================
   UI / Uploads
====================================================== */
addBg.onclick=()=>bgInput.click()
bgInput.onchange=e=>{
  const img=new Image()
  img.onload=()=>{
    assets.backgrounds.push(img)
    clips.push({
      id:crypto.randomUUID(),
      type:"background",
      asset:img,
      start:timeline.currentTime,
      duration:4
    })
    renderClips()
  }
  img.src=URL.createObjectURL(e.target.files[0])
}

addFish.onclick=()=>{
  clips.push({
    id:"fish",
    type:"character",
    start:timeline.currentTime,
    duration:10,
    keyframes:[]
  })
  renderClips()
}

/* ======================================================
   Timeline Rendering
====================================================== */
const tracks=document.getElementById("tracks")

function renderClips(){
  tracks.innerHTML=""
  clips.forEach(clip=>{
    const div=document.createElement("div")
    div.className="clip "+clip.type
    div.style.left=timeToX(clip.start)+"px"
    div.style.width=timeToX(clip.duration)+"px"
    div.style.top=clip.type==="background"?0:"22px"
    tracks.appendChild(div)

    div.onpointerdown=e=>{
      const startX=e.clientX
      const startTime=clip.start
      document.onpointermove=ev=>{
        clip.start=Math.max(0,startTime+xToTime(ev.clientX-startX))
        renderClips()
      }
      document.onpointerup=()=>document.onpointermove=null
    }
  })
}

/* ======================================================
   Playback + Scrub
====================================================== */
timelineEl.onpointerdown=e=>{
  timeline.playing=false
  timeline.currentTime=xToTime(e.clientX)
}

playBtn.onclick=()=>timeline.playing=!timeline.playing

/* ======================================================
   Render Loop
====================================================== */
const canvas=document.getElementById("canvas")
const ctx=canvas.getContext("2d")
let last=performance.now()

function draw(now){
  const dt=(now-last)/1000;last=now
  if(timeline.playing){
    timeline.currentTime+=dt
    if(timeline.currentTime>timeline.duration){
      timeline.currentTime=timeline.duration
      timeline.playing=false
    }
  }

  ctx.clearRect(0,0,canvas.width,canvas.height)

  clips.forEach(clip=>{
    if(timeline.currentTime>=clip.start &&
       timeline.currentTime<=clip.start+clip.duration){
      if(clip.type==="background")
        ctx.drawImage(clip.asset,0,0,canvas.width,canvas.height)
      if(clip.type==="character")
        fish.draw(ctx)
    }
  })

  playhead.style.left=timeToX(timeline.currentTime)+"px"
  requestAnimationFrame(draw)
}
requestAnimationFrame(draw)
</script>
</body>
</html>
