<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DayLog · Calendar Logger</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4f8ef7;
            --primary-dim: #3b7ae3;
            --secondary: #7c5cbf;
            --accent: #e05d8a;
            --accent2: #36c9a7;
            --bg: #080c14;
            --surface: #0f1622;
            --surface2: #161f30;
            --surface3: #1d2840;
            --text: #eef2fc;
            --text-muted: #7a8baa;
            --text-faint: #3d4f6b;
            --success: #2ecf8e;
            --warning: #f0b429;
            --error: #e85d5d;
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.12);
            --glow-blue: rgba(79,142,247,0.18);
            --glow-purple: rgba(124,92,191,0.15);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== PARTICLE CANVAS ===== */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        /* ===== HEADER ===== */
        .header-wrap {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 3.5rem 1rem 2.5rem;
            overflow: hidden;
        }

        .header-grid-lines {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(79,142,247,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,142,247,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 80%);
            pointer-events: none;
        }

        .header-glow {
            position: absolute;
            top: -60px; left: 50%;
            transform: translateX(-50%);
            width: 600px; height: 280px;
            background: radial-gradient(ellipse, rgba(79,142,247,0.12) 0%, rgba(124,92,191,0.06) 50%, transparent 70%);
            pointer-events: none;
            animation: headerGlowPulse 6s ease-in-out infinite;
        }

        @keyframes headerGlowPulse {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }

        .logo-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.6rem;
            animation: logoReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes logoReveal {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--primary);
            background: rgba(79,142,247,0.1);
            border: 1px solid rgba(79,142,247,0.25);
            padding: 0.25rem 0.7rem;
            border-radius: 4px;
            animation: badgePulse 3s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { border-color: rgba(79,142,247,0.25); }
            50% { border-color: rgba(79,142,247,0.5); box-shadow: 0 0 12px rgba(79,142,247,0.15); }
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            animation: logoReveal 0.9s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .h1-day { color: var(--text); }
        .h1-log {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 60%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .h1-sep {
            color: var(--text-faint);
            font-weight: 400;
            margin: 0 0.2em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.01em;
            animation: logoReveal 1s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* animated underline on header */
        .header-divider {
            width: 60px; height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            margin: 1.2rem auto 0;
            border-radius: 2px;
            animation: dividerExpand 1s 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes dividerExpand {
            from { width: 0; opacity: 0; }
            to { width: 60px; opacity: 1; }
        }

        /* ===== LAYOUT ===== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 980px;
            margin: 0 auto;
            padding: 0 1rem 4rem;
        }

        /* ===== SECTION CARD ===== */
        .section-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .section-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(79,142,247,0.4), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .section-card:hover::before { opacity: 1; }

        /* ===== LABELS ===== */
        label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ===== INPUTS ===== */
        input[type="email"],
        textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.65;
        }

        .hint {
            color: var(--text-faint);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            font-family: 'Space Mono', monospace;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.75rem 1.4rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.18s ease;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover { background: var(--primary-dim); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(79,142,247,0.3); }

        .btn-secondary {
            background: var(--surface3);
            color: var(--text);
            border: 1px solid var(--border-light);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.07); }

        .btn-success {
            background: var(--success);
            color: #05160e;
            font-weight: 700;
        }
        .btn-success:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .btn-warning {
            background: var(--warning);
            color: #1a0f00;
            font-weight: 700;
        }

        .btn-danger {
            background: rgba(232,93,93,0.15);
            color: var(--error);
            border: 1px solid rgba(232,93,93,0.2);
        }
        .btn-danger:hover { background: rgba(232,93,93,0.25); }

        .btn + .btn { margin-left: 0.5rem; }

        .btn-row { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }

        /* ===== EVENTS CONTAINER ===== */
        .events-container { display: none; }
        .events-container.active {
            display: block;
            animation: fadeUp 0.35s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== EVENTS HEADER ===== */
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .events-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .badge {
            background: rgba(79,142,247,0.15);
            color: var(--primary);
            border: 1px solid rgba(79,142,247,0.25);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.05em;
        }

        .needs-time-badge {
            background: rgba(240,180,41,0.15);
            color: var(--warning);
            border: 1px solid rgba(240,180,41,0.3);
            padding: 0.18rem 0.65rem;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
        }

        /* ===== STATS ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .stat-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.9rem 1rem;
            text-align: center;
            transition: border-color 0.25s;
        }
        .stat-card:hover { border-color: var(--border-light); }

        .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.1;
        }

        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-top: 0.25rem;
        }

        /* ===== MISSING PROMPT ===== */
        .missing-banner {
            background: rgba(240,180,41,0.07);
            border: 1px solid rgba(240,180,41,0.2);
            border-left: 3px solid var(--warning);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: var(--warning);
            margin-bottom: 1rem;
            font-family: 'Space Mono', monospace;
        }

        /* ===== TIMELINE ===== */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        /* ===== EVENT CARD ===== */
        .event-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem 1.25rem;
            position: relative;
            border-left: 3px solid var(--primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .event-card:hover {
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            border-color: rgba(79,142,247,0.3);
        }

        .event-card.missing-time { border-left-color: var(--warning); }
        .event-card.type-fitness { border-left-color: var(--accent2); }
        .event-card.type-work { border-left-color: var(--primary); }
        .event-card.type-errand { border-left-color: var(--secondary); }
        .event-card.redundant { border-left-color: var(--accent); }

        /* card top row */
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.9rem;
            flex-wrap: wrap;
        }

        .event-title-input {
            flex: 1;
            min-width: 180px;
            background: var(--surface3);
            border: 1px solid var(--border-light);
            border-radius: 7px;
            color: var(--text);
            padding: 0.4rem 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s;
        }
        .event-title-input:focus { outline: none; border-color: var(--primary); }

        .card-badges { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

        /* time row */
        .time-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
            background: rgba(0,0,0,0.25);
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
        }

        .time-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        .time-input {
            background: var(--surface3);
            border: 1px solid var(--border-light);
            color: var(--text);
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
            width: 110px;
            transition: border-color 0.2s;
        }
        .time-input:focus { outline: none; border-color: var(--primary); }

        .time-arrow {
            color: var(--text-faint);
            font-size: 0.8rem;
        }

        /* meta chips row */
        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .chip input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.78rem;
            font-family: 'DM Sans', sans-serif;
            min-width: 60px;
            width: auto;
            border-bottom: 1px solid var(--text-faint);
            padding: 0;
        }
        .chip input:focus { outline: none; border-bottom-color: var(--primary); }

        .chip-dur input {
            width: 52px;
        }

        /* desc line */
        .card-desc {
            font-size: 0.8rem;
            color: var(--text-faint);
            font-style: italic;
            line-height: 1.5;
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: rgba(0,0,0,0.15);
            border-radius: 6px;
            border-left: 2px solid var(--border);
        }

        /* redundancy note */
        .redundancy-note {
            background: rgba(224,93,138,0.1);
            border: 1px solid rgba(224,93,138,0.2);
            color: var(--accent);
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            font-size: 0.78rem;
            margin-bottom: 0.75rem;
            font-family: 'Space Mono', monospace;
        }

        /* card actions */
        .card-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 0.35rem 0.8rem;
            font-size: 0.78rem;
            border-radius: 6px;
        }

        /* type pill */
        .type-pill {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .type-work { background: rgba(79,142,247,0.15); color: var(--primary); }
        .type-fitness { background: rgba(54,201,167,0.15); color: var(--accent2); }
        .type-errand { background: rgba(124,92,191,0.15); color: #a885e8; }
        .type-personal { background: rgba(255,255,255,0.07); color: var(--text-muted); }
        .type-general { background: rgba(255,255,255,0.07); color: var(--text-muted); }

        /* ===== GLOBAL ACTIONS ===== */
        .actions-global {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            margin-top: 0.5rem;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface2);
            color: var(--text);
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            border-left: 3px solid var(--success);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            transform: translateX(420px);
            transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
            z-index: 9999;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            max-width: 280px;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: var(--error); }

        /* ===== SEPARATOR ===== */
        .section-sep {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0.25rem 0 1.25rem;
            color: var(--text-faint);
            font-size: 0.7rem;
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .section-sep::before, .section-sep::after {
            content: ''; flex: 1;
            height: 1px;
            background: var(--border);
        }

        @media (max-width: 600px) {
            .btn + .btn { margin-left: 0; }
            .time-row { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 1.9rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <!-- HEADER -->
    <div class="header-wrap">
        <div class="header-grid-lines"></div>
        <div class="header-glow"></div>
        <div class="logo-line">
            <span class="logo-badge">v2.0</span>
        </div>
        <h1>
            <span class="h1-day">day</span><span class="h1-log">log</span>
            <span class="h1-sep">/</span>
            <span class="h1-day" style="color: var(--text-muted); font-size: 0.72em; font-weight:400; letter-spacing:-0.01em;">calendar</span>
        </h1>
        <p class="subtitle">speak naturally &mdash; we sort the timeline. edit, merge, delete.</p>
        <div class="header-divider"></div>
    </div>

    <!-- MAIN -->
    <div class="container">

        <!-- INPUT SECTION -->
        <div class="section-card" style="animation: fadeUp 0.5s 0.3s ease both;">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" value="hello@example.com" style="margin-bottom:1.25rem;">

            <div class="section-sep">daily summary</div>

            <label for="schedule">Your Day, In Your Words</label>
            <textarea id="schedule" placeholder="Today, I went to work at 730 drove about 70 miles got off early at 2:10 PM. And then I went to court to file paperwork at 3 PM I went to the library. I also worked out for about 45 minutes. I went on a 45 minute run And Did twenty minute super set.">Today, I went to work at 730 (assume 730am) drove about 70 miles (log the distance traveled) got off early at 2:10 PM. And then I went to court to file paperwork at 3 PM I went to the library.(ask for a time i went to library since you found an event with no time) I also worked out for about 45 minutes. I went on a 45 minute run And Did twenty minute super set, (clarify redundancy but organizing the workout.)</textarea>
            <div class="hint">// times: 730am · 2:10pm · 3 PM &nbsp;|&nbsp; distances: "drove 70 miles" &nbsp;|&nbsp; workouts merged intelligently</div>

            <div class="btn-row">
                <button class="btn btn-primary" onclick="parseSchedule()">Parse &amp; Clarify</button>
                <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
            </div>
        </div>

        <!-- EVENTS SECTION -->
        <div class="events-container section-card" id="eventsContainer">
            <div class="events-header">
                <span class="events-title">Editable Events</span>
                <span class="badge" id="eventCount">0 events</span>
            </div>

            <div class="stats" id="statsContainer"></div>
            <div id="missingPromptArea"></div>
            <div class="timeline" id="timeline"></div>

            <div class="actions-global">
                <button class="btn btn-success" onclick="sendEmail()">Send to Email</button>
                <button class="btn btn-secondary" onclick="downloadICS()">Download .ics</button>
                <button class="btn btn-secondary" onclick="copyToClipboard()">Copy Summary</button>
                <button class="btn btn-secondary" onclick="resetFromCurrentEvents()">Refresh View</button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast">Message</div>

    <!-- ===================== SCRIPT ===================== -->
    <script>
    // ========================
    //   PARTICLE SYSTEM
    // ========================
    (function() {
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [], animFrame;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function randomBetween(a, b) { return a + Math.random() * (b - a); }

        function createParticle() {
            return {
                x: randomBetween(0, W),
                y: randomBetween(0, H),
                r: randomBetween(0.6, 2.2),
                vx: randomBetween(-0.12, 0.12),
                vy: randomBetween(-0.22, -0.05),
                alpha: randomBetween(0.08, 0.45),
                color: Math.random() > 0.6 ? '79,142,247' : '124,92,191',
                twinkleSpeed: randomBetween(0.008, 0.025),
                twinkleDir: Math.random() > 0.5 ? 1 : -1
            };
        }

        function initParticles() {
            const count = Math.min(130, Math.floor(W * H / 8000));
            particles = Array.from({ length: count }, createParticle);
        }

        function drawConnections() {
            const maxDist = 120;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.06;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(79,142,247,${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, W, H);
            drawConnections();
            particles.forEach(p => {
                // twinkle
                p.alpha += p.twinkleSpeed * p.twinkleDir;
                if (p.alpha > 0.5 || p.alpha < 0.04) p.twinkleDir *= -1;

                // move
                p.x += p.vx;
                p.y += p.vy;

                // wrap
                if (p.x < -5) p.x = W + 5;
                if (p.x > W + 5) p.x = -5;
                if (p.y < -5) p.y = H + 5;
                if (p.y > H + 5) p.y = -5;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
                ctx.fill();
            });
            animFrame = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); initParticles(); });
        resize();
        initParticles();
        animate();
    })();


    // ========================
    //   GLOBAL STATE
    // ========================
    let parsedEvents = [];
    let totalDriving = 0;

    // ========================
    //   PARSE ENTRY POINT
    // ========================
    function parseSchedule() {
        const text = document.getElementById('schedule').value;
        if (!text.trim()) { showToast('Enter your day first'); return; }
        const extraction = extractEventsAdvanced(text);
        parsedEvents = extraction.events;
        totalDriving = extraction.totalMiles;
        displayEvents();
        showToast(`Parsed ${parsedEvents.length} event${parsedEvents.length !== 1 ? 's' : ''}`);
    }

    // ========================
    //   ADVANCED EXTRACTION
    // ========================
    function extractEventsAdvanced(text) {
        let events = [];
        let totalMiles = 0;

        // collect all mile mentions
        const mileMatches = [...text.matchAll(/(\d+)\s*miles?/gi)];
        mileMatches.forEach(m => totalMiles += parseInt(m[1]));

        // split by sentence endings
        let rawSegments = text.split(/(?<=[.!?])\s+/);

        let workoutSegments = [];

        rawSegments.forEach(seg => {
            if (!seg.trim()) return;
            if (/(workout|run|superset|super set|exercise|ran|jog|gym|minute run|min run|twenty minute|\d+\s*minute)/i.test(seg) &&
                !/(work at|work \d|went to work|got off)/i.test(seg)) {
                workoutSegments.push(seg);
            } else {
                const ev = createEventFromSegment(seg);
                if (ev) events.push(ev);
            }
        });

        if (workoutSegments.length > 0) {
            events.push(mergeWorkoutSegments(workoutSegments));
        }

        // library: ensure it's there with missingTime flag if no time found
        if (/library/i.test(text)) {
            let hasLib = events.some(e => /library/i.test(e.title) && e.startTime);
            if (!hasLib) {
                let libHasAny = events.some(e => /library/i.test(e.title));
                if (!libHasAny) {
                    events.push({
                        id: 'lib-' + Date.now(),
                        title: 'Library Visit',
                        startTime: null, endTime: null, duration: 60,
                        location: 'Public Library',
                        description: 'Visit to the library — no time specified in summary. Please set an arrival time so this can be added to your calendar.',
                        type: 'personal',
                        missingTime: true,
                        originalText: 'I went to the library.'
                    });
                }
            }
        }

        events = mergeSimilarEvents(events);

        // sort: missing time events first, then chronological
        events.sort((a, b) => {
            if (!a.startTime && !b.startTime) return 0;
            if (!a.startTime) return -1;
            if (!b.startTime) return 1;
            return a.startTime - b.startTime;
        });

        return { events, totalMiles };
    }

    // ========================
    //   CREATE EVENT FROM SEGMENT
    // ========================
    function createEventFromSegment(seg) {
        let lower = seg.toLowerCase();

        if (!hasTimeIndicator(seg) &&
            !/(drove|miles|work|court|library|meeting|file|paperwork)/i.test(seg)) return null;

        let event = {
            id: 'ev-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
            title: 'Activity',
            startTime: null, endTime: null, duration: null,
            location: null,
            description: buildRichDescription(seg, 'general'),
            type: 'general',
            missingTime: false,
            distance: null,
            originalText: seg
        };

        let distMatch = seg.match(/(\d+)\s*miles?/i);
        if (distMatch) event.distance = parseInt(distMatch[1]);

        let startTime = extractStartTime(seg);
        if (startTime) event.startTime = startTime;

        let endTime = extractEndTime(seg);
        if (endTime) event.endTime = endTime;

        let duration = extractDuration(seg);
        if (duration) event.duration = duration;

        // derive end from start + duration ONLY if end not already set
        if (event.startTime && !event.endTime && event.duration) {
            event.endTime = new Date(event.startTime.getTime() + event.duration * 60000);
        }

        // derive duration from start/end ONLY if duration not already set
        if (event.startTime && event.endTime && !event.duration) {
            let diffMs = event.endTime.getTime() - event.startTime.getTime();
            if (diffMs > 0) {
                event.duration = Math.round(diffMs / 60000);
            }
        }

        if (!event.startTime) event.missingTime = true;

        // --- CLASSIFY & TITLE ---
        if (/went to work|start.*work|arrive.*work|730|7:30/i.test(lower) &&
            !/(court|library)/i.test(lower)) {
            event.title = 'Work';
            event.type = 'work';
            event.location = 'Work';
            event.description = buildRichDescription(seg, 'work');
        } else if (/court|file.*paper|paperwork/i.test(lower)) {
            event.title = 'Court — File Paperwork';
            event.type = 'errand';
            event.location = 'Courthouse';
            event.description = buildRichDescription(seg, 'errand');
        } else if (/library/i.test(lower)) {
            event.title = 'Library Visit';
            event.type = 'personal';
            event.location = 'Public Library';
            if (!event.startTime) event.missingTime = true;
            event.description = buildRichDescription(seg, 'library');
        } else {
            let words = seg.split(' ');
            for (let i = 0; i < words.length; i++) {
                if (words[i].toLowerCase() === 'went' && words[i+1]?.toLowerCase() === 'to') {
                    let place = words[i+2]?.replace(/[^a-zA-Z]/g, '');
                    if (place) {
                        event.title = place.charAt(0).toUpperCase() + place.slice(1);
                        break;
                    }
                }
            }
        }

        return (event.startTime || event.missingTime) ? event : null;
    }

    // ========================
    //   RICH DESCRIPTION BUILDER
    // ========================
    function buildRichDescription(seg, type) {
        const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        const templates = {
            work: `Work session logged on ${today}. ${seg.trim()} — Distance traveled was noted in the daily summary. Duration calculated from start time through end time as recorded.`,
            errand: `Errand recorded on ${today}. ${seg.trim()} — This was an in-person visit requiring travel. Time and context captured from voice summary.`,
            library: `Library visit noted on ${today}. ${seg.trim()} — Exact arrival time was not specified in the summary and should be added manually. Event duration is estimated.`,
            fitness: `Fitness activity logged on ${today}. Details sourced from daily summary and combined into a single workout block.`,
            general: `${seg.trim()} — Event recorded on ${today} from natural language summary.`
        };
        return templates[type] || templates.general;
    }

    // ========================
    //   TIME EXTRACTION
    // ========================
    function extractStartTime(t) {
        // Look for phrases like "at 730", "at 3 PM", "at 2:10"
        let m = t.match(/\bat\s+(\d{3,4})\s*(am|pm)?/i);
        if (m) return parseTimeGeneric(m[1], null, m[2]);

        m = t.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
        if (m) return parseTimeGeneric(m[1], m[2], m[3]);

        // bare 4-digit time like "730am"
        m = t.match(/\b(\d{3,4})\s*(am|pm)\b/i);
        if (m) return parseTimeGeneric(m[1], null, m[2]);

        return null;
    }

    function extractEndTime(t) {
        // Look for "got off", "off at", "until", "ended at"
        let m = t.match(/(?:got\s+off|off\s+at|finish(?:ed)?|ended?|until)\s+(?:early\s+)?(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
        if (m) return parseTimeGeneric(m[1], m[2], m[3]);

        m = t.match(/(?:got\s+off|off\s+at|finish(?:ed)?|ended?|until)\s+(?:early\s+)?(?:at\s+)?(\d{3,4})\s*(am|pm)?/i);
        if (m) return parseTimeGeneric(m[1], null, m[2]);

        return null;
    }

    function extractDuration(t) {
        // Only match explicit duration phrases like "45 minutes", "2 hours", "20 min"
        let m = t.match(/(\d+)\s*(hours?|hrs?|minutes?|mins?)/i);
        if (!m) return null;
        let val = parseInt(m[1]);
        if (/hours?|hrs?/i.test(m[2])) return val * 60;
        return val;
    }

    function parseTimeGeneric(hourStr, minuteStr, mer) {
        let h, m_val;
        let s = String(hourStr).trim();

        if (s.length === 3) {
            h = parseInt(s[0]);
            m_val = parseInt(s.slice(1));
        } else if (s.length === 4) {
            h = parseInt(s.slice(0, 2));
            m_val = parseInt(s.slice(2));
        } else {
            h = parseInt(s);
            m_val = minuteStr ? parseInt(minuteStr) : 0;
        }

        if (isNaN(h)) return null;
        if (isNaN(m_val)) m_val = 0;

        if (mer) {
            let isPM = /^(pm|p\.m\.)$/i.test(mer.trim());
            if (isPM && h !== 12) h += 12;
            if (!isPM && h === 12) h = 0;
        } else {
            // No meridiem: heuristic — values <= 6 are likely PM (work gets out, court, etc.)
            if (h >= 1 && h <= 6) h += 12;
        }

        let date = new Date();
        date.setHours(h, m_val, 0, 0);
        return date;
    }

    function hasTimeIndicator(t) {
        return /\d{1,2}:\d{2}/.test(t) ||
               /\d{3,4}\s*(am|pm)/i.test(t) ||
               /\d{1,2}\s*(am|pm)/i.test(t) ||
               /\bat\s+\d/.test(t);
    }

    // ========================
    //   WORKOUT MERGE
    // ========================
    function mergeWorkoutSegments(segments) {
        let activities = [];
        let totalDuration = 0;

        segments.forEach(s => {
            let dur = extractDuration(s);
            if (dur) totalDuration += dur;
            if (/run|ran|jog/i.test(s)) activities.push('Run');
            if (/super\s*set/i.test(s)) activities.push('Superset');
            if (/workout/i.test(s) && !activities.length) activities.push('Workout');
        });

        if (!activities.length) activities.push('Workout');
        let uniqueActivities = [...new Set(activities)];
        let title = uniqueActivities.join(' + ');

        let startTime = null;
        for (let seg of segments) {
            let st = extractStartTime(seg);
            if (st) { startTime = st; break; }
        }

        let endTime = startTime && totalDuration
            ? new Date(startTime.getTime() + totalDuration * 60000)
            : null;

        const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        let desc = `Combined fitness session recorded on ${today}. `;
        desc += `Activities identified: ${uniqueActivities.join(', ')}. `;
        desc += totalDuration ? `Total estimated duration: ${totalDuration} minutes. ` : '';
        desc += `Original notes: "${segments.join('; ')}" — Individual segments were merged to avoid duplicate calendar entries.`;

        return {
            id: 'fitness-' + Date.now(),
            title: title,
            startTime: startTime,
            endTime: endTime,
            duration: totalDuration || null,
            location: 'Gym / Home',
            description: desc,
            type: 'fitness',
            missingTime: !startTime,
            redundancyNote: segments.length > 1
                ? `${segments.length} workout mentions combined — edit if these were separate sessions`
                : null,
            originalText: segments.join(' ')
        };
    }

    function mergeSimilarEvents(events) {
        let filtered = [];
        events.forEach(ev => {
            let dup = filtered.find(f =>
                f.title === ev.title &&
                f.startTime && ev.startTime &&
                Math.abs(f.startTime - ev.startTime) < 10 * 60000
            );
            if (!dup) filtered.push(ev);
        });
        return filtered;
    }

    // ========================
    //   DISPLAY
    // ========================
    function displayEvents() {
        const container = document.getElementById('eventsContainer');
        const timeline  = document.getElementById('timeline');

        let totalMins    = parsedEvents.reduce((s, e) => s + (e.duration || 0), 0);
        let fitnessCount = parsedEvents.filter(e => e.type === 'fitness').length;

        let totalHours = totalMins > 0 ? (totalMins / 60).toFixed(1) : '0';

        stats.innerHTML = `

    }

    // ========================
    //   RENDER CARD
    // ========================
    function renderEventCard(ev, index) {
        let startVal = ev.startTime ? formatTime(ev.startTime) : '';
        let endVal   = ev.endTime   ? formatTime(ev.endTime)   : '';
        let missingClass = ev.missingTime ? 'missing-time' : '';
        let typeClass    = `type-${ev.type}`;

        let redundancyHtml = ev.redundancyNote
            ? `<div class="redundancy-note">Note: ${ev.redundancyNote}</div>`
            : '';

        let distChip = ev.distance
            ? `<span class="chip">Drive: <strong style="color:var(--text); margin-left:4px">${ev.distance} mi</strong></span>`
            : '';

        let typePillClass = `type-${ev.type}`;

        return `
        <div class="event-card ${missingClass} ${typeClass}" data-id="${ev.id}" data-index="${index}">
            <div class="card-top">
                <input type="text" class="event-title-input"
                    value="${escHtml(ev.title)}"
                    data-field="title" data-id="${ev.id}"
                    placeholder="Event title">
                <div class="card-badges">
                    <span class="type-pill ${typePillClass}">${ev.type}</span>
                    ${ev.missingTime ? `<span class="needs-time-badge">No Time</span>` : ''}
                </div>
            </div>

            <div class="time-row">
                <span class="time-label">Start</span>
                <input type="text" class="time-input"
                    value="${escHtml(startVal)}"
                    placeholder="e.g. 3:00 PM"
                    data-field="startRaw" data-id="${ev.id}">
                <span class="time-arrow">&rarr;</span>
                <span class="time-label">End</span>
                <input type="text" class="time-input"
                    value="${escHtml(endVal)}"
                    placeholder="optional"
                    data-field="endRaw" data-id="${ev.id}">
            </div>

            <div class="meta-row">
                <span class="chip chip-dur">
                    Duration:&nbsp;
                    <input type="number" min="0"
                        value="${ev.duration !== null && ev.duration !== undefined ? ev.duration : ''}"
                        placeholder="min"
                        data-field="duration" data-id="${ev.id}">
                    &nbsp;min
                </span>
                <span class="chip">
                    Location:&nbsp;
                    <input type="text"
                        value="${escHtml(ev.location || '')}"
                        placeholder="location"
                        data-field="location" data-id="${ev.id}">
                </span>
                ${distChip}
            </div>

            ${redundancyHtml}

            <div class="card-desc">${escHtml(ev.description)}</div>

            <div class="card-actions">
                <button class="btn btn-sm btn-danger" onclick="deleteEvent('${ev.id}')">Delete</button>
                <button class="btn btn-sm btn-warning" onclick="askTimeForEvent('${ev.id}')">Set Time</button>
                <button class="btn btn-sm btn-primary" onclick="saveEventEdits('${ev.id}')">Save Edits</button>
            </div>
        </div>`;
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatTime(d) {
        if (!(d instanceof Date) || isNaN(d)) return '';
        return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    // ========================
    //   SAVE EDITS — FIXED
    // ========================
    window.saveEventEdits = function(id) {
        const event = parsedEvents.find(e => e.id === id);
        if (!event) return;

        // 1. Title
        let titleEl = document.querySelector(`input[data-id="${id}"][data-field="title"]`);
        if (titleEl) event.title = titleEl.value.trim() || event.title;

        // 2. Location
        let locEl = document.querySelector(`input[data-id="${id}"][data-field="location"]`);
        if (locEl) event.location = locEl.value.trim();

        // 3. Read raw time strings BEFORE re-rendering
        let startRawEl = document.querySelector(`input[data-id="${id}"][data-field="startRaw"]`);
        let endRawEl   = document.querySelector(`input[data-id="${id}"][data-field="endRaw"]`);
        let durEl      = document.querySelector(`input[data-id="${id}"][data-field="duration"]`);

        let startRaw = startRawEl ? startRawEl.value.trim() : '';
        let endRaw   = endRawEl   ? endRawEl.value.trim()   : '';
        let durRaw   = durEl      ? durEl.value.trim()      : '';

        // 4. Parse start time (only update if user entered something valid)
        let newStart = null;
        if (startRaw) {
            newStart = parseNaturalTime(startRaw);
            if (newStart) {
                event.startTime = newStart;
                event.missingTime = false;
            }
        }

        // 5. Parse end time (only update if user entered something valid)
        let newEnd = null;
        if (endRaw) {
            newEnd = parseNaturalTime(endRaw);
            if (newEnd) event.endTime = newEnd;
        }

        // 6. Parse duration if entered by user
        let userDuration = null;
        if (durRaw !== '') {
            let parsed = parseInt(durRaw);
            if (!isNaN(parsed) && parsed >= 0) {
                userDuration = parsed;
                event.duration = userDuration;
            }
        }

        // 7. RECALCULATE: resolve start/end/duration consistently
        //    Priority: explicit user inputs win. Derive what's missing.
        if (event.startTime && event.endTime) {
            // Both times set — derive duration from them (positive only)
            let diffMs = event.endTime.getTime() - event.startTime.getTime();
            if (diffMs > 0) {
                event.duration = Math.round(diffMs / 60000);
            } else {
                // End before start — user likely entered wrong value; keep duration if we have it
                if (userDuration !== null) {
                    event.endTime = new Date(event.startTime.getTime() + userDuration * 60000);
                    event.duration = userDuration;
                } else {
                    showToast('End time is before start — please check times', 3000);
                    return; // don't re-render with bad state
                }
            }
        } else if (event.startTime && event.duration && !event.endTime) {
            // Derive end from start + duration
            event.endTime = new Date(event.startTime.getTime() + event.duration * 60000);
        } else if (!event.startTime && event.duration !== null) {
            // Only duration known — that's fine, store it
        }

        showToast(`'${event.title}' saved`);
        displayEvents();
    };

    window.deleteEvent = function(id) {
        parsedEvents = parsedEvents.filter(e => e.id !== id);
        displayEvents();
        showToast('Event deleted');
    };

    window.askTimeForEvent = function(id) {
        let ev = parsedEvents.find(e => e.id === id);
        if (!ev) return;
        let newTime = prompt(`Enter time for "${ev.title}" (e.g. 4:30 PM, 1630, 4pm)`);
        if (newTime) {
            let parsed = parseNaturalTime(newTime);
            if (parsed) {
                ev.startTime = parsed;
                ev.missingTime = false;
                if (ev.duration && !ev.endTime) {
                    ev.endTime = new Date(parsed.getTime() + ev.duration * 60000);
                }
                showToast(`Time set to ${formatTime(parsed)}`);
                displayEvents();
            } else {
                showToast('Could not parse that time format', 3000);
            }
        }
    };

    function parseNaturalTime(str) {
        if (!str) return null;
        str = str.trim();

        // HH:MM AM/PM
        let m = str.match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
        if (m) return parseTimeGeneric(m[1], m[2], m[3]);

        // H AM/PM or HH AM/PM
        m = str.match(/^(\d{1,2})\s*(am|pm)$/i);
        if (m) return parseTimeGeneric(m[1], null, m[2]);

        // 4-digit 24h e.g. 1430
        m = str.match(/^([01]?\d|2[0-3])([0-5]\d)$/);
        if (m) return parseTimeGeneric(m[1], m[2], null);

        // 3-digit 24h e.g. 730
        m = str.match(/^([1-9])([0-5]\d)$/);
        if (m) return parseTimeGeneric(m[1], m[2], null);

        // Any time inside a longer string
        m = str.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
        if (m) return parseTimeGeneric(m[1], m[2], m[3]);

        return null;
    }

    window.resetFromCurrentEvents = function() {
        displayEvents();
        showToast('View refreshed');
    };

    // ========================
    //   ICS / EMAIL / COPY
    // ========================
    function generateICSFromEvents() {
        if (!parsedEvents.some(e => e.startTime)) return null;
        let ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//daylog//parser//EN', 'CALSCALE:GREGORIAN'];
        let nowStr = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
        parsedEvents.forEach((ev, i) => {
            if (!ev.startTime) return;
            let start = ev.startTime.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            let end = (ev.endTime || new Date(ev.startTime.getTime() + (ev.duration || 60) * 60000))
                         .toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            ics.push('BEGIN:VEVENT');
            ics.push(`UID:ev-${i}-${Date.now()}@daylog`);
            ics.push(`DTSTAMP:${nowStr}`);
            ics.push(`DTSTART:${start}`);
            ics.push(`DTEND:${end}`);
            ics.push(`SUMMARY:${ev.title}`);
            if (ev.location) ics.push(`LOCATION:${ev.location}`);
            if (ev.description) ics.push(`DESCRIPTION:${ev.description.replace(/\n/g, '\\n')}`);
            ics.push('END:VEVENT');
        });
        ics.push('END:VCALENDAR');
        return ics.join('\r\n');
    }

    window.downloadICS = function() {
        let ics = generateICSFromEvents();
        if (!ics) { showToast('No events with time to export'); return; }
        let blob = new Blob([ics], { type: 'text/calendar' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `daylog-${new Date().toISOString().slice(0,10)}.ics`;
        a.click();
        showToast('Calendar file downloaded');
    };

    window.sendEmail = function() {
        let email = document.getElementById('email').value.trim();
        if (!email) { showToast('Enter an email address first'); return; }
        let body = `Daily Log — ${new Date().toLocaleDateString('en-US', {weekday:'long',year:'numeric',month:'long',day:'numeric'})}\n\n`;
        parsedEvents.forEach(ev => {
            let t = ev.startTime ? formatTime(ev.startTime) : '(no time)';
            let e = ev.endTime   ? ` – ${formatTime(ev.endTime)}`  : '';
            body += `${t}${e}  |  ${ev.title}`;
            if (ev.location) body += `  |  ${ev.location}`;
            if (ev.duration) body += `  |  ${ev.duration} min`;
            body += '\n';
        });
        if (totalDriving) body += `\nTotal miles driven: ${totalDriving}`;
        let subject = encodeURIComponent(`DayLog — ${new Date().toLocaleDateString()}`);
        window.location.href = `mailto:${email}?subject=${subject}&body=${encodeURIComponent(body)}`;
        showToast('Email client opened');
    };

    window.copyToClipboard = function() {
        let txt = parsedEvents.map(ev => {
            let t = ev.startTime ? formatTime(ev.startTime) : '??:??';
            let e = ev.endTime   ? ` – ${formatTime(ev.endTime)}` : '';
            return `${t}${e}  ${ev.title}${ev.location ? '  @ ' + ev.location : ''}${ev.duration ? '  (' + ev.duration + ' min)' : ''}`;
        }).join('\n');
        navigator.clipboard.writeText(txt).then(() => showToast('Copied to clipboard'));
    };

    function clearAll() {
        document.getElementById('schedule').value = '';
        document.getElementById('eventsContainer').classList.remove('active');
        parsedEvents = []; totalDriving = 0;
        showToast('Cleared');
    }

    function showToast(msg, dur = 2500) {
        let t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), dur);
    }

    // auto-parse on paste
    document.getElementById('schedule').addEventListener('paste', function() {
        setTimeout(parseSchedule, 150);
    });

    window.parseSchedule  = parseSchedule;
    window.clearAll       = clearAll;
    </script>
</body>
</html>
