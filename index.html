<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salmon — True Audio Flash</title>

<style>
body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }

#audioPanel {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10;
  background: rgba(0,0,0,0.7);
  padding: 12px;
  border-radius: 8px;
  color: white;
}
#audioPanel button {
  background: #00ffd0;
  border: none;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  color: #000;
}
#audioPanel input {
  display: none;
  margin-top: 10px;
}
</style>
</head>

<body>

<div id="audioPanel">
  <button id="toggleAudio">Upload Song</button>
  <input type="file" id="audioFile" accept="audio/*">
  <div style="font-size: 10px; margin-top: 5px; opacity: 0.7;">Upload a track to start the reaction</div>
</div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x050505);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    document.body.appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    this.camera.position.set(0, 1.5, 3);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.tasks = [];

    this.audioCtx = null;
    this.analyser = null;
    this.freqData = null;

    this.initLights();
    this.initAudioUI();
    this.loadFish();
    this.animate();
  }

  initLights() {
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.DirectionalLight(0xffffff, 1.0);
    light.position.set(-3, 5, 2);
    this.scene.add(light);
  }

  

initAudioUI() {
  const btn = document.getElementById("toggleAudio");
  const input = document.getElementById("audioFile");

  btn.onclick = () => {
    input.click();
  };

  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;

    // Create AudioContext once
    if (!this.audioCtx) {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    if (this.audioCtx.state === 'suspended') {
      await this.audioCtx.resume();
    }

    // Create analyser once
    if (!this.analyser) {
      this.analyser = this.audioCtx.createAnalyser();
      this.analyser.fftSize = 512;
      this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
    }

    // Stop previous audio if it exists
    if (this.audio) {
      this.audio.pause();
      this.audio = null;
    }

    // Create new audio element
    this.audio = new Audio(URL.createObjectURL(file));
    this.audio.loop = true;

    // FIX: Only create source once per audio element
    if (!this.audioSource) {
      this.audioSource = this.audioCtx.createMediaElementSource(this.audio);
      this.audioSource.connect(this.analyser);
      this.analyser.connect(this.audioCtx.destination);
    }

    this.audio.play();
    btn.innerText = "Song Playing...";
  };
}


  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", gltf => {

      const fish = gltf.scene.children[0];
      const meshes = [];

      fish.traverse(c => {
        if (c.isMesh) {
          // FIX: Clone materials so they can be modified individually
          c.material = c.material.clone();
          
          meshes.push({
            mesh: c,
            baseColor: c.material.color.clone()
          });
          
          c.material.emissive = new THREE.Color(0x000000);
          c.material.emissiveIntensity = 0;
        }
      });

      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);
      fish.position.set(0, 0, 0);
      fish.rotation.set(0, 0, 0);
      fish.scale.set(1, 1, 1);

      const points = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 100) {
        const d = 1.2 + Math.sin(i * 8) / 20;
        points.push(new THREE.Vector3(Math.sin(i) * d, 0, Math.cos(i) * d));
      }

      const curve = new THREE.CatmullRomCurve3(points);
      curve.closed = true;
      
      const flow = new Flow(fish);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);

      this.tasks.push(() => {
        flow.moveAlongCurve(0.0015);

        if (!this.analyser) return;
        this.analyser.getByteFrequencyData(this.freqData);

        // Lows (Bass): 0 - 20 range
        const low = this.freqData.slice(0, 20).reduce((a, b) => a + b, 0) / 20 / 255;
        // Highs (Treble): 150+ range
        const high = this.freqData.slice(150).reduce((a, b) => a + b, 0) / (this.freqData.length - 150) / 255;

        const threshold = 0.1;

        meshes.forEach(({ mesh, baseColor }) => {
          if (low > threshold) {
            // Bass shifts the hue and darkens slightly
            const hue = (0.5 + low * 0.5) % 1.0; 
            mesh.material.color.setHSL(hue, 0.8, 0.5);
          } else {
            mesh.material.color.lerp(baseColor, 0.1);
          }

          if (high > threshold) {
            // Highs trigger the emission (glow)
            mesh.material.emissive.set(0x00ffd0);
            mesh.material.emissiveIntensity = high * 5;
          } else {
            mesh.material.emissiveIntensity *= 0.8; // Smooth fade out
          }
        });
      });
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.tasks.forEach(t => t());
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
