<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Face Tracking</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* Hide the raw video feed, we only want the particles */
        #input_video { display: none; }
        /* Canvas covers the screen */
        #output_canvas { display: block; width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            color: white; font-family: monospace; font-size: 24px;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="loading">Initialize Camera...</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

<script>
/* ================= CONFIG ================= */
const FACE_SCALE_X = 3.0;
const FACE_SCALE_Y = 3.6; // fix vertical squash
const FACE_SCALE_Z = 2.0;

const INTERPOLATION_STEPS = 2; // adds points BETWEEN landmarks
const HEAD_PARTICLES = 320;    // procedural skull
const TRAIL_DAMPING = 0.85;
const SWARM_STRENGTH = 0.002;

/* ================= THREE ================= */
const canvas = document.getElementById("output_canvas");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 2.5;

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(innerWidth, innerHeight);

/* ================= STORAGE ================= */
let targetPositions = [];
let currentPositions = [];

/* ================= GEOMETRY ================= */
const geometry = new THREE.BufferGeometry();
const material = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.016,
    transparent: true,
    opacity: 0.9
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

/* ================= MEDIAPIPE ================= */
const video = document.getElementById("input_video");
const loading = document.getElementById("loading");

function interpolate(a, b, t) {
    return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t,
        z: a.z + (b.z - a.z) * t
    };
}

function onResults(results) {
    if (!results.multiFaceLandmarks?.length) return;
    loading.style.display = "none";

    const lm = results.multiFaceLandmarks[0];
    targetPositions = [];

    /* ---- FACE DENSIFICATION ---- */
    for (let i = 0; i < lm.length - 1; i++) {
        const a = lm[i];
        const b = lm[i + 1];

        for (let s = 0; s <= INTERPOLATION_STEPS; s++) {
            const p = interpolate(a, b, s / (INTERPOLATION_STEPS + 1));

            targetPositions.push(
                (0.5 - p.x) * FACE_SCALE_X,
                (0.5 - p.y) * FACE_SCALE_Y,
                -p.z * FACE_SCALE_Z
            );
        }
    }

    /* ---- PROCEDURAL HEAD (ELLIPSOID SKULL) ---- */
    for (let i = 0; i < HEAD_PARTICLES; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;

        const rx = 0.75;
        const ry = 0.95;
        const rz = 0.85;

        targetPositions.push(
            Math.cos(theta) * Math.sin(phi) * rx,
            Math.cos(phi) * ry + 0.15,
            Math.sin(theta) * Math.sin(phi) * rz - 0.35
        );
    }

    /* ---- INIT BUFFERS ---- */
    if (currentPositions.length !== targetPositions.length) {
        currentPositions = [...targetPositions];
        geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(new Float32Array(currentPositions), 3)
        );
    }
}

/* ================= FISH SWARM ================= */
function applySwarm() {
    for (let i = 0; i < currentPositions.length; i += 3) {
        currentPositions[i]     += (Math.random() - 0.5) * SWARM_STRENGTH;
        currentPositions[i + 1] += (Math.random() - 0.5) * SWARM_STRENGTH;
        currentPositions[i + 2] += (Math.random() - 0.5) * SWARM_STRENGTH;
    }
}

/* ================= TRAILS ================= */
function updateTrails() {
    for (let i = 0; i < currentPositions.length; i++) {
        currentPositions[i] =
            currentPositions[i] * TRAIL_DAMPING +
            targetPositions[i] * (1 - TRAIL_DAMPING);
    }

    geometry.attributes.position.needsUpdate = true;
}

/* ================= LOOP ================= */
function animate() {
    requestAnimationFrame(animate);
    if (targetPositions.length) {
        applySwarm();
        updateTrails();
    }
    renderer.render(scene, camera);
}
animate();

/* ================= MEDIAPIPE INIT ================= */
const faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults(onResults);

new Camera(video, {
    onFrame: async () => await faceMesh.send({ image: video }),
    width: 1280,
    height: 720
}).start();

/* ================= RESIZE ================= */
addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
