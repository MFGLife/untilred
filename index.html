<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salmon — True Audio Flash</title>

<style>
body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }

#audioPanel {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10;
  background: rgba(0,0,0,0.7);
  padding: 12px;
  border-radius: 8px;
  color: white;
}
#audioPanel button {
  background: #00ffd0;
  border: none;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  color: #000;
}
#audioPanel input { display: none; }
</style>
</head>

<body>

<div id="audioPanel">
  <button id="toggleAudio">Upload Song</button>
  <input type="file" id="audioFile" accept="audio/*">
</div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x050505);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    document.body.appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    this.camera.position.set(0, 1.5, 3);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    
    this.tasks = [];

    this.audioCtx = null;
    this.analyser = null;
    this.freqData = null;
    this.audioSource = null;
    this.audio = null;

    this.initLights();
    this.initAudioUI();
    this.loadFish();
    this.handleResize();
    this.animate();
  }

  initLights() {
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.DirectionalLight(0xffffff, 1.0);
    light.position.set(-3, 5, 2);
    this.scene.add(light);
  }

  initAudioUI() {
    const btn = document.getElementById("toggleAudio");
    const input = document.getElementById("audioFile");

    btn.onclick = () => input.click();

    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;

      if (!this.audioCtx)
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (this.audioCtx.state === "suspended")
        await this.audioCtx.resume();

      if (!this.analyser) {
        this.analyser = this.audioCtx.createAnalyser();
        this.analyser.fftSize = 512;
        this.analyser.smoothingTimeConstant = 0.8;
        this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.connect(this.audioCtx.destination);
      }

      if (this.audio) this.audio.pause();
      if (this.audioSource) this.audioSource.disconnect();

      this.audio = new Audio(URL.createObjectURL(file));
      this.audio.loop = true;
      this.audioSource = this.audioCtx.createMediaElementSource(this.audio);
      this.audioSource.connect(this.analyser);

      await this.audio.play();
      btn.innerText = "Song Playing...";
    };
  }

  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", gltf => {

      const fish = gltf.scene.children[0];
      const masks = [];

      fish.traverse(c => {
        if (!c.isMesh) return;

        // original material preserved
        c.material = c.material.clone();

        // mask overlay (pure visual)
        const maskMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0,
          depthWrite: false
        });

        const maskMesh = new THREE.Mesh(c.geometry, maskMat);
        maskMesh.renderOrder = 10;
        c.add(maskMesh);

        masks.push(maskMat);
      });

      // --- ORIGINAL TRANSFORMS (unchanged) ---
      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);
      fish.position.set(0, 0, 0);
      fish.rotation.set(0, 0, 0);
      fish.scale.set(1, 1, 1);
      // -------------------------------------

      const points = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 100) {
        const d = 1.2 + Math.sin(i * 8) / 20;
        points.push(new THREE.Vector3(Math.sin(i) * d, 0, Math.cos(i) * d));
      }

      const curve = new THREE.CatmullRomCurve3(points, true);
      const flow = new Flow(fish);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);

      const avg = (a, x, y) => {
        let s = 0;
        for (let i = x; i < y; i++) s += a[i];
        return (s / (y - x)) / 255;
      };

      this.tasks.push(() => {
        flow.moveAlongCurve(0.0015);
        if (!this.analyser) return;

        this.analyser.getByteFrequencyData(this.freqData);

        // MID BAND (visual rhythm)
        const mid = avg(this.freqData, 20, 90);

        masks.forEach(m => {
          if (mid > 0.12) {
            m.color.setHSL(Math.random(), 1, 0.6);
            m.opacity = THREE.MathUtils.clamp(mid * 2.5, 0.25, 1);
          } else {
            m.opacity *= 0.6;
          }
        });
      });
    });
  }

  handleResize() {
    window.addEventListener("resize", () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.tasks.forEach(t => t());
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
