<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reactive Salmon Flow</title>

<style>
  body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #audioPanel {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(10px);
    padding: 15px 25px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
  }
  
  #audioPanel:hover {
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid rgba(255,255,255,0.3);
  }

  #audioPanel button {
    background: linear-gradient(135deg, #00ffd0, #0088ff);
    border: none;
    padding: 10px 24px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: #000;
    text-transform: uppercase;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  #audioPanel button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0, 255, 208, 0.4);
  }

  #audioPanel input { display: none; }
  
  .status {
    font-size: 11px;
    margin-top: 8px;
    color: #888;
    letter-spacing: 1px;
  }
</style>
</head>

<body>

<div id="audioPanel">
  <button id="toggleAudio">Select Music Track</button>
  <input type="file" id="audioFile" accept="audio/*">
  <div class="status" id="statusText">WAITING FOR INPUT</div>
</div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.136.0";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.136.0/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.container = document.body;
    
    // 1. Setup Scene
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x050505);
    // Add some subtle fog for depth
    this.scene.fog = new THREE.FogExp2(0x050505, 0.15);

    // 2. Setup Renderer
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    // Output encoding for better colors
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.container.appendChild(this.renderer.domElement);

    // 3. Setup Camera
    this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    this.camera.position.set(0, 2, 3.5);

    // 4. Controls
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.autoRotate = true;
    this.controls.autoRotateSpeed = 0.5;
    
    this.clock = new THREE.Clock();
    
    // Audio Variables
    this.analyser = null;
    this.dataArray = null;
    this.audio = null;
    this.colorOffset = 0; // For cycling colors

    this.initLights();
    this.loadModel();
    this.initAudio();
    this.handleResize();
    this.render();
  }

  initLights() {
    const ambient = new THREE.AmbientLight(0xffffff, 0.2);
    this.scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(2, 5, 2);
    this.scene.add(dirLight);

    // Blue rim light for underwater feel
    const spotLight = new THREE.SpotLight(0x0088ff, 2);
    spotLight.position.set(-2, 0, -2);
    spotLight.lookAt(0,0,0);
    this.scene.add(spotLight);
  }

  loadModel() {
    const loader = new GLTFLoader();
    // Using the same fish model
    loader.load("https://assets.codepen.io/5946/fish.glb", (gltf) => {
      
      let meshSubject = null;

      // FIX: Traverse to find the actual Mesh, not the Group
      gltf.scene.traverse((child) => {
        if (child.isMesh && !meshSubject) {
          meshSubject = child;
        }
      });

      if(!meshSubject) {
        console.error("No mesh found in GLTF");
        return;
      }

      // Clone material so we can mess with it without side effects
      meshSubject.material = new THREE.MeshStandardMaterial({
        color: 0x444444,
        roughness: 0.4,
        metalness: 0.6,
        emissive: 0x000000,
      });

      // FIX: Rotate Geometry, not Object, for Flow to work correctly
      meshSubject.geometry.rotateX(Math.PI / 2);
      meshSubject.geometry.scale(0.5, 0.5, 0.5); // Adjust scale

      // Create Curve (Same as original request to maintain swim)
      const points = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 100) {
        const x = Math.sin(i);
        const z = Math.cos(i);
        // Slight variation in radius for organic path
        const dist = 1.2 + Math.sin(i * 8) * 0.1; 
        points.push(new THREE.Vector3(x * dist, 0, z * dist));
      }
      
      const curve = new THREE.CatmullRomCurve3(points);
      curve.closed = true;

      // Initialize Flow
      this.flow = new Flow(meshSubject);
      this.flow.updateCurve(0, curve);
      this.scene.add(this.flow.object3D);

      // Store reference for animation loop
      this.fishMesh = this.flow.object3D.children[0]; // Access the flow mesh

    });
  }

  initAudio() {
    const btn = document.getElementById("toggleAudio");
    const input = document.getElementById("audioFile");
    const status = document.getElementById("statusText");

    btn.addEventListener("click", () => input.click());

    input.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.innerText = "LOADING AUDIO...";

      if (this.audio) {
        this.audio.pause();
        this.audio = null;
      }

      this.audio = new Audio(URL.createObjectURL(file));
      this.audio.loop = true;
      this.audio.crossOrigin = "anonymous";

      // Audio Context
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!this.ctx) this.ctx = new AudioContext();
      
      if (this.ctx.state === 'suspended') await this.ctx.resume();

      const source = this.ctx.createMediaElementSource(this.audio);
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 512; // Higher resolution
      
      source.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
      
      this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

      this.audio.play().then(() => {
        status.innerText = "PLAYING: " + file.name.substring(0, 20) + "...";
        btn.innerText = "Change Track";
      });
    });
  }

  updateAudioVisuals() {
    if (!this.analyser || !this.flow) return;

    this.analyser.getByteFrequencyData(this.dataArray);

    // Calculate bands
    const bass = this.getAverage(0, 10);      // Deep bass
    const mids = this.getAverage(20, 100);    // Vocals/Instruments
    const highs = this.getAverage(100, 200);  // Hats/Cymbals

    // Normalize (0.0 to 1.0)
    const bassN = bass / 255;
    const midsN = mids / 255;
    const highsN = highs / 255;

    // --- THE COLOR MASH LOGIC ---

    // 1. Cycle Base Hue based on Time + Bass kicks
    // When bass hits hard, the colors cycle faster
    this.colorOffset += 0.005 + (bassN * 0.05);
    
    // 2. Set the Base Color (Mids determine saturation/lightness variation)
    const hue = this.colorOffset % 1;
    const saturation = 0.6 + (midsN * 0.4); // More volume = more saturated
    const lightness = 0.3 + (bassN * 0.2); 
    
    // Apply to material inside the Flow object
    this.flow.object3D.children.forEach(mesh => {
      if(mesh.material) {
        mesh.material.color.setHSL(hue, saturation, lightness);
        
        // 3. Emissive (Glow) driven by Highs
        // High frequencies make it flash white/cyan
        const glowIntensity = highsN * 4.0; 
        const glowHue = (hue + 0.5) % 1; // Complementary color for glow
        mesh.material.emissive.setHSL(glowHue, 1, 0.5);
        mesh.material.emissiveIntensity = THREE.MathUtils.lerp(mesh.material.emissiveIntensity, glowIntensity, 0.2);
      }
    });
  }

  getAverage(start, end) {
    let sum = 0;
    for (let i = start; i < end; i++) {
      sum += this.dataArray[i];
    }
    return sum / (end - start);
  }

  handleResize() {
    window.addEventListener("resize", () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  render() {
    requestAnimationFrame(() => this.render());
    
    // Update Flow (Swim Animation)
    if (this.flow) {
      this.flow.moveAlongCurve(0.002);
    }
    
    this.controls.update();
    this.updateAudioVisuals();
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
