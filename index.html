<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salmon - Rippling Strands</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.sizes = { width: window.innerWidth, height: window.innerHeight };
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x050520);
    this.scene.fog = new THREE.FogExp2(0x050520, 0.1);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.sizes.width, this.sizes.height);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    document.body.appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(75, this.sizes.width / this.sizes.height, 0.1, 500);
    this.camera.position.set(0, 2, 5);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.clock = new THREE.Clock();
    this.tasks = [];
    
    this.init();
    this.animate();
  }

  init() {
    this.createGround();
    this.createRipplingGrass();
    this.loadFish();
  }

  createGround() {
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x050505 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.0; 
    this.scene.add(floor);
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  }

  createRipplingGrass() {
    const strandCount = 1000; // Number of grass clumps
    const particlesPerStrand = 30; // 30 vertical particles as requested
    const totalParticles = strandCount * particlesPerStrand;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(totalParticles * 3);
    const delays = new Float32Array(totalParticles); // Used for the ripple delay

    for (let i = 0; i < strandCount; i++) {
      const rootX = (Math.random() - 0.5) * 40;
      const rootZ = (Math.random() - 0.5) * 40;

      for (let j = 0; j < particlesPerStrand; j++) {
        const idx = (i * particlesPerStrand + j);
        
        positions[idx * 3] = rootX;
        positions[idx * 3 + 1] = j * 0.1; // Stacked vertically
        positions[idx * 3 + 2] = rootZ;

        // Higher particles have more delay/movement
        delays[idx] = j * 0.1; 
      }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aDelay', new THREE.BufferAttribute(delays, 1));

    // Custom Shader to handle the ripple/wave movement
    const material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x22ff88) }
      },
      vertexShader: `
        uniform float uTime;
        attribute float aDelay;
        void main() {
          vec3 pos = position;
          // Ripple effect: offset X and Z based on height (aDelay) and time
          float wave = sin(uTime * 2.0 - (pos.y * 2.0)) * (aDelay * 0.5);
          pos.x += wave;
          pos.z += wave;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = 4.0 * (1.0 / -mvPosition.z); // Scale size by distance
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if(d > 0.5) discard; // Make particles round
          gl_FragColor = vec4(uColor, 1.0 - (d * 2.0));
        }
      `,
      transparent: true
    });

    const points = new THREE.Points(geometry, material);
    points.position.y = -1.0; 
    this.scene.add(points);

    this.tasks.push(() => {
      material.uniforms.uTime.value = this.clock.getElapsedTime();
    });
  }

  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", (gltf) => {
      const fish = gltf.scene.children[0];
      
      // Original tight Scale & Black material
      fish.traverse(c => { if(c.isMesh) c.material = new THREE.MeshStandardMaterial({color: 0x000000}); });
      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);
      fish.position.set(0,0,0);
      fish.rotation.set(0,0,0);
      fish.scale.set(1,1,1);

      // RESTORED: Original Movement Path
      const initialPoints = [];
      const pointCount = 100;
      for (let i = 0; i < Math.PI * 2; i += Math.PI / pointCount) {
        const dist = 1 + Math.sin(i * 10) / 30; // Original logic
        initialPoints.push(new THREE.Vector3(Math.sin(i) * dist, 0, Math.cos(i) * dist));
      }

      const curve = new THREE.CatmullRomCurve3(initialPoints);
      const flow = new Flow(fish);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);

      this.tasks.push(() => { flow.moveAlongCurve(0.001); });
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    const delta = this.clock.getDelta();
    this.tasks.forEach(t => t());
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
