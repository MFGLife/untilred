<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyric Sync Equalizer (9:16)</title>
  <style>
    body {
      margin: 0;
      background: #05050a;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }h1 {
  font-size: 1rem;
  opacity: 0.85;
  margin-bottom: 8px;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 8px;
}

input[type=file], button {
  background: #151520;
  color: #ccc;
  padding: 6px 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #7b8cff;
  color: #fff;
  cursor: pointer;
}

.stage {
  position: relative;
  width: 360px;
  height: 640px; /* 9:16 */
  background: black;
  border-radius: 16px;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
}

.lyrics {
  position: absolute;
  top: 42%;
  width: 100%;
  text-align: center;
  font-size: 1.6rem;
  font-weight: 600;
  padding: 0 12px;
  pointer-events: none;
  text-shadow: 0 2px 14px rgba(0,0,0,0.85);
  transition: transform 0.12s ease, opacity 0.12s ease;
}

textarea {
  width: 100%;
  max-width: 360px;
  height: 120px;
  background: #101018;
  color: #ddd;
  border-radius: 8px;
  padding: 8px;
  font-family: monospace;
  margin-top: 10px;
}

.hint {
  font-size: 0.75rem;
  opacity: 0.6;
  text-align: center;
  margin-top: 4px;
}

  </style>
</head>
<body><h1>Lyric Visualizer (Beat + AI LRC)</h1><div class="controls">
  <input type="file" id="audioFile" accept="audio/*" />
  <button id="playBtn">Play</button>
  <button id="autoBtn">Auto‑Generate LRC</button>
</div><div class="stage">
  <canvas id="eq"></canvas>
  <div class="lyrics" id="lyrics"></div>
</div><textarea id="lrcInput" placeholder="LRC will appear here or paste your own..."></textarea><div class="hint">Sentence‑level sync • Beat‑reactive lyrics • Vertical 9:16</div><audio id="audio" crossorigin="anonymous"></audio>

<script>
const audio = document.getElementById('audio');
const canvas = document.getElementById('eq');
const ctx = canvas.getContext('2d');
const lyricsEl = document.getElementById('lyrics');

canvas.width = 360;
canvas.height = 640;

let audioCtx, analyser, source, freqData, timeData;
let lyrics = [];
let lastBeat = 0;

// Load audio

document.getElementById('audioFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  audio.src = URL.createObjectURL(file);
});

// Play

document.getElementById('playBtn').addEventListener('click', async () => {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  parseLyrics();
  audio.play();
  draw();
});

// Parse LRC

function parseLyrics() {
  const raw = document.getElementById('lrcInput').value;
  lyrics = raw.split('\n').map(line => {
    const m = line.match(/(\d+):(\d+\.\d+)(.*)/);
    if (!m) return null;
    return {
      time: parseInt(m[1]) * 60 + parseFloat(m[2]),
      text: m[3].trim()
    };
  }).filter(Boolean);
}

// Sentence lyric update

function updateLyrics(t) {
  for (let i = lyrics.length - 1; i >= 0; i--) {
    if (t >= lyrics[i].time) {
      lyricsEl.textContent = lyrics[i].text;
      return;
    }
  }
  lyricsEl.textContent = '';
}

// Beat detection (energy‑based)

function detectBeat(now) {
  analyser.getByteTimeDomainData(timeData);
  let sum = 0;
  for (let i = 0; i < timeData.length; i++) {
    const v = (timeData[i] - 128) / 128;
    sum += v * v;
  }
  const energy = sum / timeData.length;
  if (energy > 0.02 && now - lastBeat > 0.25) {
    lastBeat = now;
    return true;
  }
  return false;
}

// Draw loop

function draw() {
  requestAnimationFrame(draw);

  analyser.getByteFrequencyData(freqData);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const barCount = 48;
  const step = Math.floor(freqData.length / barCount);
  const barWidth = canvas.width / barCount;

  for (let i = 0; i < barCount; i++) {
    const v = freqData[i * step] / 255;
    const h = v * canvas.height * 0.6;
    ctx.fillStyle = `hsl(${200 + i * 2}, 80%, ${50 + v * 20}%)`;
    ctx.fillRect(i * barWidth, canvas.height - h, barWidth - 2, h);
  }

  const beat = detectBeat(audio.currentTime);
  if (beat) {
    lyricsEl.style.transform = 'scale(1.08)';
    lyricsEl.style.opacity = '1';
  } else {
    lyricsEl.style.transform = 'scale(1)';
    lyricsEl.style.opacity = '0.9';
  }

  updateLyrics(audio.currentTime);
}

// AI LRC generation (browser speech recognition)

document.getElementById('autoBtn').addEventListener('click', () => {
  if (!('webkitSpeechRecognition' in window)) {
    alert('Speech recognition not supported in this browser');
    return;
  }

  const rec = new webkitSpeechRecognition();
  rec.continuous = true;
  rec.interimResults = false;
  rec.lang = 'en-US';

  let startTime = audio.currentTime;

  rec.onresult = e => {
    const t = audio.currentTime;
    const text = e.results[e.results.length - 1][0].transcript.trim();
    const min = Math.floor(t / 60).toString().padStart(2, '0');
    const sec = (t % 60).toFixed(2).padStart(5, '0');
    document.getElementById('lrcInput').value += `\n[${min}:${sec}] ${text}`;
  };

  audio.play();
  rec.start();
});
</script></body>
</html>
