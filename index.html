<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Face Tracking</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* Hide the raw video feed, we only want the particles */
        #input_video { display: none; }
        /* Canvas covers the screen */
        #output_canvas { display: block; width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            color: white; font-family: monospace; font-size: 24px;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="loading">Initialize Camera...</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

<script>
    // --- 1. SETUP THREE.JS (THE RENDERING ENGINE) ---
    const canvas = document.getElementById('output_canvas');
    const scene = new THREE.Scene();
    
    // Create a camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 2; // Move camera back slightly
    camera.position.y = 0; 

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Create the Particle System
    // MediaPipe Face Mesh detects 468 landmarks
    const landmarkCount = 468;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(landmarkCount * 3); // x, y, z for each point
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // Create the material (The look of the particles)
    const material = new THREE.PointsMaterial({
        color: 0xffffff, // White particles
        size: 0.02,      // Particle size
        sizeAttenuation: true
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // --- 2. SETUP MEDIAPIPE FACE MESH (THE TRACKER) ---
    const videoElement = document.getElementById('input_video');
    const loadingMsg = document.getElementById('loading');

    function onResults(results) {
        loadingMsg.style.display = 'none';

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];

            // Update Three.js particle positions based on MediaPipe landmarks
            const positions = particles.geometry.attributes.position.array;

            for (let i = 0; i < landmarks.length; i++) {
                const x = (0.5 - landmarks[i].x) * 3; // Scale and center X
                const y = (0.5 - landmarks[i].y) * 2; // Scale and center Y (invert)
                const z = -landmarks[i].z;            // Z depth

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            
            // Tell Three.js the positions have changed
            particles.geometry.attributes.position.needsUpdate = true;
        }
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // --- 3. CAMERA STARTUP ---
    const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
            await faceMesh.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });

    cameraFeed.start();

    // --- 4. ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);
        
        // Optional: Add some subtle idle rotation if no face is detected
        // particles.rotation.y += 0.001; 

        renderer.render(scene, camera);
    }
    animate();

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
