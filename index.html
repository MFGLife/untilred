<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>arXiv AI Reader</title>
    <style>
        :root { --bg: #000000; --accent: #10b981; --text: #ecfdf5; }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; margin: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        
        /* The Big Button */
        #playBtn {
            width: 160px; height: 160px; border-radius: 50%;
            background: transparent; border: 3px solid var(--accent);
            color: var(--accent); font-size: 4rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s ease; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }
        #playBtn:active { transform: scale(0.95); background: rgba(16, 185, 129, 0.1); }
        .loading { animation: pulse 1.5s infinite; border-color: #6ee7b7 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 30px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        /* Metadata */
        .info { text-align: center; width: 85%; max-width: 500px; margin-top: 40px; }
        h1 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: #6ee7b7; margin-bottom: 30px; }
        #title { font-size: 1.3rem; font-weight: 700; line-height: 1.4; margin-bottom: 10px; min-height: 3em; }
        #authors { font-size: 0.9rem; color: #9ca3af; font-style: italic; }
        
        /* Status Bar */
        #status { position: absolute; bottom: 30px; font-size: 0.8rem; color: #4b5563; }
        
        /* Visualizer Bars (Fake) */
        .bars { display: flex; gap: 4px; height: 30px; align-items: flex-end; margin-top: 20px; opacity: 0; transition: opacity 0.5s; }
        .bar { width: 4px; background: var(--accent); animation: bounce 1s infinite ease-in-out; }
        .playing .bars { opacity: 1; }
        .bar:nth-child(1) { animation-duration: 0.8s; } .bar:nth-child(2) { animation-duration: 1.1s; } .bar:nth-child(3) { animation-duration: 0.9s; } .bar:nth-child(4) { animation-duration: 1.2s; } .bar:nth-child(5) { animation-duration: 0.7s; }
        @keyframes bounce { 0%, 100% { height: 5px; } 50% { height: 25px; } }
    </style>
</head>
<body>

    <audio id="silentKeeper" loop>
        <source src="https://raw.githubusercontent.com/anars/blank-audio/master/5-seconds-of-silence.mp3" type="audio/mpeg">
    </audio>

    <div class="info">
        <h1>CS.AI // Recent News</h1>
        <div id="title">Tap button to fetch papers</div>
        <div id="authors">Voice of the ArXiv</div>
    </div>

    <button id="playBtn">▶</button>

    <div class="bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div id="status">Ready</div>

    <script>
        const btn = document.getElementById('playBtn');
        const titleEl = document.getElementById('title');
        const authEl = document.getElementById('authors');
        const statusEl = document.getElementById('status');
        const silentAudio = document.getElementById('silentKeeper');
        const synth = window.speechSynthesis;
        
        let papers = [];
        let isSpeaking = false;
        let currentUtterance = null;

        // 1. Fetch arXiv Data (CS.AI category, sorted by submitted date)
        async function fetchPapers() {
            statusEl.innerText = "Connecting to arXiv...";
            btn.classList.add('loading');
            
            try {
                // Use HTTPS and try multiple CORS proxies as fallback
                const arxivUrl = 'https://export.arxiv.org/api/query?search_query=cat:cs.AI&start=0&max_results=50&sortBy=submittedDate&sortOrder=descending';
                
                let response;
                let xmlText;
                
                // Try direct fetch first (works if your page is HTTP or has CORS)
                try {
                    response = await fetch(arxivUrl);
                    xmlText = await response.text();
                } catch (e) {
                    // Fallback to CORS proxy
                    console.log('Direct fetch failed, trying proxy...');
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(arxivUrl)}`;
                    response = await fetch(proxyUrl);
                    xmlText = await response.text();
                }
                
                // Parse XML
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, "text/xml");
                
                // Check for parsing errors
                const parseError = xml.querySelector('parsererror');
                if (parseError) {
                    throw new Error('XML parsing failed');
                }
                
                const entries = xml.querySelectorAll('entry');
                
                if (entries.length === 0) {
                    throw new Error('No papers found in response');
                }
                
                papers = Array.from(entries).map(entry => {
                    const titleNode = entry.querySelector('title');
                    const summaryNode = entry.querySelector('summary');
                    const authorNode = entry.querySelector('author name');
                    
                    return {
                        title: titleNode ? titleNode.textContent.replace(/\n/g, ' ').trim() : 'Unknown Title',
                        summary: summaryNode ? summaryNode.textContent.replace(/\n/g, ' ').trim() : 'No summary available',
                        author: authorNode ? authorNode.textContent.trim() : 'Unknown Author'
                    };
                });
                
                statusEl.innerText = `${papers.length} papers loaded ✓`;
                btn.classList.remove('loading');
                return true;
            } catch (e) {
                console.error('Fetch error:', e);
                statusEl.innerText = `Error: ${e.message}`;
                btn.classList.remove('loading');
                
                // Load sample data as fallback
                papers = [
                    {
                        title: "Demo Mode: Large Language Models for Code Generation",
                        summary: "This is a demo paper. The app couldn't connect to arXiv. Please check your internet connection or try again later.",
                        author: "Sample Author"
                    }
                ];
                statusEl.innerText = "Using demo data (fetch failed)";
                return true; // Still return true so we can demo
            }
        }

        // 2. The Speaking Logic
        function readPaper() {
            if (papers.length === 0) return;

            // Pick Random
            const paper = papers[Math.floor(Math.random() * papers.length)];
            
            // Update UI
            titleEl.innerText = paper.title;
            authEl.innerText = "By " + paper.author;
            document.body.classList.add('playing');
            btn.innerText = "⏹";
            isSpeaking = true;

            // Prepare Text - truncate summary if too long
            const truncatedSummary = paper.summary.length > 500 
                ? paper.summary.substring(0, 500) + "..." 
                : paper.summary;
            
            const textToRead = `New paper. ${paper.title}. ... Abstract. ... ${truncatedSummary}`;

            // Configure Voice
            if (currentUtterance) synth.cancel();
            currentUtterance = new SpeechSynthesisUtterance(textToRead);
            currentUtterance.rate = 0.9; // Slightly slower for comprehension
            currentUtterance.pitch = 1.0;

            // Try to pick a decent English voice
            const voices = synth.getVoices();
            const preferredVoice = voices.find(v => v.name.includes("Google US English")) 
                || voices.find(v => v.lang === 'en-US')
                || voices.find(v => v.lang.startsWith('en'))
                || voices[0]; // Fallback to first available
            
            if (preferredVoice) currentUtterance.voice = preferredVoice;

            // Events
            currentUtterance.onend = () => {
                isSpeaking = false;
                document.body.classList.remove('playing');
                btn.innerText = "▶";
                statusEl.innerText = "Finished. Tap for next.";
                silentAudio.pause();
            };

            currentUtterance.onerror = (e) => {
                console.error('Speech error:', e);
                isSpeaking = false;
                document.body.classList.remove('playing');
                btn.innerText = "▶";
                statusEl.innerText = "Speech error. Try again.";
                silentAudio.pause();
            };

            // Play the silent track to keep the OS media session active
            silentAudio.play().catch(e => console.log("Audio play failed", e));
            
            // Speak
            synth.speak(currentUtterance);

            // Set Lock Screen Info (Media Session API)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: paper.title.substring(0, 50) + (paper.title.length > 50 ? "..." : ""),
                    artist: "arXiv CS.AI",
                    album: "AI Research Feed"
                });
                navigator.mediaSession.setActionHandler('play', () => {
                    if (synth.paused) synth.resume();
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    synth.pause();
                });
            }
        }

        // 3. Interaction
        btn.onclick = async () => {
            if (isSpeaking) {
                synth.cancel();
                silentAudio.pause();
                isSpeaking = false;
                document.body.classList.remove('playing');
                btn.innerText = "▶";
                statusEl.innerText = "Stopped.";
                return;
            }

            // First time load
            if (papers.length === 0) {
                const success = await fetchPapers();
                if (success) readPaper();
            } else {
                readPaper();
            }
        };

        // Pre-load voices (Chrome bug fix)
        window.speechSynthesis.onvoiceschanged = () => {
             window.speechSynthesis.getVoices();
        };

    </script>
</body>
</html>
