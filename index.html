<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salmon — Audio Reactive</title>

<style>
body { margin: 0; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }

#audioPanel {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10;
  background: rgba(0,0,0,0.6);
  padding: 8px 10px;
  border-radius: 6px;
}
#audioPanel button {
  background: #00ffd0;
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
  font-weight: 600;
  cursor: pointer;
}
#audioPanel input {
  display: none;
  margin-top: 6px;
}
</style>
</head>

<body>

<div id="audioPanel">
  <button id="toggleAudio">Upload Song</button>
  <input type="file" id="audioFile" accept="audio/*">
</div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
  constructor() {
    this.scene = new THREE.Scene();
    

    this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
    this.camera.position.set(0, 1.2, 3);

    this.renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    document.body.appendChild(this.renderer.domElement);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.clock = new THREE.Clock();
    this.tasks = [];

    /* AUDIO */
    this.audioCtx = null;
    this.analyser = null;
    this.freqData = null;

    this.initLights();
    this.initAudioUI();
    this.loadFish();
    this.animate();
  }

  initLights() {
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.PointLight(0x00ffff, 2, 10);
    light.position.set(0, 2, 2);
    this.scene.add(light);
  }

  initAudioUI() {
    const btn = document.getElementById("toggleAudio");
    const input = document.getElementById("audioFile");

    btn.onclick = () => {
      input.style.display = input.style.display === "block" ? "none" : "block";
    };

    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;

      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      this.analyser = this.audioCtx.createAnalyser();
      this.analyser.fftSize = 1024;
      this.freqData = new Uint8Array(this.analyser.frequencyBinCount);

      const audio = new Audio(URL.createObjectURL(file));
      audio.loop = true;
      audio.play();

      const src = this.audioCtx.createMediaElementSource(audio);
      src.connect(this.analyser);
      this.analyser.connect(this.audioCtx.destination);
    };
  }

  loadFish() {
    const loader = new GLTFLoader();
    loader.load("https://assets.codepen.io/5946/fish.glb", gltf => {

      const fish = gltf.scene.children[0];
      const material = new THREE.MeshStandardMaterial({
        color: 0x00ffee,
        emissive: 0x001111,
        roughness: 0.3,
        metalness: 0.2
      });

      fish.traverse(c => { if (c.isMesh) c.material = material; });

      fish.scale.set(0.01, 0.01, 0.01);
      fish.rotation.x = Math.PI * 0.5;
      fish.updateMatrix();
      fish.geometry.applyMatrix4(fish.matrix);
      fish.position.set(0, 0, 0);
      fish.rotation.set(0, 0, 0);
      fish.scale.set(1, 1, 1);

      const points = [];
      for (let i = 0; i < Math.PI * 2; i += Math.PI / 80) {
        points.push(new THREE.Vector3(Math.sin(i), -0.2, Math.cos(i)));
      }

      const curve = new THREE.CatmullRomCurve3(points);
      const flow = new Flow(fish);
      flow.updateCurve(0, curve);
      this.scene.add(flow.object3D);

      this.tasks.push(() => {
  flow.moveAlongCurve(0.0015);

  if (!this.analyser) return;
  this.analyser.getByteFrequencyData(this.freqData);

  const low  = this.freqData.slice(0, 60).reduce((a,b)=>a+b,0) / 60 / 255;
  const mid  = this.freqData.slice(60, 200).reduce((a,b)=>a+b,0) / 140 / 255;
  const high = this.freqData.slice(200).reduce((a,b)=>a+b,0) / (this.freqData.length - 200) / 255;

  // 🎨 Color mapping ONLY (safe)
  const hue = 0.48 + mid * 0.15;        // mids shift hue
  const glow = 0.2 + high * 2.0;        // highs control glow
  const lightness = 0.45 + low * 0.15;  // bass thickens color

  material.color.setHSL(hue, 1.0, lightness);
  material.emissive.setHSL(hue, 1.0, 0.3);
  material.emissiveIntensity = glow;
});
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.tasks.forEach(t => t());
    this.renderer.render(this.scene, this.camera);
  }
}

new Sketch();
</script>
</body>
</html>
