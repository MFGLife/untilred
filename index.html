<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>until.red</title>

<link rel="icon" href="logo.png">

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:Courier New, monospace;
}

#grid{
display:grid;
width:100vw;
height:100vh;
}

.cell{
display:flex;
align-items:center;
justify-content:center;
color:#86b62f;
font-size:18px;
}

.word{
color:#86b62f;
}

</style>

</head>
<body>

<div id="grid"></div>

<script>


/* ============================
MESSAGE
============================ */

const paragraph = `A research cult for those who know the story is rigged but refuse to play their assigned character. We weaponize double-entendre, anonymous ritual and AI-augmented language to expose the machinery behind the mask without sacrificing the people wearing it.`;


const words = paragraph.split(" ");


/* ============================
GLYPHS
============================ */

const glyphs = [

'∴','⟟','↺','⧗','Δ','☍','⟁','✦','☲','☷',
'⧖','⧘','⧙','⟲','⫽','🝮','♾','🜁','🜃','̸'

];


/* ============================
GRID
============================ */

let cols, rows;
let cells = [];

function createGrid(){

const grid=document.getElementById("grid");

const size=22;

cols=Math.floor(window.innerWidth/size);
rows=Math.floor(window.innerHeight/size);

grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
grid.style.gridTemplateRows=`repeat(${rows},1fr)`;

grid.innerHTML="";

cells=[];

for(let i=0;i<cols*rows;i++){

const div=document.createElement("div");

div.className="cell";

div.textContent=randomGlyph();

grid.appendChild(div);

cells.push(div);

}

}


/* ============================
RANDOM GLYPH
============================ */

function randomGlyph(){

return glyphs[Math.floor(Math.random()*glyphs.length)];

}


/* ============================
NOISE
============================ */

function fillNoise(){

for(let cell of cells){

cell.textContent=randomGlyph();
cell.classList.remove("word");

}

}


/* ============================
WORD DISPLAY
============================ */

let index=0;

function showWords(){

fillNoise();

for(let i=0;i<4;i++){

if(index>=words.length){
index=0;
}

const word=words[index];

const position=Math.floor(Math.random()*cells.length);

cells[position].textContent=word;
cells[position].classList.add("word");

index++;

}

}


/* ============================
TIMING
============================ */

createGrid();

setInterval(showWords, 1200);


/* ============================
RESPONSIVE
============================ */

window.addEventListener("resize", createGrid);


</script>

</body>
</html>
