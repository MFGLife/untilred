<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>arXiv AI Reader</title>

<style>
:root { --bg:#000; --accent:#10b981; --text:#ecfdf5; }
body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100vh; margin:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    overflow:hidden;
}
#playBtn {
    width:160px; height:160px; border-radius:50%;
    background:transparent;
    border:3px solid var(--accent);
    color:var(--accent);
    font-size:4rem; cursor:pointer;
    display:flex; justify-content:center; align-items:center;
    box-shadow:0 0 20px rgba(16,185,129,.2);
}
.loading { animation:pulse 1.5s infinite; }
@keyframes pulse {
    0%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}
    70%{box-shadow:0 0 0 30px rgba(16,185,129,0)}
    100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}
}
.info { text-align:center; width:85%; max-width:500px; margin-bottom:40px; }
h1 { font-size:.9rem; letter-spacing:2px; color:#6ee7b7; }
#title { font-size:1.3rem; font-weight:700; min-height:3em; }
#authors { font-size:.9rem; color:#9ca3af; font-style:italic; }
#status { position:absolute; bottom:30px; font-size:.8rem; color:#4b5563; }
.bars { display:flex; gap:4px; height:30px; margin-top:20px; opacity:0; }
.playing .bars { opacity:1; }
.bar { width:4px; background:var(--accent); animation:bounce 1s infinite; }
@keyframes bounce { 0%,100%{height:5px} 50%{height:25px} }
</style>
</head>

<body>

<audio id="silentKeeper" loop>
    <source src="https://raw.githubusercontent.com/anars/blank-audio/master/5-seconds-of-silence.mp3">
</audio>

<div class="info">
    <h1>CS.AI // Recent News</h1>
    <div id="title">Tap button to fetch papers</div>
    <div id="authors">Voice of the ArXiv</div>
</div>

<button id="playBtn">▶</button>

<div class="bars">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
</div>

<div id="status">Ready</div>

<script>
const btn = document.getElementById('playBtn');
const titleEl = document.getElementById('title');
const authEl = document.getElementById('authors');
const statusEl = document.getElementById('status');
const silentAudio = document.getElementById('silentKeeper');
const synth = window.speechSynthesis;

let papers = [];
let isSpeaking = false;
let shouldAutoPlay = false;
let currentPaperIndex = 0;

/* ---------------- FETCH ---------------- */

async function fetchPapers() {
    statusEl.innerText = "Connecting to arXiv...";
    btn.classList.add('loading');

    try {
        const url = 'https://export.arxiv.org/api/query?search_query=cat:cs.AI&start=0&max_results=50&sortBy=submittedDate&sortOrder=descending';
        const res = await fetch(url);
        const text = await res.text();

        const xml = new DOMParser().parseFromString(text, "text/xml");
        papers = [...xml.querySelectorAll('entry')].map(e => ({
            title: e.querySelector('title')?.textContent.replace(/\s+/g,' ').trim(),
            summary: e.querySelector('summary')?.textContent.replace(/\s+/g,' ').trim(),
            author: e.querySelector('author name')?.textContent.trim()
        }));

        statusEl.innerText = `${papers.length} papers loaded`;
    } catch {
        papers = [{
            title:"Demo Paper",
            summary:"Network unavailable. This is demo content.",
            author:"System"
        }];
        statusEl.innerText = "Demo mode";
    }

    btn.classList.remove('loading');
}

/* ---------------- SPEECH ---------------- */

function splitText(text, size=700) {
    const words = text.split(' ');
    const chunks = [];
    let chunk = '';

    for (const w of words) {
        if ((chunk + ' ' + w).length > size) {
            chunks.push(chunk);
            chunk = w;
        } else chunk += (chunk ? ' ' : '') + w;
    }
    if (chunk) chunks.push(chunk);
    return chunks;
}

function speakPaper(index) {
    if (!papers[index]) return;

    synth.cancel();

    const paper = papers[index];
    titleEl.innerText = paper.title;
    authEl.innerText = "By " + paper.author;
    btn.innerText = "⏹";
    document.body.classList.add('playing');
    isSpeaking = true;

    silentAudio.play().catch(()=>{});

    const fullText = `New paper. ${paper.title}. Abstract. ${paper.summary}`;
    const chunks = splitText(fullText);

    const voice = synth.getVoices().find(v=>v.lang.startsWith('en')) || null;

    chunks.forEach((text, i) => {
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9;
        if (voice) u.voice = voice;

        if (i === chunks.length - 1) {
            u.onend = () => {
                if (shouldAutoPlay) {
                    currentPaperIndex = (currentPaperIndex + 1) % papers.length;
                    speakPaper(currentPaperIndex);
                } else stopPlayback();
            };
        }

        synth.speak(u);
    });
}

function stopPlayback() {
    synth.cancel();
    silentAudio.pause();
    isSpeaking = false;
    shouldAutoPlay = false;
    btn.innerText = "▶";
    document.body.classList.remove('playing');
    statusEl.innerText = "Stopped";
}

/* ---------------- UI ---------------- */

btn.onclick = async () => {
    if (isSpeaking) return stopPlayback();

    if (!papers.length) await fetchPapers();

    shouldAutoPlay = true;
    speakPaper(currentPaperIndex);
};

/* preload voices */
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
speechSynthesis.getVoices();
</script>

</body>
</html>
