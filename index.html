<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Beatbox Loop Station</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --accent-color: #00e5ff;
            --active-color: #00ff66;
            --rec-color: #ff3333;
            --text-color: #e0e0e0;
            --pad-off: #333;
            --pad-loaded: #555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-color); }

        .station-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            background: var(--panel-color);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* DJ Deck */
        .deck-section {
            border-right: 2px solid #333;
            padding-right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .visualizer-box {
            height: 100px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            width: 100%;
        }

        .control-group {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
        }
        
        .control-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
            display: block;
        }

        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--accent-color); }

        /* Loop Grid */
        .loop-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .pad-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 100%; 
        }

        .loop-pad {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--pad-off);
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .loop-pad:active { transform: scale(0.98); }
        
        /* Pad States */
        .loop-pad.loaded { background: var(--pad-loaded); border-color: #666; }
        
        .loop-pad.playing { 
            background: var(--active-color); 
            box-shadow: 0 0 15px var(--active-color);
            border-color: #fff;
            color: #000;
            font-weight: bold;
        }

        .loop-pad.recording {
            background: var(--rec-color);
            box-shadow: 0 0 15px var(--rec-color);
            border-color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .pad-label { font-size: 12px; opacity: 0.7; pointer-events: none; }

        /* Small Buttons on Pad */
        .pad-ctrl {
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
            background: #000;
            color: #fff;
        }
        .pad-ctrl:hover { transform: scale(1.1); }

        .load-btn { top: 5px; right: 5px; }
        .load-btn:hover { background: var(--accent-color); }

        .rec-btn { top: 5px; left: 5px; color: var(--rec-color); border-color: var(--rec-color); }
        .rec-btn.is-recording { background: var(--rec-color); color: white; }

        input[type="file"] { display: none; }

        /* Tools */
        .tools-section {
            grid-column: 1 / -1;
            display: flex;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn:hover { background: #444; }
        .btn-play { background: var(--accent-color); color: #000; }
        .btn-stop { background: #ff3333; }

        .bpm-display {
            background: #000;
            color: var(--accent-color);
            font-family: monospace;
            font-size: 1.5rem;
            padding: 5px 15px;
            border-radius: 4px;
            border: 1px solid #333;
            min-width: 60px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .station-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>Live Loop Station</h1>

    <div class="station-container">
        <div class="deck-section">
            <h3 style="margin:0 0 10px 0;">Backing Track Deck</h3>
            
            <canvas id="visualizer" class="visualizer-box"></canvas>
            
            <div style="display:flex; gap:10px;">
                <button class="btn" onclick="document.getElementById('deckInput').click()">Load Song</button>
                <input type="file" id="deckInput" accept="audio/*">
                <button class="btn btn-play" id="playPauseBtn">Play</button>
                <div id="trackName" style="align-self:center; font-size:0.8rem; color:#888;">No track loaded</div>
            </div>

            <div class="control-group">
                <span class="control-label">Volume</span>
                <input type="range" id="deckVolume" min="0" max="1" step="0.01" value="0.8">
            </div>

            <div class="control-group">
                <span class="control-label">Pitch / Speed</span>
                <input type="range" id="deckSpeed" min="0.5" max="1.5" step="0.01" value="1">
            </div>

            <div class="control-group">
                <span class="control-label">Filter (Low Pass / High Pass)</span>
                <input type="range" id="deckFilter" min="-100" max="100" step="1" value="0">
            </div>
        </div>

        <div class="loop-section">
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0;">Sampler / Looper</h3>
                <button class="btn btn-stop" style="padding: 5px 10px; font-size:0.7rem;" onclick="stopAllLoops()">Stop All</button>
            </div>

            <div class="loop-grid" id="loopGrid">
                </div>
            <p style="font-size: 12px; color: #666; margin-top: 5px;">*Click ⏺ to Record, Click again to Loop.</p>
        </div>

        <div class="tools-section">
            <div style="display:flex; flex-direction:column; align-items:center;">
                <span class="control-label">BPM TAPPER</span>
                <div style="display:flex; gap:10px;">
                    <button class="btn" id="tapBtn">TAP</button>
                    <div class="bpm-display" id="bpmDisplay">--</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- AUDIO CONTEXT SETUP ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        // --- MAIN DECK LOGIC (Backing Track) ---
        const deckAudio = new Audio();
        deckAudio.loop = false;
        const deckSource = audioCtx.createMediaElementSource(deckAudio);
        const deckGain = audioCtx.createGain();
        const deckFilter = audioCtx.createBiquadFilter();
        const analyser = audioCtx.createAnalyser();

        deckSource.connect(deckFilter);
        deckFilter.connect(deckGain);
        deckGain.connect(analyser);
        deckGain.connect(audioCtx.destination);
        analyser.fftSize = 256;

        // UI References
        const deckInput = document.getElementById('deckInput');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const deckVolSlider = document.getElementById('deckVolume');
        const deckSpeedSlider = document.getElementById('deckSpeed');
        const deckFilterSlider = document.getElementById('deckFilter');

        deckInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file){
                deckAudio.src = URL.createObjectURL(file);
                document.getElementById('trackName').innerText = file.name.substring(0, 20);
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (deckAudio.paused) {
                deckAudio.play();
                playPauseBtn.innerText = "Pause";
                playPauseBtn.classList.add("btn-stop");
            } else {
                deckAudio.pause();
                playPauseBtn.innerText = "Play";
                playPauseBtn.classList.remove("btn-stop");
            }
        });

        deckVolSlider.addEventListener('input', (e) => deckGain.gain.value = e.target.value);
        deckSpeedSlider.addEventListener('input', (e) => deckAudio.playbackRate = e.target.value);
        
        deckFilter.type = 'allpass';
        deckFilter.frequency.value = 20000;
        deckFilterSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) deckFilter.type = 'allpass';
            else if (val < 0) {
                deckFilter.type = 'lowpass';
                deckFilter.frequency.value = 20000 * Math.pow(100 + val, 2) / 10000 + 100;
            } else {
                deckFilter.type = 'highpass';
                deckFilter.frequency.value = (val / 100) * 5000;
            }
        });

        // --- RECORDING & LOOP GRID LOGIC ---
        const loopGrid = document.getElementById('loopGrid');
        const loopers = []; // Store state for each pad

        // Microphone Setup
        let mediaRecorder = null;
        let audioChunks = [];
        let activeRecIndex = -1; // Which pad is currently recording?

        async function setupMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                return stream;
            } catch (err) {
                alert("Microphone access denied! Check browser settings.");
                console.error(err);
                return null;
            }
        }

        // Generate 9 Pads
        for(let i=0; i<9; i++) createPad(i);

        function createPad(index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'pad-wrapper';

            const pad = document.createElement('div');
            pad.className = 'loop-pad';
            pad.id = `pad-${index}`;
            pad.innerHTML = `<span class="pad-label">Empty</span>`;
            
            // Upload Button
            const loadBtn = document.createElement('div');
            loadBtn.className = 'pad-ctrl load-btn';
            loadBtn.innerHTML = '📂';
            loadBtn.title = "Load File";
            
            // Record Button
            const recBtn = document.createElement('div');
            recBtn.className = 'pad-ctrl rec-btn';
            recBtn.id = `rec-btn-${index}`;
            recBtn.innerHTML = '⏺';
            recBtn.title = "Record Mic";

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'audio/*';

            const state = {
                audio: new Audio(),
                loaded: false,
                playing: false,
                recording: false
            };
            state.audio.loop = true;
            loopers.push(state);

            // --- Handlers ---

            // 1. File Upload
            loadBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file) {
                    setAudioForPad(index, URL.createObjectURL(file), "File");
                }
            });

            // 2. Recording
            recBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                // If currently recording THIS pad, stop it
                if (activeRecIndex === index) {
                    stopRecording(index);
                    return;
                }

                // If recording another pad, ignore or warn (simplification: only 1 rec at a time)
                if (activeRecIndex !== -1) return;

                // START RECORDING
                const stream = await setupMic();
                if (!stream) return;

                activeRecIndex = index;
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.start();
                
                // UI Updates
                pad.classList.add('recording');
                recBtn.classList.add('is-recording');
                pad.innerHTML = `<span class="pad-label" style="color:white">RECORDING...</span>`;

                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });

                mediaRecorder.addEventListener("stop", () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); // webm is standard for browser rec
                    const audioUrl = URL.createObjectURL(audioBlob);
                    setAudioForPad(index, audioUrl, "Live Loop");
                    
                    // Auto Play Loop after recording
                    togglePadPlay(index); 
                });
            });

            // 3. Play/Pause Pad
            pad.addEventListener('click', () => {
                // Prevent clicking pad while recording
                if(activeRecIndex === index) {
                    stopRecording(index); // Clicking main pad also stops recording
                    return;
                }
                togglePadPlay(index);
            });

            wrapper.appendChild(pad);
            wrapper.appendChild(loadBtn);
            wrapper.appendChild(recBtn);
            wrapper.appendChild(fileInput);
            loopGrid.appendChild(wrapper);
        }

        function stopRecording(index) {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                // Reset UI
                const pad = document.getElementById(`pad-${index}`);
                const recBtn = document.getElementById(`rec-btn-${index}`);
                pad.classList.remove('recording');
                recBtn.classList.remove('is-recording');
                activeRecIndex = -1;
            }
        }

        function setAudioForPad(index, src, labelText) {
            loopers[index].audio.src = src;
            loopers[index].loaded = true;
            loopers[index].audio.currentTime = 0;
            const pad = document.getElementById(`pad-${index}`);
            pad.classList.add('loaded');
            pad.innerHTML = `<span class="pad-label">${labelText} ${index+1}</span>`;
        }

        function togglePadPlay(index) {
            const state = loopers[index];
            const pad = document.getElementById(`pad-${index}`);

            if(!state.loaded) return;

            if(state.playing) {
                state.audio.pause();
                state.audio.currentTime = 0;
                state.playing = false;
                pad.classList.remove('playing');
            } else {
                state.audio.play();
                state.playing = true;
                pad.classList.add('playing');
            }
        }

        function stopAllLoops() {
            loopers.forEach((looper, index) => {
                if(looper.playing) {
                    looper.audio.pause();
                    looper.audio.currentTime = 0;
                    looper.playing = false;
                    document.getElementById(`pad-${index}`).classList.remove('playing');
                }
            });
        }

        // --- VISUALIZER ---
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;
            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2;
                ctx.fillStyle = `rgb(${barHeight + 100}, 50, 255)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }
        drawVisualizer();

        // --- BPM TAPPER ---
        const tapBtn = document.getElementById('tapBtn');
        const bpmDisplay = document.getElementById('bpmDisplay');
        let taps = [];
        tapBtn.addEventListener('click', () => {
            const now = Date.now();
            if (taps.length > 0 && now - taps[taps.length - 1] > 2000) taps = [];
            taps.push(now);
            if (taps.length > 4) taps.shift();
            if (taps.length > 1) {
                let intervals = [];
                for(let i=0; i<taps.length-1; i++) intervals.push(taps[i+1] - taps[i]);
                const avg = intervals.reduce((a,b)=>a+b) / intervals.length;
                bpmDisplay.innerText = Math.round(60000 / avg);
            } else bpmDisplay.innerText = "--";
        });
    </script>
</body>
</html>
