<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon – Bioluminescent Equalizer Field</title>

<style>
body { margin: 0; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }

#audioPanel {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 10;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 8px;
  backdrop-filter: blur(6px);
}
#audioPanel button {
  background: #00ffd0;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
#audioPanel input {
  display: none;
  margin-top: 8px;
}
</style>
</head>

<body>

<div id="audioPanel">
  <button id="toggleAudio">Upload Song</button>
  <input type="file" id="audioFile" accept="audio/*">
</div>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.125.2";
import { GLTFLoader } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/loaders/GLTFLoader.js";
import { Flow } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/modifiers/CurveModifier.js";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.125.2/examples/jsm/controls/OrbitControls.js";

class Sketch {
constructor() {
  this.scene = new THREE.Scene();
  this.scene.background = new THREE.Color(0x050510);
  this.scene.fog = new THREE.FogExp2(0x050510, 0.08);

  this.renderer = new THREE.WebGLRenderer({ antialias: true });
  this.renderer.setSize(innerWidth, innerHeight);
  this.renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  this.renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(this.renderer.domElement);

  this.camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 500);
  this.camera.position.set(0, 3, 6);

  this.controls = new OrbitControls(this.camera, this.renderer.domElement);
  this.clock = new THREE.Clock();
  this.tasks = [];

  /* AUDIO */
  this.audioCtx = null;
  this.analyser = null;
  this.freqData = null;
  this.audioEnergy = { low: 0, mid: 0, high: 0 };

  this.init();
  this.initAudio();
  this.animate();
}

initAudio() {
  const btn = document.getElementById("toggleAudio");
  const input = document.getElementById("audioFile");

  btn.onclick = () => input.style.display = input.style.display === "block" ? "none" : "block";

  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    this.audioCtx = new AudioContext();
    this.analyser = this.audioCtx.createAnalyser();
    this.analyser.fftSize = 1024;
    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);

    const audio = new Audio(URL.createObjectURL(file));
    audio.loop = true;
    audio.play();

    const src = this.audioCtx.createMediaElementSource(audio);
    src.connect(this.analyser);
    this.analyser.connect(this.audioCtx.destination);
  };
}

init() {
  this.scene.add(new THREE.AmbientLight(0x4466ff, 0.6));
  const p = new THREE.PointLight(0x00ffff, 20, 40);
  p.position.set(0, 3, 0);
  this.scene.add(p);

  this.createGround();
  this.createGrass();
  this.loadFish();
}

createGround() {
  const g = new THREE.PlaneGeometry(200, 200);
  const m = new THREE.MeshStandardMaterial({ color: 0x060616, roughness: 0.2, metalness: 0.6 });
  const floor = new THREE.Mesh(g, m);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1;
  this.scene.add(floor);
}

createGrass() {
  const strands = 18000;
  const per = 60;
  const total = strands * per;

  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(total * 3);
  const rand = new Float32Array(total * 4);

  for (let i = 0; i < strands; i++) {
    const rx = (Math.random() - .5) * 60;
    const rz = (Math.random() - .5) * 60;
    const xd = (Math.random() - .5) * 2;
    const zd = (Math.random() - .5) * 2;
    const sp = .5 + Math.random() * 2;
    const lm = .5 + Math.random() * 2;

    for (let j = 0; j < per; j++) {
      const id = i * per + j;
      pos[id * 3] = rx;
      pos[id * 3 + 1] = j * .012;
      pos[id * 3 + 2] = rz;
      rand.set([xd, zd, sp, lm], id * 4);
    }
  }

  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("aRandom", new THREE.BufferAttribute(rand, 4));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uLow: { value: 0 },
      uMid: { value: 0 },
      uHigh: { value: 0 }
    },
    vertexShader: `
      uniform float uTime, uLow;
      attribute vec4 aRandom;
      varying float vH;
      void main() {
        vec3 p = position;
        p.y *= aRandom.w * (1.0 + uLow * 3.0);
        float t = uTime * aRandom.z;
        float sway = sin(t - p.y * 4.0) * (p.y * 0.3 + uLow);
        p.x += sway * aRandom.x;
        p.z += sway * aRandom.y;
        vH = p.y;
        vec4 mv = modelViewMatrix * vec4(p,1.);
        gl_PointSize = (26. + aRandom.w * 20. + uLow * 50.) * (1. / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform float uLow, uMid, uHigh;
      varying float vH;
      void main() {
        float d = distance(gl_PointCoord, vec2(.5));
        if (d > .5) discard;

        vec3 low = vec3(0.0, 1.0, 1.0);
        vec3 mid = vec3(0.3, 1.0, 0.4);
        vec3 high = vec3(1.0, 0.2, 1.0);

        vec3 col = low * uLow + mid * uMid + high * uHigh;
        col += vH * 0.25;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    transparent: true,
    depthWrite: false
  });

  const pts = new THREE.Points(geo, mat);
  pts.position.y = -1;
  this.scene.add(pts);

  this.tasks.push(() => {
    mat.uniforms.uTime.value = this.clock.getElapsedTime();
    if (!this.analyser) return;

    this.analyser.getByteFrequencyData(this.freqData);
    const l = this.freqData.slice(0, 60);
    const m = this.freqData.slice(60, 200);
    const h = this.freqData.slice(200);

    mat.uniforms.uLow.value = l.reduce((a,b)=>a+b,0)/l.length/255;
    mat.uniforms.uMid.value = m.reduce((a,b)=>a+b,0)/m.length/255;
    mat.uniforms.uHigh.value = h.reduce((a,b)=>a+b,0)/h.length/255;
  });
}

loadFish() {
  const loader = new GLTFLoader();
  loader.load("https://assets.codepen.io/5946/fish.glb", g => {
    const fish = g.scene.children[0];

    fish.traverse(c => {
      if (!c.isMesh) return;
      c.material = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 2.5,
        roughness: 0.2,
        metalness: 0.6
      });
    });

    fish.scale.set(2.2, 2.2, 2.2);
    fish.rotation.x = Math.PI / 2;

    const pts = [];
    for (let i = 0; i < Math.PI * 2; i += Math.PI / 120) {
      pts.push(new THREE.Vector3(Math.sin(i) * 2.5, 0, Math.cos(i) * 2.5));
    }

    const curve = new THREE.CatmullRomCurve3(pts);
    const flow = new Flow(fish);
    flow.updateCurve(0, curve);
    this.scene.add(flow.object3D);

    this.tasks.push(() => {
      flow.moveAlongCurve(0.0015);
      fish.scale.setScalar(2.2 + (this.audioEnergy?.low || 0) * 0.6);
    });
  });
}

animate() {
  requestAnimationFrame(() => this.animate());
  this.tasks.forEach(t => t());
  this.renderer.render(this.scene, this.camera);
}
}

new Sketch();
</script>
</body>
</html>
